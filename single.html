        '<rect x="-14" y="-6" width="28" height="28" rx="4" fill="#e6d3b3"/>' +
        '<rect x="-14" y="-6" width="28" height="8" rx="3" fill="#d3bd98"/>' +
        '<path d="M0,-30 L18,-6 L-18,-6 Z" fill="#d96a5a"/>' +
        '<rect x="-4" y="8" width="8" height="14" rx="3" fill="#7d5a3a"/>' +
        '<rect x="12" y="-30" width="2.5" height="14" fill="#8a5a32"/>' +
        '<path d="M14.5,-30 L26,-26 L14.5,-21 Z" fill="#f5c451"/>' +
      '</g>' +
      /* 桥 */
      '<g id="' + id + '-bridge">' +
        '<rect x="-34" y="-7" width="68" height="14" rx="6" fill="#c08a52"/>' +
        '<rect x="-34" y="-7" width="68" height="5" rx="2.5" fill="#d9a468"/>' +
        '<rect x="-30" y="-16" width="4" height="10" rx="2" fill="#a9763f"/>' +
        '<rect x="26" y="-16" width="4" height="10" rx="2" fill="#a9763f"/>' +
      '</g>' +
      /* 宝箱 */
      '<g id="' + id + '-chest">' +
        '<rect x="-20" y="-4" width="40" height="22" rx="5" fill="#c08a52"/>' +
        '<path d="M-20,-4 a20,14 0 0 1 40,0 z" fill="#e0a866"/>' +
        '<rect x="-4" y="-2" width="8" height="12" rx="3" fill="#f5c451"/>' +
        '<rect x="-20" y="7" width="40" height="4" fill="#a9763f" opacity="0.6"/>' +
      '</g>' +
      /* 旗帜 */
      '<g id="' + id + '-flag">' +
        '<rect x="-1.6" y="-26" width="3.2" height="34" rx="1.6" fill="#8a5a32"/>' +
        '<path d="M1.6,-26 L24,-19 L1.6,-11 Z" fill="#ef6b47"/>' +
      '</g>' +
      /* 星星 */
      '<path id="' + id + '-star" d="M0,-10 L3.1,-3.3 L10.4,-2.4 L5,-2.6 L3.1,4.2 L1.2,-2.6 L-4.2,-2.4 Z" ' +
        'transform="scale(1.5)" fill="#f5c451" stroke="#e0a32f" stroke-width="0.6"/>' +
      /* 锁 */
      '<g id="' + id + '-lock">' +
        '<path d="M-8,-6 a8,8 0 0 1 16,0" fill="none" stroke="#8fa3b4" stroke-width="4.4" stroke-linecap="round"/>' +
        '<rect x="-11" y="-6" width="22" height="18" rx="5" fill="#aebecd"/>' +
        '<circle cx="0" cy="2" r="2.6" fill="#7b8fa1"/>' +
      '</g>' +
      /* 完成勾 */
      '<g id="' + id + '-check">' +
        '<circle cx="0" cy="0" r="12" fill="#12a37a" stroke="#ffffff" stroke-width="3"/>' +
        '<path d="M-5.5,0.5 L-1.5,5 L6,-4" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</g>' +
      /* 关卡图标：营地 / 森林 / 山丘 / 河谷 / 城堡 */
      '<g id="' + id + '-ico-0"><use href="#' + id + '-tent" transform="scale(0.9)"/></g>' +
      '<g id="' + id + '-ico-1"><use href="#' + id + '-tree" transform="scale(0.85)"/></g>' +
      '<g id="' + id + '-ico-2">' +
        '<path d="M-24,12 L-4,-16 L10,4 L18,-6 L26,12 Z" fill="#8fc47a"/>' +
        '<path d="M-4,-16 L10,4 L-14,6 Z" fill="#a9d894"/>' +
      '</g>' +
      '<g id="' + id + '-ico-3"><use href="#' + id + '-bridge" transform="scale(0.72)"/></g>' +
      '<g id="' + id + '-ico-4"><use href="#' + id + '-tower" transform="scale(0.95)"/></g>' +
      '<g id="' + id + '-ico-5"><use href="#' + id + '-chest" transform="scale(1.05)"/></g>' +
      '</defs>';
  }

  function iconFor(index) {
    return 'ico-' + (index % 6);
  }

  /* ---------------- 地形 ---------------- */
  function terrainHTML(id, cfg, nodePts) {
    var vb = cfg.vb;
    var W = vb[2], H = vb[3];
    var b = bounds(nodePts, 90);
    var coast = Math.max(60, b.top - 150);          // 海岸线高度
    var out = [];

    // 天空
    out.push('<rect x="' + vb[0] + '" y="' + vb[1] + '" width="' + W + '" height="' + H + '" fill="url(#' + id + '-sky)"/>');
    // 太阳光晕
    var sunX = W * 0.1, sunY = H * 0.09;
    out.push('<circle cx="' + sunX + '" cy="' + sunY + '" r="' + (W * 0.12) + '" fill="url(#' + id + '-glow)" opacity="0.55"/>');
    out.push('<circle cx="' + sunX + '" cy="' + sunY + '" r="22" fill="#ffe9a8"/>');
    // 云
    [[W * 0.34, H * 0.07, 1], [W * 0.62, H * 0.045, 0.85], [W * 0.86, H * 0.1, 0.7]].forEach(function (c) {
      out.push('<use href="#' + id + '-cloud" x="' + c[0] + '" y="' + c[1] + '" transform="translate(' + c[0] + ',' + c[1] + ') scale(' + c[2] + ')"/>');
    });
    // 远山
    out.push('<path d="M0,' + coast + ' L' + (W * 0.18) + ',' + (coast - 76) + ' L' + (W * 0.34) + ',' + coast +
      ' L' + (W * 0.52) + ',' + (coast - 54) + ' L' + (W * 0.7) + ',' + coast + ' L' + W + ',' + (coast - 62) +
      ' L' + W + ',' + coast + ' Z" fill="#9dc7d8" opacity="0.75"/>');
    out.push('<path d="M0,' + coast + ' L' + (W * 0.24) + ',' + (coast - 44) + ' L' + (W * 0.46) + ',' + coast +
      ' L' + (W * 0.66) + ',' + (coast - 34) + ' L' + W + ',' + coast + ' Z" fill="#8bb8cc" opacity="0.85"/>');
    // 海面
    out.push('<rect x="0" y="' + coast + '" width="' + W + '" height="' + Math.max(40, H - coast) + '" fill="url(#' + id + '-sea)" opacity="0.55"/>');
    // 海浪
    [[W * 0.12, coast + 26], [W * 0.44, coast + 16], [W * 0.78, coast + 32]].forEach(function (p) {
      out.push('<use href="#' + id + '-wave" transform="translate(' + p[0] + ',' + p[1] + ')"/>');
    });
    // 主陆地：带波浪海岸线的圆润大地块
    var landTop = coast + 26;
    var landBottom = H + 40;
    var seg = 6, step = W / seg, d = 'M-40,' + landBottom + ' L-40,' + (landTop + 24);
    for (var i = 0; i < seg; i++) {
      var x1 = i * step + step * 0.5, y1 = landTop + (i % 2 === 0 ? -22 : 18);
      var x2 = (i + 1) * step;
      d += ' Q ' + x1 + ',' + y1 + ' ' + x2 + ',' + (landTop + (i % 2 === 0 ? 6 : -8));
    }
    d += ' L' + (W + 40) + ',' + landBottom + ' Z';
    out.push('<path d="' + d + '" fill="url(#' + id + '-land)"/>');
    // 内陆草地色块
    out.push('<path d="M-40,' + (landTop + 120) + ' Q ' + (W * 0.3) + ',' + (landTop + 70) + ' ' + (W * 0.58) + ',' + (landTop + 130) +
      ' T ' + (W + 40) + ',' + (landTop + 90) + ' L' + (W + 40) + ',' + landBottom + ' L-40,' + landBottom + ' Z" fill="#93d271" opacity="0.55"/>');

    // 山丘（两块，摆在路两侧空处）
    var hillA = beside(nodePts[0], nodePts[1], 150);
    out.push('<ellipse cx="' + (nodePts[0][0] + hillA[0] * 1.6) + '" cy="' + (nodePts[0][1] + hillA[1] * 1.6) + '" rx="78" ry="40" fill="url(#' + id + '-hill)" opacity="0.95"/>');
    var hillB = beside(nodePts[2], nodePts[3], -160);
    out.push('<ellipse cx="' + (nodePts[2][0] + hillB[0] * 1.4) + '" cy="' + (nodePts[2][1] + hillB[1] * 1.4) + '" rx="70" ry="36" fill="url(#' + id + '-hill)" opacity="0.9"/>');

    // 小河：从内陆流到海里，穿过第 2→3 关之间的路
    var cross = lerp(nodePts[1], nodePts[2], 0.52);
    var riverTop = cross[1] - 150, riverBottom = cross[1] + 170;
    out.push('<path d="M' + (cross[0] - 40) + ',' + riverTop +
      ' C ' + (cross[0] + 24) + ',' + (cross[1] - 90) + ' ' + (cross[0] - 26) + ',' + (cross[1] - 30) + ' ' + cross[0] + ',' + cross[1] +
      ' C ' + (cross[0] + 26) + ',' + (cross[1] + 60) + ' ' + (cross[0] - 18) + ',' + (cross[1] + 110) + ' ' + (cross[0] - 6) + ',' + riverBottom +
      '" fill="none" stroke="#8fd8ef" stroke-width="26" stroke-linecap="round"/>');
    out.push('<path d="M' + (cross[0] - 40) + ',' + riverTop +
      ' C ' + (cross[0] + 24) + ',' + (cross[1] - 90) + ' ' + (cross[0] - 26) + ',' + (cross[1] - 30) + ' ' + cross[0] + ',' + cross[1] +
      ' C ' + (cross[0] + 26) + ',' + (cross[1] + 60) + ' ' + (cross[0] - 18) + ',' + (cross[1] + 110) + ' ' + (cross[0] - 6) + ',' + riverBottom +
      '" fill="none" stroke="#c9effb" stroke-width="16" stroke-linecap="round" stroke-dasharray="18 22" opacity="0.8"/>');
    // 桥：架在小路与河的交点
    out.push('<g transform="translate(' + cross[0] + ',' + (cross[1] + 2) + ') rotate(' +
      (Math.atan2(nodePts[2][1] - nodePts[1][1], nodePts[2][0] - nodePts[1][0]) * 180 / Math.PI) + ')" class="map-bridge">' +
      '<use href="#' + id + '-bridge"/></g>');

    // 森林与点缀：沿路两旁布置，宽窄两种版式都自然贴合
    var decos = [];
    var forestSpots = [0.35, 0.75, 1.55, 2.35];
    forestSpots.forEach(function (t, i) {
      var idx = Math.min(Math.floor(t), nodePts.length - 2);
      var p = lerp(nodePts[idx], nodePts[idx + 1] || nodePts[idx], t - idx);
      var off = beside(nodePts[idx], nodePts[idx + 1] || nodePts[idx], (i % 2 === 0 ? 1 : -1) * (86 + i * 12));
      decos.push('<g transform="translate(' + (p[0] + off[0]) + ',' + (p[1] + off[1]) + ') scale(' + (0.95 + (i % 3) * 0.18) + ')">' +
        '<use href="#' + id + '-pine" x="-14" y="-14"/><use href="#' + id + '-tree" x="16" y="-8"/><use href="#' + id + '-bush" x="2" y="14"/></g>');
    });
    var rockSpots = [0.6, 1.3, 2.6];
    rockSpots.forEach(function (t, i) {
      var idx = Math.min(Math.floor(t), nodePts.length - 2);
      var p = lerp(nodePts[idx], nodePts[idx + 1] || nodePts[idx], t - idx);
      var off = beside(nodePts[idx], nodePts[idx + 1] || nodePts[idx], (i % 2 === 0 ? -1 : 1) * 70);
      decos.push('<use href="#' + id + '-rock" transform="translate(' + (p[0] + off[0]) + ',' + (p[1] + off[1]) + ') scale(' + (0.9 + i * 0.12) + ')"/>');
    });
    out.push(decos.join(''));
    return out.join('');
  }

  /* ---------------- 小路 ---------------- */
  function trailHTML(cfg, nodePts, clearedCount) {
    var d = ZCD.ui.smoothPath(nodePts);
    var out = [];
    out.push('<path class="trail-shadow" d="' + d + '" fill="none" stroke="#6aa85a" stroke-width="' + (26 * cfg.unit) +
      '" stroke-linecap="round" opacity="0.28" transform="translate(0,' + (5 * cfg.unit) + ')"/>');
    out.push('<path class="trail-base" d="' + d + '" fill="none" stroke="#ffffff" stroke-width="' + (24 * cfg.unit) + '" stroke-linecap="round" opacity="0.9"/>');
    out.push('<path class="trail" d="' + d + '" fill="none" stroke="url(#' + cfg.id + '-sand)" stroke-width="' + (19 * cfg.unit) + '" stroke-linecap="round"/>');
    out.push('<path class="trail-stitch" d="' + d + '" fill="none" stroke="#c9a468" stroke-width="' + (3 * cfg.unit) +
      '" stroke-dasharray="' + (10 * cfg.unit) + ' ' + (12 * cfg.unit) + '" stroke-linecap="round" opacity="0.85"/>');
    if (clearedCount > 0) {
      var donePts = nodePts.slice(0, Math.min(clearedCount + 1, nodePts.length));
      if (donePts.length >= 2) {
        out.push('<path class="trail-done" d="' + ZCD.ui.smoothPath(donePts) + '" fill="none" stroke="#7fd0a6" stroke-width="' + (19 * cfg.unit) +
          '" stroke-linecap="round" opacity="0.92"/>');
      }
    }
    return out.join('');
  }

  /* ---------------- 关卡节点 ---------------- */
  function nodeHTML(id, cfg, item, pt, index) {
    var r = item.cleared || !item.unlocked ? cfg.badge : cfg.available;
    var state = item.cleared ? 'is-cleared' : (item.unlocked ? 'is-available' : 'is-locked');
    var g = [];
    var label = item.name + '：' + (item.cleared ? '已完成' : (item.unlocked ? '可以挑战' : '未解锁'));

    // 脚下的岛屿 / 平台
    g.push('<ellipse class="node-platform" cx="' + pt[0] + '" cy="' + (pt[1] + r + 14) + '" rx="' + (r + 22) + '" ry="' + (r * 0.42 + 8) + '"/>');
    // 高亮光环（可挑战）
    if (state === 'is-available') {
      g.push('<circle class="node-halo" cx="' + pt[0] + '" cy="' + pt[1] + '" r="' + (r + 14) + '"/>');
      g.push('<circle class="node-halo-inner" cx="' + pt[0] + '" cy="' + pt[1] + '" r="' + (r + 7) + '"/>');
      g.push('<g class="node-banner" transform="translate(' + pt[0] + ',' + (pt[1] - r - 34) + ') scale(1.35)"><use href="#' + id + '-flag"/></g>');
    }
    // 徽章
    g.push('<circle class="node-badge" cx="' + pt[0] + '" cy="' + pt[1] + '" r="' + r + '"/>');
    g.push('<circle class="node-badge-inner" cx="' + pt[0] + '" cy="' + (pt[1] - r * 0.16) + '" r="' + (r * 0.8) + '"/>');
    // 图标
    if (state === 'is-locked') {
      g.push('<use class="node-icon" href="#' + id + '-lock" transform="translate(' + pt[0] + ',' + pt[1] + ') scale(' + (r / 30) + ')"/>');
    } else {
      g.push('<use class="node-icon" href="#' + id + '-' + iconFor(index) + '" transform="translate(' + pt[0] + ',' + (pt[1] + r * 0.12) + ') scale(' + (r / 30) + ')"/>');
    }
    // 完成标记
    if (state === 'is-cleared') {
      g.push('<use class="node-check" href="#' + id + '-check" transform="translate(' + (pt[0] + r * 0.72) + ',' + (pt[1] - r * 0.72) + ') scale(' + (r / 34) + ')"/>');
    }
    // 星星：直接来自真实最好成绩
    var stars = util.starsText(item.stars || 0, 3);
    var starY = pt[1] + r + 38 * cfg.unit;
    g.push('<text class="node-stars" x="' + pt[0] + '" y="' + starY + '" style="font-size:' + (22 * cfg.unit) + 'px">' + stars + '</text>');
    // 关卡名称（地图上一眼能认出来；完整信息在点击后的面板里）
    var labelSize = (cfg.labelScale || 1) * 14 * cfg.unit;
    var label = item.name.length > 9 ? item.name.slice(0, 9) + '…' : item.name;
    g.push('<text class="node-label" x="' + pt[0] + '" y="' + (starY + labelSize + 6 * cfg.unit) + '" style="font-size:' + labelSize + 'px">' + esc(label) + '</text>');
    // 未解锁：写明解锁条件
    if (state === 'is-locked') {
      var hint = '通过关卡 ' + (item.level - 1) + ' 后解锁';
      var bw = 132 * cfg.unit, bh = 24 * cfg.unit, by = starY + labelSize + 16 * cfg.unit;
      g.push('<rect class="node-lock-bg" x="' + (pt[0] - bw / 2) + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="' + (bh / 2) + '"/>');
      g.push('<text class="node-lock-hint" x="' + pt[0] + '" y="' + (by + bh * 0.72) + '" style="font-size:' + (14 * cfg.unit) + 'px">' + esc(hint) + '</text>');
      label += '，' + hint;
    }
    // 点击热区：透明但可点，保证触控尺寸
    g.push('<circle class="node-hit" cx="' + pt[0] + '" cy="' + pt[1] + '" r="' + (r + 20) + '" fill="transparent"/>');

    return '<g class="map-node ' + state + '" data-level="' + item.level + '" role="button" tabindex="0"' +
      (item.unlocked ? '' : ' aria-disabled="true"') +
      ' aria-label="' + esc(label) + '">' + g.join('') + '</g>';
  }

  /* ---------------- 场景装饰：营地与宝箱 ---------------- */
  function campAndChest(id, cfg, nodePts, levels) {
    var first = nodePts[0];
    var last = nodePts[nodePts.length - 1];
    var out = [];
    // 营地（起点）
    out.push('<g class="map-camp" transform="translate(' + (first[0] - cfg.badge - 52) + ',' + (first[1] + 26) + ')">' +
      '<use href="#' + id + '-tent" transform="scale(1.15)"/>' +
      '<ellipse cx="26" cy="16" rx="16" ry="6" fill="#8a5a32" opacity="0.35"/>' +
      '<use href="#' + id + '-bush" transform="translate(30,6) scale(0.7)"/>' +
      '</g>');
    // 宝箱（终点）
    var allCleared = levels.every(function (l) { return l.cleared; });
    out.push('<g class="map-chest' + (allCleared ? ' is-open' : '') + '" transform="translate(' + (last[0] + 46) + ',' + (last[1] - 52) + ') scale(1.15)">' +
      '<use href="#' + id + '-chest"/>' +
      (allCleared ? '<circle cx="0" cy="6" r="34" fill="url(#' + id + '-glow)" opacity="0.9"/>' : '') +
      '</g>');
    // 终点标志
    out.push('<g class="map-finish" transform="translate(' + (last[0] + 46) + ',' + (last[1] - 92) + ') scale(0.9)">' +
      '<use href="#' + id + '-flag"/></g>');
    return out.join('');
  }

  /**
   * 生成地图 SVG
   * @param {Object} opts
   *   opts.levels  [{level, name, count, cleared, unlocked, stars}]  真实关卡数据
   *   opts.layout  'wide' | 'tall'（不传则按窗口宽度自动选择）
   *   opts.packName / opts.subject 用于无障碍描述
   * @returns {{svg:string, layout:string, nodeCount:number}}
   */
  function build(opts) {
    opts = opts || {};
    var levels = opts.levels || [];
    var layoutKey = opts.layout === 'tall' || opts.layout === 'wide' ? opts.layout : layoutFor(opts.width);
    var cfg = LAYOUTS[layoutKey];
    var id = 'zcdm' + (++uid);
    var nodePts = levels.map(function (l, i) {
      var base = cfg.nodes[i % cfg.nodes.length];
      // 超过 5 关时，额外的关卡沿路径继续延伸，避免重叠
      var overflow = Math.floor(i / cfg.nodes.length);
      return [base[0] + overflow * 34, base[1] + overflow * 46];
    });
    cfg = Object.assign({}, cfg, { id: id });

    var clearedCount = 0;
    for (var i = 0; i < levels.length; i++) {
      if (levels[i].cleared) clearedCount = i + 1;
    }

    var vb = cfg.vb;
    var svg = '<svg class="adventure-map" viewBox="' + vb.join(' ') + '" preserveAspectRatio="xMidYMid meet" ' +
      'role="img" aria-label="' + esc((opts.packName || '知识包') + '的闯关地图，共 ' + levels.length + ' 个关卡') + '">' +
      defs(id) +
      terrainHTML(id, cfg, nodePts) +
      trailHTML(cfg, nodePts, clearedCount) +
      campAndChest(id, cfg, nodePts, levels) +
      levels.map(function (l, i) { return nodeHTML(id, cfg, l, nodePts[i], i); }).join('') +
      '</svg>';

    return { svg: svg, layout: layoutKey, nodeCount: levels.length };
  }

  ZCD.mapArt = {
    build: build,
    layoutFor: layoutFor,
    LAYOUTS: LAYOUTS
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
/*!
 * 知闯岛 · 学习大厅（游戏主界面）
 *
 * 布局：紧凑 HUD + 插画式冒险地图（视觉主体）+ 唯一主按钮「继续冒险」
 *       + 地图下方的辅助信息（今日任务 / 最近进度 / 知识掌握）+ 次级入口图标栏
 * 所有内容都由真实学习数据驱动，不使用任何假数据。
 */
(function (root) {
  'use strict';
  var ZCD = root.ZCD;
  var util = ZCD.util;
  var ui = ZCD.ui;
  ZCD.views = ZCD.views || {};

  function greeting() {
    var h = new Date().getHours();
    if (h < 6) return '夜深了，注意休息';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  /** 今日任务：全部由真实数据计算 */
  function dailyTasks(today) {
    return [
      { icon: '🎯', name: '完成 1 个关卡', cur: today.cleared, target: 1 },
      { icon: '✅', name: '答对 15 道题', cur: today.correct, target: 15 },
      { icon: '📕', name: '复习 3 道错题', cur: today.reviews, target: 3 }
    ];
  }

  function totalLevelCount() {
    var packs = ZCD.data.allPacks(), n = 0;
    for (var i = 0; i < packs.length; i++) n += ZCD.data.levelList(packs[i].id).length;
    return n;
  }

  /**
   * 首页要展示哪个知识包的地图？
   *
   * 只认「真实发生过的事情」，绝不猜测：
   *   1. 上次挑战的知识包（真实记录）
   *   2. 有进度但没通关的知识包（真实记录）
   *   3. 用户主动选择过的知识包（选了年级学科还没选包时，用该组合下的包）
   *   4. 都没有 → 返回 null，首页显示引导态，不显示任何默认年级的地图
   * 多个来源时取时间最新的一个，保证「刚选完就能看到自己选的」。

    }

    ZCD.data.allPacks().forEach(function (p) {

      if (prog.cleared > 0 && !started) started = p;

        '<div class="notice notice-warn mt-16">' +
          '💾 学习数据保存在<b>当前设备与当前浏览器</b>里，不会自动跨设备同步；' +
          '切换年级或学科只会换学习内容，不会删除已有的答题记录、错题和星星。' +
        '</div>';
    },

    mount: function (ctx, main) {
      util.on(main, '[data-grade]', 'click', function (ev, el) {
        var g = Number(el.getAttribute('data-grade'));
        // 换了年级就重新走一遍学科选择，不再沿用上一个学科
        ZCD.router.go('/select', { grade: g });
      });
      util.on(main, '[data-subject]', 'click', function (ev, el) {
        var pick = resolvePick(ctx);
        var sub = el.getAttribute('data-subject');
        if (!pick.grade) { ZCD.ui.toast('先选择年级，再选择学科', 'warn'); return; }
        // 这里是用户主动选择：记下来（不动任何学习记录）
        ZCD.store.setChoice({ grade: pick.grade, subject: sub, packId: null });
        ZCD.router.go('/select', { grade: pick.grade, subject: sub });
      });
      util.on(main, '[data-reset-subject]', 'click', function () {
        var pick = resolvePick(ctx);
        ZCD.router.go('/select', { grade: pick.grade });
      });
      util.on(main, '[data-map]', 'click', function (ev, el) {
        var pick = resolvePick(ctx);
        var packId = el.getAttribute('data-map');
        var pack = ZCD.data.getPack(packId);
        // 选中知识包 = 完整的学习内容选择
        ZCD.store.setChoice({ grade: pack ? Number(pack.grade) : pick.grade, subject: pack ? pack.subject : pick.subject, packId: packId });
        ZCD.router.go('/map', { pack: packId });
      });
    }
  };

  /* ==================== 2. 知识包列表 ==================== */
  ZCD.views.packs = {
    render: function (ctx) {
      // 同样不做默认兜底：没有年级或学科时先让用户去选择
      var pick = resolvePick(ctx);
      var grade = pick.grade, subject = pick.subject;
      if (!grade || !subject) {
        return '<div class="view-title-row">' +
            '<div><h1 class="view-title">🧳 知识包</h1>' +
            '<p class="view-desc">还没有确定年级和学科，所以没有可展示的知识包。</p></div>' +
          '</div>' +
          '<div class="card">' + ui.empty('🧭', '请先选择年级和学科，再查看对应的知识包。',
            '<button class="btn btn-primary" data-go="/select">去选择年级与学科</button>') + '</div>';
      }
      var packs = ZCD.data.packsFor(grade, subject);
      var meta = ZCD.subjectMeta(subject);

      var listHTML = packs.map(function (p) {
        var prog = ZCD.store.packProgress(p.id);
        var dots = ZCD.data.levelList(p.id).map(function (l) {
          var st = ZCD.store.levelStat(p.id, l.level);
          var cleared = !!(st && st.cleared);
          var unlocked = ZCD.store.isLevelUnlocked(p.id, l.level);
          return '<i class="' + (cleared ? 'is-cleared' : (unlocked ? 'is-available' : 'is-locked')) + '" title="' +
            util.esc(l.name + '：' + (cleared ? '已完成' : (unlocked ? '可以挑战' : '未解锁'))) + '"></i>';
        }).join('');
        return '<div class="pack-card" style="border-top-color:' + meta.color + '">' +
          '<div class="pack-head"><div style="flex:1">' +
            '<div class="pack-name">' + util.esc(p.name) + '</div>' +
            '<div class="pack-intro">' + util.esc(p.intro || '') + '</div>' +
          '</div>' + ui.difficulty(p.difficulty) + '</div>' +
          '<div class="pack-meta-row">' + ui.gradeChip(p.grade) + ui.subjectChip(p.subject) +
            '<span class="chip chip-gray">' + prog.levels + ' 关</span>' +
            '<span class="chip chip-gray">共 ' + ZCD.data.questionsOf(p.id).length + ' 题</span></div>' +
          '<div>' + ui.bar(prog.percent, prog.finished ? 'bar-green' : '') +
            '<div class="row mt-8" style="justify-content:space-between">' +
              '<span class="text-xs text-muted">已完成 ' + prog.cleared + '/' + prog.levels + ' 关 · ⭐ ' + prog.stars + '</span>' +
              '<span class="level-dots">' + dots + '</span>' +
            '</div></div>' +
          '<div class="pack-foot"><button class="btn btn-primary" data-map="' + util.esc(p.id) + '">开始闯关</button></div>' +
        '</div>';
      }).join('') || ui.empty('🧳', '暂时没有知识包。');

      return '<div class="view-title-row">' +
          '<div><h1 class="view-title">' + meta.emoji + ' ' + ZCD.gradeLabel(grade) + ' · ' + meta.name + '</h1>' +
          '<p class="view-desc">共 ' + packs.length + ' 个知识包，每个知识包 5 个关卡、每关 5 道题。</p></div>' +
          '<div class="spacer"></div>' +
          '<button class="btn btn-soft btn-sm" data-go="/select">重新选择</button>' +
        '</div>' +
        '<div class="grid grid-2">' + listHTML + '</div>';
    },
    mount: function (ctx, main) {
      util.on(main, '[data-map]', 'click', function (ev, el) {
        ZCD.router.go('/map', { pack: el.getAttribute('data-map') });
      });
    }
  };

  /* ==================== 3. 闯关地图 ==================== */
  ZCD.views.map = {
    render: function (ctx) {
      var pack = ZCD.data.getPack(ctx.params.pack);
      if (!pack) {
        return '<div class="card">' + ui.empty('🧭', '没有找到这个知识包，它可能已被删除。',
          '<button class="btn btn-primary" data-go="/select">重新选择知识包</button>') + '</div>';
      }
      var levels = ZCD.data.levelList(pack.id);
      var prog = ZCD.store.packProgress(pack.id);
      var meta = ZCD.subjectMeta(pack.subject);

      // 真实关卡状态 → 地图数据（解锁规则完全沿用 store）
      var levelData = levels.map(function (l) {
        var st = ZCD.store.levelStat(pack.id, l.level);
        return {
          level: l.level,
          name: l.name,
          count: l.count,
          cleared: !!(st && st.cleared),
          unlocked: ZCD.store.isLevelUnlocked(pack.id, l.level),
          stars: st ? (st.bestStars || 0) : 0,
          accuracy: st ? (st.bestAccuracy || 0) : 0
        };
      });
      var map = ZCD.mapArt.build({ levels: levelData, packName: pack.name, width: root.innerWidth });
      var next = ZCD.lobbyHelpers.nextStop(pack.id, levelData);

      // 关卡状态一览（手机上也能一眼看清每一关的状态）
      var stripHTML = levels.map(function (l) {
        var st = ZCD.store.levelStat(pack.id, l.level);
        var cleared = !!(st && st.cleared);
        var unlocked = ZCD.store.isLevelUnlocked(pack.id, l.level);
        var cls = cleared ? 'is-cleared' : (unlocked ? 'is-available' : 'is-locked');
        var state = cleared
          ? ('✅ 已完成 ' + util.starsText(st.bestStars || 0, 3))
          : (unlocked ? '📍 可以挑战' : ('🔒 通过关卡 ' + (l.level - 1) + ' 后解锁'));
        return '<button class="level-strip-item ' + cls + '" data-strip-level="' + l.level + '" aria-label="' +
          util.esc(l.name + '：' + state) + '">' +
          '<span class="ls-idx">' + l.level + '</span>' +
          '<span><span class="ls-name">' + util.esc(l.name) + '</span><br><span class="ls-state">' + state + '</span></span>' +
        '</button>';
      }).join('');

      return '' +
        '<div class="view-title-row">' +
          '<div>' +
            '<h1 class="view-title">' + meta.emoji + ' ' + util.esc(pack.name) + '</h1>' +
            '<p class="view-desc">' + util.esc(pack.intro || '') + '</p>' +
          '</div>' +
          '<div class="spacer"></div>' +
          '<button class="btn btn-soft btn-sm" data-go="/select" data-confirm="leave-quiz">切换知识包</button>' +
        '</div>' +

        '<div class="card mb-12">' +
          '<div class="row">' + ui.gradeChip(pack.grade) + ui.subjectChip(pack.subject) +
            '<span class="chip chip-gray">' + levels.length + ' 个关卡</span>' +
            '<span class="chip chip-gray">每关 ' + (levels[0] ? levels[0].count : 5) + ' 道题</span>' +
            ui.difficulty(pack.difficulty) +
            (pack.custom ? '<span class="chip chip-violet">我的题库</span>' : '') +
            '<span class="spacer"></span>' +
            '<span class="text-sm"><b>⭐ ' + prog.stars + '</b> / ' + prog.maxStars + ' · 已完成 ' + prog.cleared + '/' + levels.length + ' 关</span>' +
          '</div>' +
          '<div class="mt-12">' + ui.bar(prog.percent, prog.finished ? 'bar-green' : '') + '</div>' +
        '</div>' +

        '<div class="map-wrap">' +
          '<div class="map-canvas">' + map.svg + '</div>' +
          '<div class="map-legend">' +
            '<span class="legend-item"><i class="legend-dot available"></i>可以挑战</span>' +
            '<span class="legend-item"><i class="legend-dot cleared"></i>已完成（可重复挑战）</span>' +
            '<span class="legend-item"><i class="legend-dot locked"></i>未解锁（节点上写明解锁条件）</span>' +
            '<span class="legend-item">🔓 规则：通过当前关卡后自动解锁下一关</span>' +
          '</div>' +
        '</div>' +

        '<div class="hero-bar mt-12">' +
          '<div class="hero-goal">' +
            '<span class="hero-goal-ico">🚩</span>' +
            '<div><div class="hero-goal-title">下一站：' + util.esc(next.name) + '</div>' +
            '<div class="hero-goal-sub">' + next.count + ' 道题 · ' + (next.cleared ? '已通关，可再挑战' : '还没通关') + '</div></div>' +
          '</div>' +
          '<div class="hero-cta-wrap">' +
            '<button class="btn btn-gold hero-cta" data-go="/quiz" data-pack="' + util.esc(pack.id) +
              '" data-level="' + next.level + '">▶ ' + (prog.cleared === 0 ? '开始冒险 · ' : '继续冒险 · ') + util.esc(next.name) + '</button>' +
          '</div>' +
        '</div>' +

        '<div class="card mt-12">' +
          '<h2 class="card-title"><span class="t-icon">🧭</span>关卡一览 <span class="hint">点击任意可挑战的关卡直接进入</span></h2>' +
          '<div class="level-strip">' + stripHTML + '</div>' +
        '</div>' +

        '<div class="grid grid-2 mt-16">' +
          '<div class="card"><h2 class="card-title">📌 本知识包的知识点</h2>' +
            '<div class="row row-tight">' + ZCD.data.pointsOf(pack.id).map(function (pt) {
              return '<span class="chip chip-gray">' + util.esc(pt) + '</span>';
            }).join('') + '</div>' +
          '</div>' +
          '<div class="card"><h2 class="card-title">🎁 奖励规则</h2>' +
            '<ul class="text-sm text-muted">' +
              '<li>· 正确率 ≥ 90%：3 星；≥ 70%：2 星；&lt; 70%：1 星</li>' +
              '<li>· 正确率 ≥ 60% 才能通关并解锁下一关</li>' +
              '<li>· 首次通关有额外经验，重复挑战不会重复领取</li>' +
              '<li>· 累计星星按每关历史最好成绩计算</li>' +
            '</ul>' +
          '</div>' +
        '</div>';
    },

    mount: function (ctx, main) {
      var pack = ZCD.data.getPack(ctx.params.pack);
      if (!pack) return;

      // 进入某个知识包的闯关地图 = 用户主动选择了这个知识包（只记选择，不动学习记录）
      ZCD.store.setChoice({ grade: Number(pack.grade), subject: pack.subject, packId: pack.id });

      // 点击地图节点（SVG）→ 关卡信息面板
      util.on(main, '.map-node', 'click', function (ev, el) {
        openLevelDialog(pack.id, Number(el.getAttribute('data-level')));
      });
      util.on(main, '.map-node', 'keydown', function (ev, el) {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          openLevelDialog(pack.id, Number(el.getAttribute('data-level')));
        }
      });

      // 关卡一览里的条目与地图节点行为一致
      util.on(main, '[data-strip-level]', 'click', function (ev, el) {
        openLevelDialog(pack.id, Number(el.getAttribute('data-strip-level')));
      });

      // 尺寸跨断点时切换横版 / 竖版地图
      var wide = root.matchMedia ? root.matchMedia('(min-width: 760px)') : null;
      if (wide && wide.addEventListener) {
        var onChange = function () { ZCD.app.render(); };
        wide.addEventListener('change', onChange);
        ZCD.app.onCleanup(function () { wide.removeEventListener('change', onChange); });
      }
    },
    /** 关卡信息面板（首页与地图页共用） */
    openLevelDialog: openLevelDialog
  };

  /**
   * 关卡信息面板：名称、知识主题、题目数量、难度、当前状态与历史成绩
   * 解锁规则完全沿用 store，这里只负责展示。
   */
  function openLevelDialog(packId, lv) {
    var pack = ZCD.data.getPack(packId);
    if (!pack) return;
    var item = ZCD.data.levelList(pack.id).filter(function (l) { return l.level === lv; })[0];
    if (!item) return;
    var st = ZCD.store.levelStat(pack.id, lv);
    var cleared = !!(st && st.cleared);
    var unlocked = ZCD.store.isLevelUnlocked(pack.id, lv);
    var points = ZCD.data.pointsOf(pack.id, lv);
    var statusChip = cleared
      ? '<span class="chip chip-green">✅ 已完成</span>'
      : (unlocked ? '<span class="chip chip-red">📍 可以挑战</span>' : '<span class="chip chip-gray">🔒 未解锁</span>');
    var stateLine = cleared
      ? '这一关已经通过，可以重复挑战刷新成绩。'
      : (unlocked ? '这一关已经解锁，随时可以开始挑战。' : '需要先通过关卡 ' + (lv - 1) + ' 才能解锁这一关。');
    ui.openModal({
      title: '🚩 ' + util.esc(item.name),
      body:
        '<div class="row mb-12">' + ui.gradeChip(pack.grade) + ui.subjectChip(pack.subject) + statusChip + '</div>' +
        '<div class="grid grid-3 mb-12">' +
          '<div class="stat-tile"><div class="stat-value" style="font-size:18px">' + item.count + '</div><div class="stat-label">本关题数</div></div>' +
          '<div class="stat-tile"><div class="stat-value" style="font-size:18px">' + util.starsText(item.level <= 3 ? pack.difficulty : Math.min(3, pack.difficulty + 1), 3) + '</div><div class="stat-label">难度</div></div>' +
          '<div class="stat-tile"><div class="stat-value" style="font-size:18px">' + (st ? (st.attempts || 0) : 0) + '</div><div class="stat-label">挑战次数</div></div>' +
        '</div>' +
        '<p class="text-sm mb-8"><b>知识主题：</b>' + (points.length ? points.map(util.esc).join('、') : '综合练习') + '</p>' +
        '<p class="text-sm mb-8"><b>当前状态：</b>' + util.esc(stateLine) + '</p>' +
        '<p class="text-sm"><b>历史成绩：</b>' +
          (st ? util.starsText(st.bestStars || 0, 3) + ' · 最好正确率 ' + (st.bestAccuracy || 0) + '%' : '还没有挑战过') + '</p>' +
        '<p class="text-xs text-muted mt-8">每道题提交后立即判分并显示解析；正确率 ≥ 60% 即可通关并解锁下一关。</p>',
      footer:
        '<button class="btn btn-soft" data-modal-close>取消</button>' +
        (unlocked
          ? '<button class="btn btn-primary" data-start="' + lv + '">' + (cleared ? '重新挑战' : '开始挑战') + '</button>'
          : '<button class="btn btn-soft" data-map-to="' + (lv - 1) + '">先去过关卡 ' + (lv - 1) + '</button>'),
      onMount: function (modal) {
        util.on(modal, '[data-start]', 'click', function () {
          ui.closeModal();
          ZCD.router.go('/quiz', { pack: pack.id, level: lv });
        });
        util.on(modal, '[data-map-to]', 'click', function () {
          ui.closeModal();
          openLevelDialog(pack.id, lv - 1);
        });
      }
    });
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
/*!
 * 知闯岛 · 答题页与闯关结算
 */
(function (root) {
  'use strict';
  var ZCD = root.ZCD;
  var util = ZCD.util;
  var ui = ZCD.ui;
  ZCD.views = ZCD.views || {};

  var LETTERS = 'ABCD';

  /* ==================== 会话管理 ==================== */

  function startLevelSession(packId, level) {
    var pack = ZCD.data.getPack(packId);
    if (!pack) return null;
    var questions = ZCD.data.levelQuestions(packId, level);
    if (!questions.length) return null;
    ZCD.session = {
      mode: 'level',
      packId: packId,
      level: Number(level),
      pack: pack,
      questions: questions,
      index: 0,
      chosen: null,
      submitted: false,
      records: [],
      correct: 0,
      startedAt: Date.now(),
      finished: false,
      analysisRevealed: false,
      encourage: '',
      gentle: ''
    };
    return ZCD.session;
  }

  /** 把错题本里的记录还原成可作答的题目（自定义题库被删除时仍可复习） */
  function entryToQuestion(e) {
    var found = ZCD.data.questionById(e.qid);
    if (found) return found;
    return {
      id: e.qid,
      grade: e.grade,
      subject: e.subject,
      packId: e.packId,
      level: e.level,
      point: e.point || '错题复习',
      type: e.type || 'single',
      stem: e.stem,
      options: e.options || [],
      answer: e.answer,
      analysis: e.analysis,
      hint: e.hint || '',
      difficulty: 1,
      custom: true
    };
  }

  function startReviewSession(entries, label) {
    var questions = entries.map(entryToQuestion).filter(function (q) { return q && q.options && q.options.length; });
    if (!questions.length) return null;
    ZCD.session = {
      mode: 'review',
      packId: null,
      level: null,
      pack: null,
      label: label || '错题复习',
      questions: questions,
      index: 0,
      chosen: null,
      submitted: false,
      records: [],
      correct: 0,
      startedAt: Date.now(),
      finished: false,
      analysisRevealed: false,
      encourage: '',
      gentle: ''
    };
    return ZCD.session;
  }

  /* ==================== 答题页 HTML ==================== */

  function dotsHTML(session) {
    return session.questions.map(function (q, i) {
      var cls = 'dot';
      var rec = session.records[i];
      if (rec) cls += rec.correct ? ' ok' : ' bad';
      else if (i === session.index) cls += ' now';
      return '<span class="' + cls + '"></span>';
    }).join('');
  }

  function optionHTML(q, session) {
    var submitted = session.submitted;
    return q.options.map(function (o) {
      var cls = 'option';
      if (submitted) {
        if (o.key === q.answer) cls += ' is-correct';
        else if (o.key === session.chosen) cls += ' is-wrong';
      } else if (o.key === session.chosen) {
        cls += ' is-picked';
      }
      var mark = '';
      if (submitted) {
        if (o.key === q.answer) mark = '<span class="option-mark" style="color:var(--green)">✓ 正确答案</span>';
        else if (o.key === session.chosen) mark = '<span class="option-mark" style="color:var(--red)">✗ 你的选择</span>';
      }
      return '<button class="' + cls + '" data-option="' + o.key + '"' + (submitted ? ' disabled' : '') + '>' +
        '<span class="option-key">' + o.key + '</span>' +
        '<span style="flex:1">' + util.esc(o.text) + '</span>' + mark +
      '</button>';
    }).join('');
  }

  function optionTextOf(q, key) {
    var opts = q.options || [];
    for (var i = 0; i < opts.length; i++) {
      if (String(opts[i].key).toUpperCase() === String(key).toUpperCase()) return opts[i].text;
    }
    return '';
  }

  /**
   * 答题后的反馈区
   * 答对：鼓励语 + 正确答案 + 一句巩固解释 + 下一题
   * 答错：温和反馈 + 引导提示（题库未配置提示时用通用文案，不编造题目内容）
   *       + 正确答案 + 解析（先让孩子想一想，点「查看解析」后再展示）
   */
  function feedbackHTML(q, session) {
    if (!session.submitted) return '';
    var rec = session.records[session.index] || {};
    var correct = !!rec.correct;
    var answerBox = '<span class="answer-box">' + util.esc(q.answer) +
      (optionTextOf(q, q.answer) ? ' · ' + util.esc(optionTextOf(q, q.answer)) : '') + '</span>';

    if (correct) {
      return '<div class="feedback is-ok">' +
        '<div class="feedback-title">🎉 ' + util.esc(session.encourage || ZCD.rewards.pick('correct')) +
          '<span class="star-burst" aria-hidden="true">' +
            '<span style="--bx:26px;--by:-22px">✨</span>' +
            '<span style="--bx:44px;--by:-4px">⭐</span>' +
            '<span style="--bx:18px;--by:-38px">✨</span>' +
          '</span>' +
        '</div>' +
        '<div class="feedback-line">正确答案：' + answerBox + '</div>' +
        '<div class="analysis"><b>💡 巩固一下：</b>' + util.nl2br(q.analysis) + '</div>' +
      '</div>';
    }

    var hint = ZCD.rewards.safeHint(q);
    var hasHint = !!hint;
    var revealed = session.analysisRevealed || !hasHint;   // 没有提示时直接展示解析
    var chosenBox = session.chosen
      ? '<span class="answer-box">' + util.esc(session.chosen) +
        (optionTextOf(q, session.chosen) ? ' · ' + util.esc(optionTextOf(q, session.chosen)) : '') + '</span>'
      : '<span class="answer-box">未作答</span>';

    return '<div class="feedback is-bad">' +
      '<div class="feedback-title">🌱 ' + util.esc(session.gentle || ZCD.rewards.pick('wrong')) + '</div>' +
      '<div class="feedback-line">正确答案：' + answerBox + '　你的选择：' + chosenBox + '</div>' +
      '<div class="hint-box">' +
        '<b>' + (hasHint ? '🧭 小提示：' : '🧭 想一想：') + '</b>' +
        util.esc(hasHint ? hint : ZCD.rewards.pick('genericHint')) +
      '</div>' +
      (revealed
        ? '<div class="analysis"><b>💡 知识解析：</b>' + util.nl2br(q.analysis) + '</div>' +
          '<div class="text-xs text-muted mt-8">' + util.esc(ZCD.rewards.pick('afterAnalysis')) + '</div>'
        : '<div class="row mt-12">' +
            '<button class="btn btn-soft btn-sm" id="btn-reveal">👀 查看解析</button>' +
            '<span class="text-xs text-muted">先按提示想一想，再看解析会记得更牢</span>' +
          '</div>') +
    '</div>';
  }

  function quizHTML() {
    var session = ZCD.session;
    var q = session.questions[session.index];
    var total = session.questions.length;
    var isLast = session.index === total - 1;
    var modeLabel = session.mode === 'review' ? '错题复习' : '闯关答题';
    var levelName = session.mode === 'review'
      ? (session.label || '错题复习')
      : (session.pack ? ZCD.data.levelName(session.pack, session.level) : '第 ' + session.level + ' 关');
    var packName = session.mode === 'review' ? '来自错题本' : (session.pack ? session.pack.name : '');

    var footBtns;
    if (session.submitted) {
      footBtns = '<button class="btn btn-primary btn-lg" id="btn-next">' +
        (isLast ? '完成本关，查看结算 🏁' : '下一题 →') + '</button>';
    } else {
      footBtns = '<button class="btn btn-primary btn-lg" id="btn-submit"' + (session.chosen ? '' : ' disabled') + '>提交答案</button>' +
        '<span class="text-xs text-muted">提交后本题不能再修改答案</span>';
    }

    return '' +
      '<div class="quiz-scene">' +
        '<div class="quiz-scene-head">' +
          '<span class="hero-pack-icon">' + ZCD.subjectMeta(q.subject).emoji + '</span>' +
          '<div>' +
            '<div class="qs-title">' + util.esc(levelName) + '</div>' +
            '<div class="qs-sub">' + util.esc(packName) + ' · ' + modeLabel + '</div>' +
          '</div>' +
          '<span class="spacer"></span>' +
          '<span class="quiz-progress-text">第 ' + (session.index + 1) + ' / ' + total + ' 题</span>' +
          '<button class="btn btn-soft btn-sm" id="btn-quit" data-confirm="leave-quiz">退出本关</button>' +
        '</div>' +
        '<div class="quiz-progress-track">' +
          ui.bar(util.pct(session.index + (session.submitted ? 1 : 0), total), 'bar-accent') +
          '<span class="dots">' + dotsHTML(session) + '</span>' +
          '<span class="text-xs text-muted">已答对 ' + session.correct + ' 题</span>' +
        '</div>' +

        '<div class="q-card">' +
          '<div class="row">' +
            '<span class="chip ' + (q.type === 'judge' ? 'chip-violet' : 'chip') + ' q-type">' + (q.type === 'judge' ? '判断题' : '单选题') + '</span>' +
            '<span class="chip chip-gray">' + util.esc(ZCD.subjectMeta(q.subject).name) + '</span>' +
            '<span class="chip chip-gray">' + util.esc(ZCD.gradeLabel(q.grade)) + '</span>' +
            '<span class="chip chip-gold" title="难度">' + util.starsText(q.difficulty, 3) + '</span>' +
            '<span class="spacer"></span>' +
            '<span class="q-point">知识点：' + util.esc(q.point) + '</span>' +
          '</div>' +
          '<h2 class="q-stem">' + util.nl2br(q.stem) + '</h2>' +
          '<div class="options">' + optionHTML(q, session) + '</div>' +
          feedbackHTML(q, session) +
          '<div class="quiz-foot">' + footBtns + '</div>' +
        '</div>' +
      '</div>';
  }

  /* ==================== 答题页视图 ==================== */

  ZCD.views.quiz = {
    render: function (ctx) {
      var packId = ctx.params.pack;
      var level = Number(ctx.params.level);

      // 需要新开一关（直接通过 URL 进入）
      if (packId && level) {
        var same = ZCD.session && ZCD.session.mode === 'level' &&
          ZCD.session.packId === packId && ZCD.session.level === level;
        if (!same || ZCD.session.finished) {
          var pack = ZCD.data.getPack(packId);
          if (!pack) {
            return '<div class="card">' + ui.empty('🧭', '没有找到这个知识包。',
              '<button class="btn btn-primary" data-go="/select">重新选择</button>') + '</div>';
          }
          if (!ZCD.store.isLevelUnlocked(packId, level)) {
            return '<div class="card">' + ui.empty('🔒', '第 ' + level + ' 关还没有解锁，先通过上一关吧。',
              '<button class="btn btn-primary" data-go="/map" data-pack="' + util.esc(packId) + '">回到闯关地图</button>') + '</div>';
          }
          startLevelSession(packId, level);
        }
      }

      if (!ZCD.session) {
        return '<div class="card">' + ui.empty('📝', '现在没有正在进行的答题。',
          '<button class="btn btn-primary" data-go="/select">选择知识包开始闯关</button>') + '</div>';
      }

      if (!ZCD.session.questions.length) {
        return '<div class="card">' + ui.empty('📭', '这一关暂时没有题目，可能是题库被删除了。',
          '<button class="btn btn-primary" data-go="/select">重新选择</button>') + '</div>';
      }

      var session = ZCD.session;
      var pack = session.pack;
      return '<div id="quiz-body"></div>' +
        (session.mode === 'level' && pack ?
          '<div class="notice mt-16">🔒 解锁规则：本关正确率达到 <b>60%</b> 即可通关并解锁下一关；已通关的关卡可以重复挑战，但首次通关奖励不会重复发放。</div>' : '');
    },

    mount: function (ctx, main) {
      var session = ZCD.session;
      if (!session) return;
      var body = main.querySelector('#quiz-body');
      if (!body) return;
      // 答题时进入专注模式：隐藏底部导航，避免误触离开
      document.body.classList.add('is-focus');

      function paint() { body.innerHTML = quizHTML(); }
      paint();

      // 记录「上次挑战」，供大厅的继续闯关使用
      if (session.mode === 'level' && !session._lastPlayedSet) {
        session._lastPlayedSet = true;
        ZCD.store.setLastPlayed({
          packId: session.packId,
          level: session.level,
          grade: session.pack ? session.pack.grade : null,
          subject: session.pack ? session.pack.subject : null
        });
      }

      util.on(body, '.option', 'click', function (ev, el) {
        if (session.submitted) return;
        session.chosen = el.getAttribute('data-option');
        paint();
      });

      util.on(body, '#btn-submit', 'click', function () {
        if (session.submitted) return;
        if (!session.chosen) { ui.toast('先选一个答案再提交', 'warn'); return; }
        var q = session.questions[session.index];
        var res = ZCD.store.recordAnswer({
          question: q,
          chosen: session.chosen,
          mode: session.mode === 'review' ? 'review' : 'level'
        });
        session.submitted = true;
        session.records[session.index] = { qid: q.id, chosen: session.chosen, correct: res.correct };
        if (res.correct) session.correct++;
        // 反馈文案在提交时选定：同一次作答反复渲染时不会变来变去
        session.encourage = ZCD.rewards.pick('correct');
        session.gentle = ZCD.rewards.pick('wrong');
        session.analysisRevealed = false;
        paint();
        var fb = body.querySelector('.feedback');
        if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });

      util.on(body, '#btn-next', 'click', function () {
        if (!session.submitted) return;
        if (session.index >= session.questions.length - 1) { finish(); return; }
        session.index++;
        session.chosen = null;
        session.submitted = false;
        session.analysisRevealed = false;
        session.encourage = '';
        session.gentle = '';
        paint();
        root.scrollTo(0, 0);
      });

      // 答错后先看提示想一想，再点开解析
      util.on(body, '#btn-reveal', 'click', function () {
        if (!session.submitted) return;
        session.analysisRevealed = true;
        paint();
      });

      util.on(body, '#btn-quit', 'click', function (ev) {
        ev.stopPropagation();
        ui.confirm({
          title: '要离开本关吗？',
          body: '本关还没有答完。已经提交的题目记录会保留，但本关不会结算。',
          okText: '离开本关',
          cancelText: '继续答题',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          ZCD.session = null;
          if (session.mode === 'review') ZCD.router.go('/wrong');
          else ZCD.router.go('/map', { pack: session.packId });
        });
      });

      function finish() {
        var total = session.questions.length;
        var badgesBefore = ZCD.store.earnedBadgeIds();
        var payload;
        if (session.mode === 'level') {
          var r = ZCD.store.finishLevel({
            packId: session.packId,
            level: session.level,
            correct: session.correct,
            total: total
          });
          payload = Object.assign({}, r, {
            mode: 'level',
            pack: session.pack,
            levelName: session.pack ? ZCD.data.levelName(session.pack, session.level) : '第 ' + session.level + ' 关',
            questions: session.questions,
            records: session.records
          });
        } else {
          var rr = ZCD.store.finishReview({ correct: session.correct, total: total });
          payload = Object.assign({}, rr, {
            mode: 'review',
            label: session.label,
            questions: session.questions,
            records: session.records
          });
        }
        ZCD.lastResult = payload;
        payload.newBadges = ZCD.store.badges().filter(function (b) {
          return b.earned && badgesBefore.indexOf(b.id) < 0;
        });
        session.finished = true;
        ZCD.router.go('/result');
      }
    }
  };

  /* ==================== 结算页 ==================== */

  ZCD.views.result = {
    render: function () {
      var r = ZCD.lastResult;
      if (!r) {
        return '<div class="card">' + ui.empty('🏁', '还没有可以展示的结算结果。',
          '<button class="btn btn-primary" data-go="/select">去闯关</button>') + '</div>';
      }

      var total = r.total || 1;
      var records = r.records || [];
      var questions = r.questions || [];
      var wrongIdx = [];
      for (var i = 0; i < records.length; i++) if (records[i] && !records[i].correct) wrongIdx.push(i);
      var rightIdx = [];
      for (var j = 0; j < records.length; j++) if (records[j] && records[j].correct) rightIdx.push(j);

      /* ---- 掌握的知识点 ---- */
      var masteredPoints = util.uniq(rightIdx.map(function (i) { return questions[i] ? questions[i].point : null; }).filter(Boolean));
      /* ---- 需要复习的错题 ---- */
      var needReview = util.uniq(wrongIdx.map(function (i) { return questions[i] ? questions[i].point : null; }).filter(Boolean));

      /* ---- 明星片 ---- */
      var starsHTML;
      if (r.mode === 'review') {
        starsHTML = '<div class="big-stars">📘</div>';
      } else {
        starsHTML = '<div class="big-stars">' + [0, 1, 2].map(function (i) {
          var filled = i < (r.awardedStars || 0);
          return '<span class="' + (filled ? 'star-pop' : 'dim') + '" style="animation-delay:' + (i * 0.16).toFixed(2) + 's">' + (filled ? '★' : '☆') + '</span>';
        }).join('') + '</div>';
      }

      var title, sub, heroCls = '', badgeText = '', chestHTML = '';
      if (r.mode === 'review') {
        title = '错题复习完成';
        sub = '答对 ' + r.correct + ' / ' + total + ' 题，正确率 ' + r.accuracy + '%';
        badgeText = '📘 错题复习';
        chestHTML = '<div class="result-chest" aria-hidden="true">📘</div>';
      } else if (r.passed) {
        title = r.firstClear ? '通关成功，新岛屿已解锁！' : (r.upgrade > 0 ? '成绩刷新，星级提升！' : '再次通关');
        sub = '正确率 ' + r.accuracy + '%　·　答对 ' + r.correct + ' / ' + total + ' 题';
        badgeText = r.firstClear ? '🎊 首次通关' : (r.upgrade > 0 ? '🌟 星级提升' : '✅ 再次通关');
        chestHTML = '<div class="result-chest is-open" id="result-chest" aria-hidden="true">' +
          '<span class="chest-rays"></span>🎁</div>';
      } else {
        title = '还差一点点';
        sub = '正确率 ' + r.accuracy + '% ，达到 60% 才能通关。看看解析，再来一次一定行！';
        heroCls = ' is-fail';
        badgeText = '💪 继续加油';
        chestHTML = '<div class="result-chest" aria-hidden="true">🧰</div>';
      }

      /* ---- 新获得的徽章 ---- */
      var newBadges = r.newBadges || [];
      var badgeHTML = newBadges.length
        ? '<div class="card mt-16"><h2 class="card-title">🎖️ 解锁新徽章 <span class="hint">共 ' + newBadges.length + ' 枚</span></h2>' +
            '<div class="grid grid-4">' + newBadges.map(function (b) {
              return '<div class="badge-tile is-earned is-new"><div class="badge-emoji">' + b.emoji + '</div>' +
                '<div class="badge-name">' + util.esc(b.name) + '</div>' +
                '<div class="badge-desc">' + util.esc(b.desc) + '</div></div>';
            }).join('') + '</div></div>'
        : '';

      /* ---- 错题清单 ---- */
      var wrongHTML = wrongIdx.length ? wrongIdx.map(function (i) {
        var q = questions[i];
        var rec = records[i];
        var answerText = '';
        for (var k = 0; k < (q.options || []).length; k++) if (q.options[k].key === q.answer) answerText = q.options[k].text;
        var chosenText = '';
        for (var m = 0; m < (q.options || []).length; m++) if (q.options[m].key === rec.chosen) chosenText = q.options[m].text;
        return '<div class="wrong-mini">' +
          '<div class="stem">' + util.esc(q.stem) + '</div>' +
          '<div class="row mt-8 row-tight">' +
            '<span class="chip chip-red">你的答案：' + util.esc(rec.chosen) + (chosenText ? ' · ' + util.esc(chosenText) : '') + '</span>' +
            '<span class="chip chip-green">正确答案：' + util.esc(q.answer) + (answerText ? ' · ' + util.esc(answerText) : '') + '</span>' +
            '<span class="chip chip-gray">' + util.esc(q.point) + '</span>' +
          '</div>' +
          '<div class="exp">💡 ' + util.esc(q.analysis) + '</div>' +
        '</div>';
      }).join('') : '<div class="notice notice-warn">本关没有错题，全部答对啦！👏</div>';

      /* ---- 经验明细 ---- */
      var xpHTML;
      if (r.mode === 'review') {
        xpHTML = '<div class="xp-breakdown">' +
          '<div class="xp-line"><span class="k">复习答对 ' + r.correct + ' 题 × 1 经验</span><span class="v">+' + r.xpTotal + '</span></div>' +
          '<div class="xp-line"><span class="k">当前累计经验</span><span class="v">' + r.totalXp + ' XP</span></div>' +
        '</div>';
      } else {
        xpHTML = '<div class="xp-breakdown">' +
          '<div class="xp-line' + (r.xpQuestions ? '' : ' is-zero') + '"><span class="k">答对 ' + r.correct + ' 题 × ' + (r.firstClear ? ZCD.rewards.RULES.XP_PER_QUESTION : ZCD.rewards.RULES.XP_REPLAY_PER_QUESTION) + ' 经验</span><span class="v">+' + r.xpQuestions + '</span></div>' +
          '<div class="xp-line' + (r.xpFirstBonus ? '' : ' is-zero') + '"><span class="k">首次通关奖励' + (r.firstClear ? '' : '（已在之前领取）') + '</span><span class="v">+' + r.xpFirstBonus + '</span></div>' +
          '<div class="xp-line' + (r.xpStarBonus ? '' : ' is-zero') + '"><span class="k">' + (r.firstClear ? '星级加成（' + r.stars + ' 星）' : '星级提升奖励') + '</span><span class="v">+' + r.xpStarBonus + '</span></div>' +
          '<div class="xp-line" style="border-top:1px dashed var(--line);padding-top:7px"><span class="k"><b>本次共获得</b></span><span class="v">+' + r.xpTotal + ' XP</span></div>' +
        '</div>';
      }

      /* ---- 底部按钮：两个清晰的主入口（继续冒险 / 复习错题）+ 次要操作 ---- */
      var primaryActions = [];
      var secondaryActions = [];
      if (r.mode === 'level') {
        var levels = r.pack ? ZCD.data.levelList(r.pack.id) : [];
        var nextLevel = r.level + 1;
        var hasNext = levels.some(function (l) { return l.level === nextLevel; });

        if (r.passed && hasNext) {
          primaryActions.push('<button class="btn btn-accent btn-lg" data-go="/quiz" data-pack="' + util.esc(r.packId) + '" data-level="' + nextLevel + '">▶ 继续冒险（第 ' + nextLevel + ' 关）</button>');
        } else if (r.passed && !hasNext) {
          primaryActions.push('<button class="btn btn-accent btn-lg" data-go="/select">🧭 继续冒险（换一个知识包）</button>');
        } else {
          primaryActions.push('<button class="btn btn-accent btn-lg" data-go="/quiz" data-pack="' + util.esc(r.packId) + '" data-level="' + r.level + '">▶ 继续冒险（重新挑战本关）</button>');
        }

        primaryActions.push('<button class="btn btn-primary btn-lg" data-go="/wrong">📕 复习错题' + (wrongIdx.length ? '（本关 ' + wrongIdx.length + ' 题）' : '') + '</button>');

        secondaryActions.push('<button class="btn btn-soft" data-go="/map" data-pack="' + util.esc(r.packId) + '">🗺️ 返回闯关地图</button>');
        if (r.passed) secondaryActions.push('<button class="btn btn-soft" data-go="/quiz" data-pack="' + util.esc(r.packId) + '" data-level="' + r.level + '">🔁 再挑战一次本关</button>');
        secondaryActions.push('<button class="btn btn-soft" data-go="/report">📊 学习报告</button>');
      } else {
        primaryActions.push('<button class="btn btn-primary btn-lg" data-go="/wrong">📕 返回错题本</button>');
        primaryActions.push('<button class="btn btn-soft btn-lg" data-go="/report">📊 查看学习报告</button>');
      }

      var nextHint = '';
      if (r.mode === 'level') {
        var packLevels = r.pack ? ZCD.data.levelList(r.pack.id) : [];
        var nl = r.level + 1;
        if (r.passed && packLevels.some(function (l) { return l.level === nl; })) {
          nextHint = '<div class="mt-16"><span class="unlock-chip">🔓 第 ' + nl + ' 关已解锁 · 可以继续冒险</span></div>';
        } else if (r.passed) {
          nextHint = '<div class="mt-16"><span class="unlock-chip">🏆 这个知识包全部通关了</span></div>';
        } else {
          nextHint = '<div class="mt-16"><span class="unlock-chip is-locked">🔒 第 ' + nl + ' 关需要先通关本关</span></div>';
        }
      }

      return '' +
        '<div class="result-hero result-scene' + heroCls + (r.mode === 'level' && r.passed ? ' is-pass' : '') + '" id="result-hero">' +
          '<div class="scene-hills" aria-hidden="true">' +
            '<svg viewBox="0 0 600 96" preserveAspectRatio="none">' +
              '<path d="M0,96 L0,56 Q62,24 132,50 Q192,72 252,44 Q322,10 392,46 Q452,74 522,40 Q562,22 600,40 L600,96 Z" fill="rgba(255,255,255,.16)"/>' +
              '<path d="M0,96 L0,74 Q80,48 160,70 Q240,92 320,66 Q400,40 480,68 Q540,86 600,64 L600,96 Z" fill="rgba(255,255,255,.10)"/>' +
            '</svg>' +
          '</div>' +
          '<div class="result-badge">' + badgeText + '</div>' +
          '<div class="result-title">' + title + '</div>' +
          '<div class="result-sub">' + sub + '</div>' +
          starsHTML +
          chestHTML +
          '<div class="result-metrics">' +
            '<div class="result-tile"><div class="v">' + r.correct + '/' + total + '</div><div class="l">答对题数</div></div>' +
            '<div class="result-tile"><div class="v">' + r.accuracy + '%</div><div class="l">正确率</div></div>' +
            '<div class="result-tile"><div class="v">' + (r.mode === 'review' ? '—' : '★ ' + (r.awardedStars || 0)) + '</div><div class="l">本次星星</div></div>' +
            '<div class="result-tile"><div class="v">+' + r.xpTotal + '</div><div class="l">获得经验</div></div>' +
          '</div>' +
          nextHint +
        '</div>' +

        '<div class="result-actions">' + primaryActions.join('') + '</div>' +
        (secondaryActions.length ? '<div class="result-secondary">' + secondaryActions.join('') + '</div>' : '') +

        '<div class="grid grid-2 mt-16">' +
          '<div class="card">' +
            '<h2 class="card-title"><span class="t-icon">⚡</span>经验结算明细</h2>' + xpHTML +
            '<div class="notice mt-12 text-xs">奖励规则固定：星级只记录每关历史最好成绩，重复挑战不会重复领取首次通关奖励。</div>' +
          '</div>' +
          '<div class="card">' +
            '<h2 class="card-title"><span class="t-icon">📚</span>本关知识点</h2>' +
            (masteredPoints.length ? '<div><b class="text-sm">已掌握：</b><div class="row row-tight mt-8">' +
              masteredPoints.map(function (p) { return '<span class="chip chip-green">✅ ' + util.esc(p) + '</span>'; }).join('') + '</div></div>' : '') +
            (needReview.length ? '<div class="mt-12"><b class="text-sm">需要复习：</b><div class="row row-tight mt-8">' +
              needReview.map(function (p) { return '<span class="chip chip-red">📕 ' + util.esc(p) + '</span>'; }).join('') + '</div></div>' : '') +
            (!masteredPoints.length && !needReview.length ? '<p class="text-sm text-muted">本关没有记录到知识点。</p>' : '') +
          '</div>' +
        '</div>' +

        '<div class="card mt-16">' +
          '<h2 class="card-title"><span class="t-icon">📝</span>需要复习的错题 <span class="hint">已自动收进错题本</span></h2>' +

        '</div>' +

    },

    mount: function (ctx, main) {
      var r = ZCD.lastResult;
      if (!r) return;
      var hero = main.querySelector('#result-hero');
      if (r.mode === 'review') return;
      if (r.passed) ui.confetti(hero, r.awardedStars >= 3 ? 46 : 30);

    startLevel: startLevelSession,
    startReview: startReviewSession
  };

</script>
<script>
/*!
 * 知闯岛 · 错题本 与 学习报告
 */
(function (root) {
  'use strict';
  var ZCD = root.ZCD;
  var util = ZCD.util;
  var ui = ZCD.ui;
  ZCD.views = ZCD.views || {};

  /* ==================== 错题本 ==================== */

  var openRetry = null;      // 当前展开「重新答题」的错题 qid
  var openDetail = null;     // 当前展开「完整题目与解析」的错题 qid

  function optionText(q, key) {
    for (var i = 0; i < (q.options || []).length; i++) {
      if (q.options[i].key === key) return q.options[i].text;
    }
    return '';
  }

  function wrongCardHTML(e) {
    var mastered = e.status === 'mastered';
    var retrying = openRetry === e.qid;
    var detail = openDetail === e.qid || retrying;   // 重新答题时自动展开完整题目
    var pack = e.packId ? ZCD.data.getPack(e.packId) : null;

    var optionsHTML = (e.options || []).map(function (o) {
      var cls = 'opt-line';
      if (o.key === e.answer) cls += ' is-answer';
      else if (o.key === e.userAnswer) cls += ' is-chosen';
      return '<div class="' + cls + '"><b>' + o.key + '</b><span>' + util.esc(o.text) + '</span>' +
        (o.key === e.answer ? '<span class="spacer"></span><span class="text-xs">正确答案</span>' : '') +
        (o.key === e.userAnswer && o.key !== e.answer ? '<span class="spacer"></span><span class="text-xs">你选的</span>' : '') +
      '</div>';
    }).join('');

    var retryHTML = '';
    if (retrying) {
      retryHTML = '<div class="mt-12">' +
        '<div class="text-xs text-muted mb-8">重新答一遍，答对就会更新掌握状态（历史错误记录会保留）：</div>' +
        '<div class="options">' + (e.options || []).map(function (o) {
          return '<button class="option" data-answer-qid="' + util.esc(e.qid) + '" data-answer-key="' + o.key + '">' +
            '<span class="option-key">' + o.key + '</span><span style="flex:1">' + util.esc(o.text) + '</span></button>';
        }).join('') + '</div>' +
        '<div class="row mt-8"><button class="btn btn-soft btn-sm" data-cancel-retry="1">收起</button></div>' +
      '</div>';
    }

    var historyHTML = (e.history || []).slice(-5).reverse().map(function (h) {
      return '<div class="history-line">· ' + util.fmtDateTime(h.ts) + '　选择 ' + util.esc(h.chosen) + '　' + (h.correct ? '✅ 答对' : '❌ 答错') + (h.mode === 'review' ? '（复习）' : '') + '</div>';
    }).join('');

    // 未展开时显示简洁摘要 + 我的答案/正确答案，点击后展开完整题目与解析
    var summaryHTML = '<div class="row row-tight mt-8">' +
        '<span class="chip chip-red">我的答案：' + util.esc(e.userAnswer || '—') +
          (optionText(e, e.userAnswer) ? ' · ' + util.esc(optionText(e, e.userAnswer)) : '') + '</span>' +
        '<span class="chip chip-green">正确答案：' + util.esc(e.answer) +
          (optionText(e, e.answer) ? ' · ' + util.esc(optionText(e, e.answer)) : '') + '</span>' +
      '</div>';

    var detailHTML = detail
      ? '<div class="opt-list">' + optionsHTML + '</div>' +
        '<div class="analysis mt-8"><b>💡 知识解析：</b>' + util.nl2br(e.analysis) + '</div>' +
        retryHTML +
        '<details class="more"><summary>历史答题记录（' + (e.history || []).length + ' 条，显示最近 5 条）</summary>' + (historyHTML || '<div class="history-line">暂无</div>') + '</details>'
      : summaryHTML;

    return '<div class="wrong-card ' + (mastered ? 'is-mastered' : 'is-pending') + '">' +
      '<div class="wrong-head">' +
        ui.subjectChip(e.subject) + ui.gradeChip(e.grade) +
        '<span class="chip chip-gray">' + util.esc(e.point || '综合练习') + '</span>' +
        '<span class="chip chip-gray">' + util.esc(pack ? pack.name + ' · ' + ZCD.data.levelName(pack, e.level) : (e.packId || '') + ' 第 ' + e.level + ' 关') + '</span>' +
        '<span class="chip ' + (mastered ? 'chip-green' : 'chip-red') + '">' + (mastered ? '✅ 已掌握' : '📌 待复习') + '</span>' +
        '<span class="chip chip-gray">答错 ' + (e.wrongTimes || 1) + ' 次</span>' +
        (e.rightTimes ? '<span class="chip chip-gray">答对 ' + e.rightTimes + ' 次</span>' : '') +
        '<span class="spacer"></span>' +
        '<span class="text-xs text-muted">' +
          '最近答错 ' + util.fmtRelative(e.lastWrongAt || e.ts) +
          ' · 最近复习 ' + (e.lastReviewAt ? util.fmtRelative(e.lastReviewAt) : '还没有复习') +
        '</span>' +
      '</div>' +
      '<div class="wrong-stem">' + util.nl2br(e.stem) + '</div>' +
      detailHTML +
      '<div class="wrong-actions">' +
        (retrying
          ? ''
          : '<button class="btn btn-primary btn-sm" data-retry="' + util.esc(e.qid) + '">✍️ 重新答这题</button>') +
        (detail
          ? '<button class="btn btn-soft btn-sm" data-collapse="1">收起题目</button>'
          : '<button class="btn btn-soft btn-sm" data-detail="' + util.esc(e.qid) + '">🔍 查看完整题目与解析</button>') +
        (mastered
          ? '<button class="btn btn-soft btn-sm" data-unmaster="' + util.esc(e.qid) + '">↩️ 标回待复习</button>'
          : '<button class="btn btn-soft btn-sm" data-master="' + util.esc(e.qid) + '">✅ 标记为已掌握</button>') +
        '<button class="btn btn-danger btn-sm" data-remove="' + util.esc(e.qid) + '">🗑️ 删除这条记录</button>' +
      '</div>' +
    '</div>';
  }

  ZCD.views.wrong = {
    render: function (ctx) {
      var filter = {
        subject: ctx.params.subject || '',
        grade: ctx.params.grade || '',
        status: ctx.params.status || ''
      };
      var list = ZCD.store.wrongList(filter);
      var stats = ZCD.store.wrongStats();
      var pending = ZCD.store.wrongList({ status: 'pending' });

      var subjectCounts = {};
      ZCD.store.wrongList().forEach(function (e) { subjectCounts[e.subject] = (subjectCounts[e.subject] || 0) + 1; });

      var subjectFilters = '<button class="filter-btn' + (!filter.subject ? ' is-active' : '') + '" data-f-subject="">全部学科（' + stats.total + '）</button>' +
        ZCD.SUBJECTS.map(function (s) {
          var n = subjectCounts[s.key] || 0;
          return '<button class="filter-btn' + (filter.subject === s.key ? ' is-active' : '') + '" data-f-subject="' + s.key + '">' +
            s.emoji + ' ' + s.name + '（' + n + '）</button>';
        }).join('');

      var statusFilters = '<button class="filter-btn' + (!filter.status ? ' is-active' : '') + '" data-f-status="">全部状态</button>' +
        '<button class="filter-btn' + (filter.status === 'pending' ? ' is-active' : '') + '" data-f-status="pending">📌 待复习（' + stats.pending + '）</button>' +
        '<button class="filter-btn' + (filter.status === 'mastered' ? ' is-active' : '') + '" data-f-status="mastered">✅ 已掌握（' + stats.mastered + '）</button>';

      var gradeFilters = '<button class="filter-btn' + (!filter.grade ? ' is-active' : '') + '" data-f-grade="">全部年级</button>' +
        ZCD.GRADES.map(function (g) {
          return '<button class="filter-btn' + (String(filter.grade) === String(g.grade) ? ' is-active' : '') + '" data-f-grade="' + g.grade + '">' + g.label + '</button>';
        }).join('');

      // 按知识包筛选（只列出错题本里真正出现过的知识包）
      var packOptions = ZCD.store.wrongPackOptions();
      var packFilters = packOptions.length
        ? '<button class="filter-btn' + (!filter.pack ? ' is-active' : '') + '" data-f-pack="">全部知识包</button>' +
          packOptions.map(function (p) {
            return '<button class="filter-btn' + (filter.pack === p.packId ? ' is-active' : '') + '" data-f-pack="' + util.esc(p.packId) + '">' +
              util.esc(p.name) + '（' + p.count + '）</button>';
          }).join('')
        : '';

      var listHTML = list.length ? list.map(wrongCardHTML).join('<div style="height:12px"></div>')
        : ui.empty('🎉', stats.total === 0 ? '错题本还是空的。答错的题目会自动收进这里。' : '当前筛选条件下没有错题。',
            '<button class="btn btn-soft" data-go="/select">去闯关</button>');

      // 「复习全部待巩固错题」优先复习「还需练习」的知识点对应的错题
      var reviewQueue = ZCD.mastery
        ? ZCD.mastery.reviewQueue()
        : { list: pending, truncated: false, total: pending.length };

      return '' +
        '<div class="view-title-row">' +
          '<div><h1 class="view-title">📕 错题本</h1>' +
          '<p class="view-desc">答错的题自动记录在这里；重新答对后会更新掌握状态，历史错误记录会保留。</p></div>' +
          '<div class="spacer"></div>' +
          (reviewQueue.list.length
            ? '<button class="btn btn-accent" id="btn-review-all">🔁 复习全部待巩固错题（' + reviewQueue.list.length + '）</button>'
            : '') +
        '</div>' +

        '<div class="grid grid-4 mb-12">' +
          '<div class="stat-tile"><div class="stat-value">' + stats.total + '</div><div class="stat-label">错题总数</div></div>' +
          '<div class="stat-tile"><div class="stat-value" style="color:#b03a26">' + stats.pending + '</div><div class="stat-label">待复习</div></div>' +
          '<div class="stat-tile stat-green"><div class="stat-value">' + stats.mastered + '</div><div class="stat-label">已掌握</div></div>' +
          '<div class="stat-tile"><div class="stat-value">' + util.pct(stats.mastered, stats.total) + '%</div><div class="stat-label">掌握率</div></div>' +
        '</div>' +

        '<div class="card mb-12">' +
          '<div class="stack">' +
            '<div class="filter-row">' + subjectFilters + '</div>' +
            '<div class="filter-row">' + gradeFilters + '</div>' +
            (packFilters ? '<div class="filter-row">' + packFilters + '</div>' : '') +
            '<div class="filter-row">' + statusFilters +
              '<span class="spacer"></span>' +
              (stats.total ? '<button class="btn btn-danger btn-sm" id="btn-clear-wrong">清空错题本</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +

        (reviewQueue.truncated
          ? '<div class="notice notice-warn mb-12">待巩固错题共 ' + reviewQueue.total + ' 道，一次最多复习 ' + reviewQueue.list.length + ' 道，剩下的下次继续。</div>'
          : '') +

        listHTML +
        '<div class="notice mt-16">💡 提示：错题来自真实答题记录。重新挑战整组错题时，答对的题会更新掌握状态，但不会删除历史记录，方便你回看自己的进步。</div>';
    },

    mount: function (ctx, main) {
      var filter = {
        subject: ctx.params.subject || '',
        grade: ctx.params.grade || '',
        status: ctx.params.status || '',
        pack: ctx.params.pack || ''
      };
      function apply(patch) {
        var next = Object.assign({}, filter, patch);
        openRetry = null;
        openDetail = null;
        ZCD.router.go('/wrong', next);
      }

      util.on(main, '[data-f-subject]', 'click', function (ev, el) { apply({ subject: el.getAttribute('data-f-subject') }); });
      util.on(main, '[data-f-status]', 'click', function (ev, el) { apply({ status: el.getAttribute('data-f-status') }); });
      util.on(main, '[data-f-grade]', 'click', function (ev, el) { apply({ grade: el.getAttribute('data-f-grade') }); });
      util.on(main, '[data-f-pack]', 'click', function (ev, el) { apply({ pack: el.getAttribute('data-f-pack') }); });

      // 点击错题查看完整题目与解析
      util.on(main, '[data-detail]', 'click', function (ev, el) {
        openDetail = el.getAttribute('data-detail');
        openRetry = null;
        ZCD.router.go('/wrong', filter);
      });
      util.on(main, '[data-collapse]', 'click', function () {
        openDetail = null;
        openRetry = null;
        ZCD.router.go('/wrong', filter);
      });

      util.on(main, '[data-retry]', 'click', function (ev, el) {
        openRetry = el.getAttribute('data-retry');
        openDetail = null;
        ZCD.router.go('/wrong', filter);
      });
      util.on(main, '[data-cancel-retry]', 'click', function () {
        openRetry = null;
        ZCD.router.go('/wrong', filter);
      });

      util.on(main, '[data-answer-qid]', 'click', function (ev, el) {
        var qid = el.getAttribute('data-answer-qid');
        var key = el.getAttribute('data-answer-key');
        var entry = ZCD.store.wrongList().filter(function (e) { return e.qid === qid; })[0];
        if (!entry) { ui.toast('这条错题记录已经不存在了', 'warn'); return; }
        var q = {
          id: entry.qid, grade: entry.grade, subject: entry.subject, packId: entry.packId,
          level: entry.level, point: entry.point, type: entry.type, stem: entry.stem,
          options: entry.options, answer: entry.answer, analysis: entry.analysis
        };
        var res = ZCD.store.recordAnswer({ question: q, chosen: key, mode: 'review' });
        openRetry = null;
        openDetail = null;
        ui.toast(res.correct
          ? '答对了！这个知识点的掌握状态已更新 ✅'
          : '还是不对，看看解析，过一会儿可以再试 💪', res.correct ? 'ok' : 'bad', 2600);
        ZCD.router.go('/wrong', filter);
      });

      util.on(main, '[data-master]', 'click', function (ev, el) {
        ZCD.store.markMastered(el.getAttribute('data-master'));
        ui.toast('已标记为掌握', 'ok');
        ZCD.router.go('/wrong', filter);
      });
      util.on(main, '[data-unmaster]', 'click', function (ev, el) {
        ZCD.store.resetWrongStatus(el.getAttribute('data-unmaster'));
        ZCD.router.go('/wrong', filter);
      });
      util.on(main, '[data-remove]', 'click', function (ev, el) {
        var qid = el.getAttribute('data-remove');
        ui.confirm({ title: '删除这条错题记录？', body: '删除后这条错题和它的复习历史都会消失。', okText: '删除', danger: true })
          .then(function (ok) {
            if (!ok) return;
            ZCD.store.removeWrong(qid);
            ui.toast('已删除', 'ok');
            ZCD.router.go('/wrong', filter);
          });
      });

      var clearBtn = main.querySelector('#btn-clear-wrong');
      if (clearBtn) {
        clearBtn.addEventListener('click', function () {
          ui.confirm({
            title: '清空整个错题本？',
            body: '所有错题记录和复习历史都会被删除，且不能恢复。学习进度（关卡、星星、经验）不受影响。',
            okText: '确认清空',
            danger: true
          }).then(function (ok) {
            if (!ok) return;
            ZCD.store.clearWrong();
            ui.toast('错题本已清空', 'ok');
            ZCD.router.go('/wrong', {});
          });
        });
      }

      var reviewAll = main.querySelector('#btn-review-all');
      if (reviewAll) {
        reviewAll.addEventListener('click', function () {
          var queue = ZCD.mastery ? ZCD.mastery.reviewQueue() : { list: ZCD.store.wrongList({ status: 'pending' }) };
          var pending = queue.list || [];
          if (!pending.length) { ui.toast('没有待复习的错题', 'warn'); return; }
          var s = ZCD.quizSession.startReview(pending, '待巩固错题复习 · ' + pending.length + ' 题');
          if (!s) { ui.toast('这些错题缺少可作答的选项信息', 'bad'); return; }
          ZCD.router.go('/quiz');
        });
      }
    }
  };

  /* ==================== 学习报告 ==================== */

  ZCD.views.report = {
    render: function () {
      var s = ZCD.store.state();
      var lv = ZCD.rewards.levelFromXp(s.xp);
      var stars = ZCD.store.totalStars();
      var allPacks = ZCD.data.allPacks();
      var totalLevels = allPacks.reduce(function (n, p) { return n + ZCD.data.levelList(p.id).length; }, 0);
      var clearedLevels = ZCD.store.clearedLevelCount();
      var accuracy = util.pct(s.totals.correct, s.totals.answered);
      var ws = ZCD.store.wrongStats();
      var today = ZCD.store.activityToday();
      var days = Object.keys(s.activity).length;

      /* ---- 知识掌握（固定规则，来自真实答题记录） ---- */
      var mastery = ZCD.mastery.overview();
      var counts = mastery.counts;
      var pctOf = function (n) { return mastery.total ? (n / mastery.total * 100) : 0; };
      var masteredLabel = '已掌握 ' + counts.mastered + ' / ' + mastery.total + ' 个知识点（' + mastery.masteredPercent + '%）';
      var notStartedCount = mastery.all.filter(function (r) { return r.answered === 0; }).length;

      var masteryBarHTML = '<div class="stack-bar mt-12">' +
        '<i class="s-mastered" style="width:' + pctOf(counts.mastered) + '%" title="已掌握 ' + counts.mastered + '"></i>' +
        '<i class="s-practice" style="width:' + pctOf(counts.practice) + '%" title="还需练习 ' + counts.practice + '"></i>' +
        '<i class="s-new" style="width:' + pctOf(counts.new) + '%" title="尚未学习 ' + counts.new + '"></i>' +
      '</div>';

      /* ---- 各学科知识点状态分布 ---- */
      var subjectMasteryHTML = mastery.bySubject.map(function (row) {
        var meta = ZCD.subjectMeta(row.subject);
        return '<div class="subject-row">' +
          '<span class="subject-icon">' + meta.emoji + '</span>' +
          '<div class="subject-body">' +
            '<div class="subject-name">' + meta.name +
              '<span class="subject-num">已掌握 ' + row.mastered + ' / ' + row.total + ' 个知识点 · 练过 ' + row.studied + ' 个</span>' +
            '</div>' +
            '<div class="stack-bar mt-8">' +
              '<i class="s-mastered" style="width:' + util.pct(row.mastered, row.total) + '%"></i>' +
              '<i class="s-practice" style="width:' + util.pct(row.practice, row.total) + '%"></i>' +
              '<i class="s-new" style="width:' + util.pct(row.new, row.total) + '%"></i>' +
            '</div>' +
            '<div class="subject-num mt-8">答题 ' + row.answered + ' 道 · 正确率 ' + util.pct(row.correct, row.answered) + '%' +
              (row.wrongOpen ? ' · 待复习错题 ' + row.wrongOpen + ' 道' : '') + '</div>' +
          '</div>' +
        '</div>';
      }).join('') || ui.empty('📚', '还没有知识点数据。');

      /* ---- 需要优先复习的知识点 ---- */
      var priority = ZCD.mastery.priorityList(6);
      var priorityHTML = priority.length ? priority.map(function (p) {
        var target = ZCD.mastery.targetFor(p);
        return '<div class="point-row">' +
          '<span class="recent-dots">' + p.recent.slice(-5).map(function (v) {
            return '<i class="' + (v ? 'ok' : 'bad') + '"></i>';
          }).join('') + '</span>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="point-name">' + util.esc(p.point) + '</div>' +
            '<div class="point-meta">' + ZCD.gradeLabel(p.grade) + ' · ' + ZCD.subjectMeta(p.subject).name +
              ' · 作答 ' + p.answered + ' 次 · 正确率 ' + p.accuracy + '%' +
              (p.wrongOpen ? ' · 待复习 ' + p.wrongOpen + ' 道' : '') + ' · ' + util.esc(p.reason) + '</div>' +
          '</div>' +
          (target && target.unlocked
            ? '<button class="btn btn-soft btn-sm" data-go="/quiz" data-pack="' + util.esc(target.packId) + '" data-level="' + target.level + '">去重练</button>'
            : '') +
        '</div>';
      }).join('') : '<div class="notice" style="background:var(--green-soft);border-color:#c7efe1;color:#0b7a5b">🎉 目前没有需要优先复习的知识点，表现得不错！</div>';

      /* ---- 最近一次学习表现 ---- */
      var perf = ZCD.mastery.lastPerformance();
      var perfHTML = perf.level
        ? '<div class="row mb-8">' +
            '<span class="chip chip-gray">' + util.fmtRelative(perf.at) + '</span>' +
            '<span class="chip ' + (perf.cleared ? 'chip-green' : 'chip-red') + '">' + (perf.cleared ? '已通关' : '未通关') + '</span>' +
            '<span class="chip chip-gold">' + util.starsText(perf.stars, 3) + '</span>' +
          '</div>' +
          '<div class="text-sm mb-8"><b>' + util.esc(perf.packName) + '</b> · ' + util.esc(perf.levelName) + ' · 最好正确率 ' + perf.accuracy + '%</div>' +
          (perf.recentTotal
            ? '<div class="point-meta mb-8">最近 ' + perf.recentTotal + ' 道题答对 ' + perf.recentCorrect + ' 道</div>' +
              '<div class="recent-dots">' + perf.recentAnswers.slice().reverse().map(function (a) {
                return '<i class="' + (a.correct ? 'ok' : 'bad') + '"></i>';
              }).join('') + '</div>'
            : '')
        : ui.empty('🌤️', '还没有完成过整关练习。', '<button class="btn btn-primary btn-sm" data-go="/select">去闯一关</button>');

      /* ---- 下一步学习建议（固定规则） ---- */
      var suggestions = ZCD.mastery.suggestions(4);
      var suggestHTML = suggestions.map(function (g) {
        return '<div class="suggest-item">' +

                (g.action.params && g.action.params.level ? ' data-level="' + g.action.params.level + '"' : '') +

      /* ---- 已练过的知识点明细（未作答的只给数量，避免堆砌） ---- */
