<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>知闯岛 · 小学知识闯关工作台（手机版·单文件）</title>
<meta name="description" content="知闯岛：面向小学 3-6 年级的知识闯关工作台，内置数学、语文、英语、科学题库，离线可用，进度保存在本机。">
<meta name="theme-color" content="#0f4c81">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f4c81'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8F%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/*!
 * 知闯岛 · 视觉系统
 * 明亮、有冒险感、适合小学中高年级；移动端优先，桌面端自适应。
 */

/* ============ 1. 变量与基础 ============ */
:root {
  --sea-900: #062b4e;
  --sea-800: #0b3b6f;
  --sea-700: #0f4c81;
  --sea-500: #1f7ac0;
  --sea-300: #6fc3ec;
  --sky-100: #e8f7ff;
  --sky-200: #cdeeff;
  --sand-200: #ffe9b8;
  --sand-400: #ffd98a;
  --sand-600: #f0b64c;
  --ink: #12233a;
  --ink-2: #2b3f57;
  --muted: #64798f;
  --line: #dbe6ef;
  --card: #ffffff;
  --bg: #f2f8fc;
  --accent: #ff7a45;
  --accent-dark: #e8622b;
  --green: #12a37a;
  --green-soft: #e3f8f1;
  --red: #e0553f;
  --red-soft: #ffeeea;
  --gold: #f5a524;
  --gold-soft: #fff5e0;
  --violet: #8b5cf6;
  --shadow-s: 0 1px 2px rgba(15, 60, 105, .08), 0 2px 8px rgba(15, 60, 105, .06);
  --shadow-m: 0 6px 18px rgba(15, 60, 105, .10);
  --shadow-l: 0 14px 40px rgba(10, 45, 80, .18);
  --r-s: 10px;
  --r-m: 16px;
  --r-l: 24px;
  --page: 1080px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
  color: var(--ink);
  background: var(--bg);
  background-image:
    radial-gradient(1200px 420px at 12% -140px, rgba(111, 195, 236, .38), transparent 70%),
    radial-gradient(900px 380px at 92% -120px, rgba(255, 217, 138, .40), transparent 70%);
  background-repeat: no-repeat;
  -webkit-text-size-adjust: 100%;
  line-height: 1.6;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 800; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
ul { margin: 0; padding: 0; list-style: none; }

.app-shell { min-height: 100vh; display: flex; flex-direction: column; }

/* 启动占位 */
.boot-screen {
  min-height: 70vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
}
.boot-logo { font-size: 64px; animation: floaty 2.4s ease-in-out infinite; }
.boot-title { font-size: 30px; letter-spacing: 4px; color: var(--sea-700); }
.boot-sub { color: var(--muted); }

@keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }

/* ============ 2. 顶栏 ============ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: linear-gradient(120deg, var(--sea-800), var(--sea-500));
  color: #fff;
  box-shadow: var(--shadow-m);
}
.topbar-inner {
  max-width: var(--page); margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 19px; letter-spacing: 1px; }
.brand-emoji { font-size: 22px; }
.brand-sub { font-size: 11px; font-weight: 600; opacity: .78; letter-spacing: 0; }
.topbar-stats { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .22);
  padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap;
}
.pill-gold { background: rgba(245, 165, 36, .26); border-color: rgba(255, 214, 130, .5); }
.pill-xp { background: rgba(111, 195, 236, .26); border-color: rgba(180, 230, 255, .5); }

/* ============ 3. 主体与底部导航 ============ */
.view { flex: 1; width: 100%; max-width: var(--page); margin: 0 auto; padding: 18px 16px 96px; }
.view-title-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.view-title { font-size: 23px; }
.view-desc { color: var(--muted); font-size: 13.5px; }
.spacer { flex: 1; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 20px rgba(15, 60, 105, .08);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.tabbar-inner { max-width: var(--page); margin: 0 auto; display: flex; }
.tab {
  flex: 1; padding: 8px 4px 9px; text-align: center; color: var(--muted);
  font-size: 11.5px; font-weight: 700; border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: color .15s, transform .15s;
}
.tab-emoji { font-size: 19px; line-height: 1.1; }
.tab.is-active { color: var(--sea-700); }
.tab.is-active .tab-emoji { transform: translateY(-1px) scale(1.12); }
.tab:hover { color: var(--sea-500); }

body.is-focus .tabbar { display: none; }
body.is-focus .view { padding-bottom: 32px; }

/* ============ 4. 卡片与栅格 ============ */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 16px; box-shadow: var(--shadow-s);
}
.card + .card { margin-top: 14px; }
.card-title { font-size: 16px; display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
.card-title .hint { font-size: 12px; font-weight: 600; color: var(--muted); }
.card-soft { background: linear-gradient(160deg, #fff, #f7fbfe); }

.grid { display: grid; gap: 12px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-tight { gap: 6px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; }
.text-muted { color: var(--muted); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 12px; }
.center { text-align: center; }

/* ============ 5. 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 12px; border: 1px solid transparent;
  background: #eef3f8; color: var(--ink); font-weight: 800; font-size: 14.5px;
  cursor: pointer; transition: transform .12s, box-shadow .15s, background .15s, opacity .15s;
  user-select: none; white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.99); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: linear-gradient(135deg, var(--sea-500), var(--sea-700)); color: #fff; box-shadow: 0 6px 16px rgba(15, 76, 129, .28); }
.btn-accent { background: linear-gradient(135deg, #ff9a5b, var(--accent-dark)); color: #fff; box-shadow: 0 6px 16px rgba(232, 98, 43, .28); }
.btn-gold { background: linear-gradient(135deg, #ffc94d, var(--gold)); color: #573a02; box-shadow: 0 6px 16px rgba(245, 165, 36, .3); }
.btn-soft { background: #fff; border-color: var(--line); }
.btn-soft:hover { border-color: var(--sea-300); background: var(--sky-100); }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-danger { background: var(--red-soft); color: #b03a26; border-color: #f6cfc7; }
.btn-danger:hover { background: #ffe2dc; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn-lg { padding: 14px 26px; font-size: 17px; border-radius: 14px; }
.btn-block { width: 100%; }

/* ============ 6. 徽标 / 标签 / 进度条 ============ */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 800;
  background: var(--sky-100); color: var(--sea-700); border: 1px solid #d4eaf7;
}
.chip-green { background: var(--green-soft); color: #0b7a5b; border-color: #c7efe1; }
.chip-red { background: var(--red-soft); color: #b03a26; border-color: #f6cfc7; }
.chip-gold { background: var(--gold-soft); color: #8a5b06; border-color: #f3ddb0; }
.chip-gray { background: #eef2f7; color: var(--muted); border-color: #e2e9f0; }
.chip-violet { background: #f2ecff; color: #6d3fd6; border-color: #e2d6ff; }

.bar { height: 9px; border-radius: 999px; background: #e9eff5; overflow: hidden; }
.bar > i {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--sea-300), var(--sea-500));
  transition: width .5s cubic-bezier(.2,.8,.2,1);
}
.bar-green > i { background: linear-gradient(90deg, #6ee7c0, var(--green)); }
.bar-gold > i { background: linear-gradient(90deg, #ffd98a, var(--gold)); }
.bar-accent > i { background: linear-gradient(90deg, #ffb27a, var(--accent)); }

/* ============ 7. 学习大厅 ============ */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-l); padding: 22px 20px 20px;
  background: linear-gradient(135deg, var(--sea-800), var(--sea-500) 55%, #35a3d8);
  color: #fff; box-shadow: var(--shadow-l);
}
.hero-sky { position: absolute; inset: 0; pointer-events: none; opacity: .5; }
.hero-inner { position: relative; z-index: 2; }
.hero-title { font-size: 30px; letter-spacing: 3px; display: flex; align-items: center; gap: 10px; }
.hero-title .wave { font-size: 26px; }
.hero-welcome { margin-top: 6px; font-size: 14px; opacity: .95; }
.hero-level { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.level-badge {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .3);
  border-radius: 999px; padding: 5px 14px; font-weight: 800;
}
.hero-xp { flex: 1; min-width: 180px; }
.hero-xp .bar { background: rgba(255, 255, 255, .25); }
.hero-xp .bar > i { background: linear-gradient(90deg, #ffe9b8, var(--sand-600)); }
.hero-xp-label { font-size: 12px; opacity: .9; margin-bottom: 4px; }
.hero-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.hero-actions .btn-soft { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); color: #fff; }
.hero-actions .btn-soft:hover { background: rgba(255,255,255,.3); }

.island-deco { position: absolute; right: -10px; bottom: -14px; font-size: 96px; opacity: .22; z-index: 1; }

.task-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px;
  border: 1px solid var(--line); border-radius: var(--r-s); background: #fff;
}
.task-item + .task-item { margin-top: 9px; }
.task-item.is-done { background: var(--green-soft); border-color: #c7efe1; }
.task-icon { font-size: 22px; }
.task-body { flex: 1; min-width: 0; }
.task-name { font-weight: 800; font-size: 14px; }
.task-sub { font-size: 12px; color: var(--muted); }
.task-check { font-size: 20px; }

.stat-tile { background: #fff; border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; text-align: center; box-shadow: var(--shadow-s); }
.stat-value { font-size: 25px; font-weight: 900; color: var(--sea-700); line-height: 1.2; }
.stat-value small { font-size: 13px; font-weight: 700; color: var(--muted); }
.stat-label { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.stat-gold .stat-value { color: #b4780a; }
.stat-green .stat-value { color: #0b7a5b; }

.entry-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.entry {
  border: 1px solid var(--line); border-radius: var(--r-m); background: #fff; padding: 15px;
  cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px;
  box-shadow: var(--shadow-s); transition: transform .14s, box-shadow .14s, border-color .14s;
}
.entry:hover { transform: translateY(-3px); box-shadow: var(--shadow-m); border-color: var(--sea-300); }
.entry-emoji { font-size: 26px; }
.entry-name { font-weight: 800; font-size: 15px; }
.entry-desc { font-size: 12.5px; color: var(--muted); }
.entry-badge { font-size: 12px; font-weight: 800; color: var(--accent-dark); }

.recent-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.recent-item:last-child { border-bottom: none; }
.recent-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sea-300); flex: none; }
.recent-dot.ok { background: var(--green); }
.recent-dot.bad { background: var(--red); }

/* ============ 8. 年级 / 学科 / 知识包 ============ */
.pick-card {
  border: 2px solid var(--line); border-radius: var(--r-m); background: #fff; padding: 15px;
  cursor: pointer; text-align: left; transition: border-color .15s, transform .15s, box-shadow .15s;
  display: flex; gap: 12px; align-items: center;
}
.pick-card:hover { border-color: var(--sea-300); transform: translateY(-2px); }
.pick-card.is-active { border-color: var(--sea-500); box-shadow: 0 0 0 4px rgba(31, 122, 192, .12); background: var(--sky-100); }
.pick-emoji { font-size: 28px; }
.pick-name { display: block; font-weight: 900; font-size: 16px; }
.pick-desc { display: block; font-size: 12.5px; color: var(--muted); }
.pick-meta { display: block; font-size: 12px; color: var(--sea-700); font-weight: 700; margin-top: 3px; }
.pick-card > span:last-child { flex: 1; min-width: 0; }

.pack-card {
  border: 1px solid var(--line); border-radius: var(--r-m); background: #fff;
  padding: 16px; box-shadow: var(--shadow-s); display: flex; flex-direction: column; gap: 10px;
  border-top: 5px solid var(--sea-500);
}
.pack-head { display: flex; align-items: flex-start; gap: 10px; }
.pack-name { font-size: 17px; font-weight: 900; }
.pack-intro { font-size: 13px; color: var(--ink-2); }
.pack-meta-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pack-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; }
.difficulty { font-size: 13px; letter-spacing: 1px; color: var(--gold); font-weight: 800; }

/* [V2 已移除] 旧 HTML 节点地图样式（第 296-340 行）：改用插画式 SVG 地图 */

@keyframes pulse {
  0%, 100% { box-shadow: 0 8px 22px rgba(232, 98, 43, .28); }
  50% { box-shadow: 0 8px 30px rgba(232, 98, 43, .48); }
}

/* ============ 10. 答题页 ============ */
.quiz-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.quiz-level-name { font-weight: 900; font-size: 15.5px; }
.quiz-progress-text { font-size: 13px; font-weight: 800; color: var(--sea-700); }
.quiz-progress { margin-bottom: 14px; }

.q-card {
  background: #fff; border: 1px solid var(--line); border-radius: var(--r-l);
  padding: 20px; box-shadow: var(--shadow-m);
}
.q-type { font-size: 11.5px; font-weight: 800; letter-spacing: .5px; }
.q-stem { font-size: 19px; font-weight: 800; line-height: 1.55; margin: 8px 0 4px; }
.q-point { font-size: 12.5px; color: var(--muted); }

.options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.option {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px 15px; border-radius: 14px; border: 2px solid var(--line); background: #fff;
  cursor: pointer; font-size: 15.5px; font-weight: 700;
  transition: border-color .14s, background .14s, transform .14s;
}
.option:hover:not(:disabled) { border-color: var(--sea-300); background: var(--sky-100); transform: translateX(3px); }
.option:disabled { cursor: default; }
.option-key {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: #eef3f8; font-weight: 900; font-size: 14px; color: var(--ink-2);
}
.option.is-picked { border-color: var(--sea-500); background: var(--sky-100); }
.option.is-picked .option-key { background: var(--sea-500); color: #fff; }
.option.is-correct { border-color: var(--green); background: var(--green-soft); }
.option.is-correct .option-key { background: var(--green); color: #fff; }
.option.is-wrong { border-color: var(--red); background: var(--red-soft); }
.option.is-wrong .option-key { background: var(--red); color: #fff; }
.option-mark { margin-left: auto; font-weight: 900; font-size: 14px; }

.feedback { margin-top: 16px; border-radius: var(--r-m); padding: 15px; border: 1px solid var(--line); background: #fbfdff; }
.feedback.is-ok { background: var(--green-soft); border-color: #c7efe1; }
.feedback.is-bad { background: var(--red-soft); border-color: #f6cfc7; }
.feedback-title { font-weight: 900; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.feedback-line { margin-top: 8px; font-size: 14px; }
.answer-box {
  display: inline-flex; align-items: center; gap: 6px; font-weight: 900;
  background: #fff; border: 1px dashed var(--line); border-radius: 10px; padding: 3px 12px;
}
.analysis {
  margin-top: 10px; background: #fff; border-left: 4px solid var(--sea-300);
  border-radius: 8px; padding: 11px 13px; font-size: 14px; color: var(--ink-2);
}
.analysis b { color: var(--sea-700); }

/* 答错时的引导提示（不泄露答案） */
.hint-box {
  margin-top: 10px; border-radius: 10px; padding: 11px 13px; font-size: 14px;
  background: var(--gold-soft); border: 1px dashed #f0d9a6; color: #6f4a08;
}
.hint-box b { color: #8a5b06; }

/* ============ 11b. 知识点掌握 ============ */
.mastery-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.mastery-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.stack-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #e9eff5; }
.stack-bar > i { display: block; height: 100%; }
.stack-bar > i.s-new { background: #c9d6e2; }
.stack-bar > i.s-practice { background: linear-gradient(90deg, #ffab8f, var(--red)); }
.stack-bar > i.s-mastered { background: linear-gradient(90deg, #6ee7c0, var(--green)); }

.point-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 0;
  border-bottom: 1px dashed var(--line);
}
.point-row:last-child { border-bottom: none; }
.point-name { font-weight: 800; font-size: 13.5px; }
.point-meta { font-size: 12px; color: var(--muted); }
.recent-dots { display: inline-flex; gap: 3px; }
.recent-dots i {
  width: 8px; height: 8px; border-radius: 50%; background: #dbe6ef; display: block;
}
.recent-dots i.ok { background: var(--green); }
.recent-dots i.bad { background: var(--red); }

.suggest-item {
  display: flex; align-items: flex-start; gap: 11px; padding: 12px;
  border: 1px solid var(--line); border-radius: var(--r-m); background: #fff;
}
.suggest-item + .suggest-item { margin-top: 9px; }
.suggest-icon { font-size: 21px; line-height: 1.2; }
.suggest-text { flex: 1; font-size: 13.5px; }
.suggest-action { margin-top: 8px; }

.status-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; }

.quiz-foot { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.quiz-foot .spacer { flex: 1; }

.dots { display: flex; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #dbe6ef; }
.dot.ok { background: var(--green); }
.dot.bad { background: var(--red); }
.dot.now { background: var(--sea-500); transform: scale(1.25); }

/* ============ 11. 结算页 ============ */
.result-hero {
  position: relative; overflow: hidden; border-radius: var(--r-l); padding: 26px 20px;
  text-align: center; color: #fff;
  background: linear-gradient(135deg, var(--sea-800), var(--sea-500));
  box-shadow: var(--shadow-l);
}
.result-hero.is-fail { background: linear-gradient(135deg, #5b6b7d, #8496a8); }
.result-title { font-size: 24px; }
.result-sub { font-size: 13.5px; opacity: .95; margin-top: 5px; }
.big-stars { font-size: 44px; letter-spacing: 8px; margin: 12px 0 2px; color: var(--sand-400); text-shadow: 0 3px 10px rgba(0,0,0,.25); }
.big-stars .dim { color: rgba(255,255,255,.32); text-shadow: none; }
.star-pop { display: inline-block; animation: starPop .55s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes starPop { 0% { transform: scale(.2) rotate(-40deg); opacity: 0 } 100% { transform: scale(1) rotate(0); opacity: 1 } }

.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i {
  position: absolute; top: -12px; width: 8px; height: 13px; border-radius: 2px; opacity: .9;
  animation: fall linear forwards;
}
@keyframes fall {
  0% { transform: translateY(-20px) rotate(0); opacity: 0 }
  10% { opacity: 1 }
  100% { transform: translateY(420px) rotate(540deg); opacity: 0 }
}

.result-metrics { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-top: 14px; }
.result-tile { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: var(--r-m); padding: 12px; }
.result-tile .v { font-size: 24px; font-weight: 900; }
.result-tile .l { font-size: 12px; opacity: .9; }

.xp-breakdown { display: flex; flex-direction: column; gap: 7px; font-size: 14px; }
.xp-line { display: flex; align-items: center; gap: 8px; }
.xp-line .k { color: var(--ink-2); }
.xp-line .v { margin-left: auto; font-weight: 900; color: var(--green); }
.xp-line.is-zero .v { color: var(--muted); font-weight: 700; }

.wrong-mini { border: 1px solid var(--line); border-radius: var(--r-s); padding: 11px; background: #fff; }
.wrong-mini + .wrong-mini { margin-top: 9px; }
.wrong-mini .stem { font-weight: 800; font-size: 14px; }
.wrong-mini .exp { font-size: 12.5px; color: var(--muted); margin-top: 5px; }

/* ============ 12. 错题本 ============ */
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-btn {
  padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: #fff;
  font-size: 13px; font-weight: 800; cursor: pointer; color: var(--ink-2);
}
.filter-btn.is-active { background: var(--sea-700); color: #fff; border-color: var(--sea-700); }
.filter-btn:hover { border-color: var(--sea-300); }

.wrong-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-m); padding: 15px; box-shadow: var(--shadow-s); }
.wrong-card.is-mastered { border-left: 5px solid var(--green); }
.wrong-card.is-pending { border-left: 5px solid var(--red); }
.wrong-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.wrong-stem { font-size: 15.5px; font-weight: 800; }
.opt-list { display: flex; flex-direction: column; gap: 5px; margin-top: 9px; font-size: 14px; }
.opt-line { display: flex; gap: 8px; padding: 5px 9px; border-radius: 8px; background: #f8fbfd; }
.opt-line.is-answer { background: var(--green-soft); font-weight: 800; }
.opt-line.is-chosen { background: var(--red-soft); font-weight: 800; }
.history-line { font-size: 12.5px; color: var(--muted); }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 800; color: var(--sea-700); margin-top: 9px; }

/* ============ 13. 学习报告 ============ */
.subject-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.subject-row:last-child { border-bottom: none; }
.subject-icon { font-size: 22px; width: 30px; text-align: center; }
.subject-body { flex: 1; min-width: 0; }
.subject-name { font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.subject-num { font-size: 12.5px; color: var(--muted); }

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th, table.data td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { background: #f6fafd; font-weight: 800; color: var(--ink-2); position: sticky; top: 0; }
table.data td.wrap { white-space: normal; min-width: 220px; }

/* ============ 14. 题库管理 ============ */
.dropzone {
  border: 2px dashed #c8dced; border-radius: var(--r-m); background: #f8fcff;
  padding: 22px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.is-over { border-color: var(--sea-500); background: var(--sky-100); }
.dropzone-emoji { font-size: 34px; }
textarea.io {
  width: 100%; min-height: 130px; border-radius: var(--r-s); border: 1px solid var(--line);
  padding: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px; line-height: 1.55; resize: vertical; background: #fcfdfe;
}
textarea.io:focus { outline: 2px solid var(--sky-200); border-color: var(--sea-300); }
input.field, select.field {
  width: 100%; padding: 9px 11px; border-radius: var(--r-s); border: 1px solid var(--line);
  font-size: 14px; background: #fff; font-family: inherit;
}
input.field:focus, select.field:focus { outline: 2px solid var(--sky-200); border-color: var(--sea-300); }
label.field-label { display: block; font-size: 12.5px; font-weight: 800; color: var(--ink-2); margin-bottom: 5px; }

.issues { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-s); }
.issue { display: flex; gap: 8px; padding: 9px 11px; font-size: 13px; border-bottom: 1px solid var(--line); }
.issue:last-child { border-bottom: none; }
.issue.is-error { background: var(--red-soft); color: #8f2d1c; }
.issue.is-warning { background: var(--gold-soft); color: #77500a; }
.issue-icon { flex: none; }
.code-block {
  background: #0f2338; color: #d6e6f5; border-radius: var(--r-s); padding: 13px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre;
}
.sample-table { font-size: 12.5px; }
.sample-table td, .sample-table th { white-space: normal; }
.sample-table td:first-child { white-space: nowrap; }
.sample-table code { background: #eef4f9; padding: 1px 5px; border-radius: 5px; }

/* ============ 15. 模态框与提示 ============ */
.modal-layer { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(8, 32, 56, .5); backdrop-filter: blur(3px); }
.modal-layer[hidden] { display: none; }
.modal {
  background: #fff; border-radius: var(--r-l); box-shadow: var(--shadow-l);
  width: 100%; max-width: 480px; max-height: 88vh; overflow: auto;
  animation: modalIn .2s ease-out;
}
@keyframes modalIn { from { transform: translateY(14px) scale(.98); opacity: 0 } to { transform: none; opacity: 1 } }
.modal-head { padding: 17px 18px 0; font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.modal-body { padding: 12px 18px; font-size: 14px; color: var(--ink-2); }
.modal-foot { padding: 4px 18px 18px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

.toast-layer { position: fixed; left: 50%; transform: translateX(-50%); bottom: 84px; z-index: 95; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast {
  background: rgba(18, 35, 58, .94); color: #fff; padding: 10px 16px; border-radius: 999px;
  font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow-m); animation: toastIn .22s ease-out;
  max-width: 92vw; text-align: center;
}
.toast.ok { background: #0b7a5b; }
.toast.bad { background: #b03a26; }
.toast.warn { background: #8a5b06; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0 } to { transform: none; opacity: 1 } }

.empty-state { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty-emoji { font-size: 42px; }
.empty-text { margin-top: 8px; font-size: 14px; }

.badge-tile {
  text-align: center; padding: 12px 10px; border-radius: var(--r-m);
  border: 1px dashed var(--line); background: #fbfdff; opacity: .62;
}
.badge-tile.is-earned {
  opacity: 1; border: 1px solid #f3ddb0;
  background: linear-gradient(160deg, #fff, var(--gold-soft));
  box-shadow: var(--shadow-s);
}
.badge-emoji { font-size: 26px; }
.badge-name { font-weight: 900; font-size: 13.5px; margin-top: 3px; }
.badge-desc { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.badge-tile.is-new { animation: starPop .5s cubic-bezier(.2,1.4,.4,1) both; }

.notice {
  border-radius: var(--r-s); padding: 11px 13px; font-size: 13px;
  background: var(--sky-100); border: 1px solid #d4eaf7; color: var(--sea-800);
}
.notice-warn { background: var(--gold-soft); border-color: #f3ddb0; color: #77500a; }
.notice-danger { background: var(--red-soft); border-color: #f6cfc7; color: #8f2d1c; }

/* ============ 16. 响应式 ============ */
@media (min-width: 720px) {
  .view { padding: 24px 20px 104px; }
  .hero { padding: 30px 28px; }
  .hero-title { font-size: 36px; }
  .q-card { padding: 26px 28px; }
  .q-stem { font-size: 21px; }
/* [V2 已移除] 旧 HTML 节点地图样式（第 617-618 行）：改用插画式 SVG 地图 */
  .island-deco { font-size: 132px; opacity: .2; }
}

@media (max-width: 700px) {
  .brand-sub { display: none; }
  .brand { font-size: 17px; gap: 6px; }
  .pill { padding: 3px 9px; font-size: 12px; }
  .topbar-inner { gap: 8px; }
}

@media (max-width: 460px) {
  .pill-nick { display: none; }
  .brand-emoji { font-size: 19px; }
}

@media (max-width: 420px) {
/* [V2 已移除] 旧 HTML 节点地图样式（第 635-637 行）：改用插画式 SVG 地图 */
  .q-stem { font-size: 17.5px; }
  .hero-title { font-size: 26px; }
  .tab { font-size: 10.5px; }
}

/* ============ 17. 电脑版 / 手机版（强制布局） ============ */
/* 布局切换按钮：只在强制布局时出现 */
.layout-switch {
  position: fixed; left: 12px; bottom: 14px; z-index: 70;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 800;
  background: rgba(18, 35, 58, .86); color: #fff; box-shadow: var(--shadow-m);
  backdrop-filter: blur(6px); text-decoration: none;
}
.layout-switch:hover { background: rgba(18, 35, 58, 1); }
body.layout-mobile .layout-switch { bottom: 78px; }

/* ---- 电脑版：无论窗口多窄都保持桌面排版 ---- */
body.layout-desktop { min-width: 1120px; }
body.layout-desktop .view { max-width: var(--page); padding: 24px 20px 104px; }
body.layout-desktop .topbar-inner,
body.layout-desktop .tabbar-inner { max-width: var(--page); }
body.layout-desktop .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
body.layout-desktop .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
body.layout-desktop .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
body.layout-desktop .entry-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
body.layout-desktop .brand-sub { display: inline; }
body.layout-desktop .pill-nick { display: inline-flex; }
body.layout-desktop .hero { padding: 30px 28px; }
body.layout-desktop .hero-title { font-size: 36px; }
body.layout-desktop .island-deco { font-size: 132px; opacity: .2; }
/* [V2 已移除] 旧 HTML 节点地图样式（第 669-670 行）：改用插画式 SVG 地图 */
body.layout-desktop .q-card { padding: 26px 28px; }
body.layout-desktop .q-stem { font-size: 21px; }

/* ---- 手机版：固定手机宽度，电脑上显示手机外框 ---- */
body.layout-mobile {
  background: #e6ecf3;
  background-image: none;
}
body.layout-mobile .app-shell {
  width: min(430px, 100vw); max-width: 430px; margin: 0 auto; min-height: 100vh;
  background: var(--bg); background-image:
    radial-gradient(600px 240px at 12% -120px, rgba(111, 195, 236, .34), transparent 70%),
    radial-gradient(480px 220px at 92% -100px, rgba(255, 217, 138, .38), transparent 70%);
  background-repeat: no-repeat;
  box-shadow: 0 0 0 1px #d3dfea, 0 26px 60px rgba(10, 45, 80, .16);
  overflow-x: hidden;
}
body.layout-mobile .view { max-width: 430px; padding: 16px 14px 96px; }
body.layout-mobile .tabbar {
  left: 50%; right: auto; transform: translateX(-50%);
  width: min(430px, 100vw); max-width: 430px;
}
body.layout-mobile .topbar-inner { padding: 9px 12px; }
body.layout-mobile .brand { font-size: 17px; }
body.layout-mobile .brand-sub { display: none; }
body.layout-mobile .pill { padding: 3px 9px; font-size: 12px; }
body.layout-mobile .pill-nick { display: none; }
body.layout-mobile .hero { padding: 22px 18px; border-radius: 20px; }
body.layout-mobile .hero-title { font-size: 26px; }
body.layout-mobile .island-deco { font-size: 96px; opacity: .22; }
body.layout-mobile .grid-2,
body.layout-mobile .grid-3,
body.layout-mobile .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
body.layout-mobile .entry-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* [V2 已移除] 旧 HTML 节点地图样式（第 705-707 行）：改用插画式 SVG 地图 */
body.layout-mobile .q-card { padding: 18px 16px; }
body.layout-mobile .q-stem { font-size: 17.5px; }
body.layout-mobile .stat-value { font-size: 22px; }
body.layout-mobile .modal { max-width: 400px; }

/* 手机版在宽屏上补一层「手机」质感 */
@media (min-width: 760px) {
  body.layout-mobile { padding: 0; }
  body.layout-mobile .app-shell { margin: 24px auto; min-height: calc(100vh - 48px); border-radius: 26px; overflow: hidden; }
  body.layout-mobile .tabbar { width: 430px; border-radius: 0 0 26px 26px; }
  body.layout-mobile .topbar { border-radius: 26px 26px 0 0; }
}

/* 真机（窄屏）上不要再加外框，并把固定元素贴回两侧 */
@media (max-width: 759px) {
  body.layout-mobile .app-shell { margin: 0; border-radius: 0; min-height: 100vh; box-shadow: none; }
  body.layout-mobile .tabbar { border-radius: 0; }
  body.layout-mobile .topbar { border-radius: 0; }
  body.layout-mobile .view { padding: 14px 12px 92px; }
}

@media print {
  .layout-switch { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
  animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important;
}

/* ============================================================
 * 18. 第二阶段视觉升级：知识冒险世界
 * ------------------------------------------------------------
 * 原则：
 *   1. 只升级视觉、布局、交互状态与轻量动画，不动任何学习逻辑
 *   2. 统一颜色 / 圆角 / 阴影 / 间距 / 字阶（令牌化，方便统一调整）
 *   3. 装饰只用 CSS、现有 SVG 与 emoji，全部离线可用
 *   4. 装饰层一律 pointer-events:none，绝不吃掉点击
 *   5. 状态不只用颜色区分，同时带图标或文字
 * ============================================================ */

/* ---------- 18.1 设计令牌 ---------- */
:root {
  /* 颜色：海、沙、叶、珊瑚、金 */
  --c-sea-900: #0b2f4d;
  --c-sea-700: #14567f;
  --c-sea-500: #1f7ab8;
  --c-sea-300: #7cc4e8;
  --c-sky-050: #f2f9ff;
  --c-sky-100: #e6f5ff;
  --c-sand-050: #fffaf0;
  --c-sand-100: #fff2d6;
  --c-sand-300: #ffd98a;
  --c-sand-500: #f0b64c;
  --c-leaf-500: #12a37a;
  --c-leaf-100: #e2f7f0;
  --c-coral-500: #ef6b47;
  --c-coral-100: #ffece5;
  --c-gold-500: #f0a92a;
  --c-gold-100: #fff4dd;
  --c-ink-900: #10203a;
  --c-ink-700: #2a4058;
  --c-ink-500: #5a7186;
  --c-line-200: #d9e5ef;
  --c-line-100: #e9f1f7;
  --c-surface: #ffffff;
  --c-canvas: #f3f8fc;

  /* 圆角 */
  --r-xs: 10px;
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-pill: 999px;

  /* 阴影：两层，低透明度，避免“糊” */
  --sh-1: 0 1px 2px rgba(16, 51, 82, .06), 0 2px 6px rgba(16, 51, 82, .05);
  --sh-2: 0 2px 6px rgba(16, 51, 82, .06), 0 10px 24px rgba(16, 51, 82, .08);
  --sh-3: 0 12px 34px rgba(11, 47, 77, .16);
  --sh-inset: inset 0 0 0 1px rgba(255, 255, 255, .5);

  /* 间距 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 28px;

  /* 字阶 */
  --fs-caption: 12px;
  --fs-body: 14px;
  --fs-title: 17px;
  --fs-h2: 20px;
  --fs-h1: 26px;
  --fs-stem: 21px;

  /* 交互 */
  --ring: 0 0 0 3px rgba(31, 122, 184, .28);
  --tap-min: 44px;
}

body {
  color: var(--c-ink-900);
  background-color: var(--c-canvas);
}

/* 键盘可达性：统一焦点环（不影响鼠标点击观感） */
a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid rgba(31, 122, 184, .55);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

/* ---------- 18.2 卡片与区块标题统一 ---------- */
.card {
  border-radius: var(--r-md);
  border: 1px solid var(--c-line-200);
  box-shadow: var(--sh-1);
  padding: var(--sp-4) var(--sp-4) var(--sp-5);
}
.card + .card { margin-top: var(--sp-4); }
.card-soft { background: linear-gradient(180deg, #fff, var(--c-sky-050)); }

.card-title {
  font-size: var(--fs-title);
  gap: var(--sp-2);
  padding-bottom: var(--sp-3);
  margin-bottom: var(--sp-3);
  border-bottom: 1px solid var(--c-line-100);
}
.card-title .hint { font-weight: 700; color: var(--c-ink-500); }
.card-title > .t-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 9px; flex: none;
  background: var(--c-sky-100); font-size: 15px;
}

/* 区块小标题（跨页面统一） */
.section-head {
  display: flex; align-items: center; gap: var(--sp-2);
  margin: var(--sp-5) 0 var(--sp-3);
}
.section-head .s-icon {
  width: 30px; height: 30px; border-radius: 10px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-sky-100); font-size: 16px;
}
.section-head .s-title { font-size: var(--fs-h2); font-weight: 900; }
.section-head .s-sub { font-size: var(--fs-caption); color: var(--c-ink-500); font-weight: 700; }

/* ---------- 18.3 按钮、状态芯片、统计块 ---------- */
.btn {
  border-radius: var(--r-sm);
  min-height: 42px;
  font-size: 14.5px;
  box-shadow: var(--sh-1);
  transition: transform .12s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease;
}
.btn-sm { min-height: 34px; padding: 6px 12px; }
.btn-lg { min-height: 52px; border-radius: var(--r-md); font-size: 16.5px; }
.btn:focus-visible { outline: 3px solid rgba(31, 122, 184, .55); outline-offset: 2px; }
.btn:disabled { box-shadow: none; }
.btn-primary { background: linear-gradient(180deg, #2b8ccb, var(--c-sea-700)); box-shadow: 0 4px 12px rgba(20, 86, 127, .26); }
.btn-accent { background: linear-gradient(180deg, #ff8b5e, #e2571f); box-shadow: 0 4px 12px rgba(226, 87, 31, .26); }
.btn-gold { background: linear-gradient(180deg, #ffd06a, var(--c-gold-500)); color: #5a3c02; box-shadow: 0 4px 12px rgba(240, 169, 42, .28); }
.btn-soft { background: #fff; border-color: var(--c-line-200); }
.btn-soft:hover { background: var(--c-sky-050); border-color: var(--c-sea-300); }

.chip {
  border-radius: var(--r-pill);
  font-weight: 800;
  min-height: 24px;
  border-color: var(--c-line-200);
}

.stat-tile {
  border-radius: var(--r-md);
  border: 1px solid var(--c-line-200);
  box-shadow: var(--sh-1);
  position: relative; overflow: hidden;
  padding: var(--sp-4) var(--sp-3);
}
.stat-tile::before {
  content: ''; position: absolute; left: 14px; right: 14px; top: 0; height: 3px;
  border-radius: 0 0 3px 3px; background: var(--c-sea-300); opacity: .8;
}
.stat-tile.stat-gold::before { background: var(--c-gold-500); }
.stat-tile.stat-green::before { background: var(--c-leaf-500); }
.stat-value { font-size: 25px; letter-spacing: -.5px; }
.stat-label { font-weight: 700; }

/* [V2 已移除] 旧 HTML 节点地图样式（第 902-1004 行）：改用插画式 SVG 地图 */

/* 关卡状态一览（地图下方，手机上也清楚） */
.level-strip { display: grid; gap: var(--sp-2); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.level-strip-item {
  display: flex; align-items: center; gap: var(--sp-2);
  border: 1px solid var(--c-line-200); border-radius: var(--r-sm);
  padding: 9px 11px; background: #fff; box-shadow: var(--sh-1); text-align: left;
  min-height: var(--tap-min); cursor: pointer;
}
.level-strip-item:hover { border-color: var(--c-sea-300); background: var(--c-sky-050); }
.level-strip-item .ls-idx {
  width: 26px; height: 26px; border-radius: 9px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 13px; background: #eef3f8; color: var(--c-ink-700);
}
.level-strip-item.is-cleared .ls-idx { background: var(--c-leaf-100); color: #0a6d52; }
.level-strip-item.is-available .ls-idx { background: var(--c-coral-100); color: #b8421c; }
.level-strip-item.is-locked { opacity: .72; }
.level-strip-item .ls-name { font-weight: 800; font-size: 13px; }
.level-strip-item .ls-state { font-size: 11.5px; color: var(--c-ink-500); font-weight: 700; }

@keyframes ringBreath {
  0%, 100% { transform: scale(1); opacity: .55; }
  50% { transform: scale(1.14); opacity: .15; }
}
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
@keyframes drift { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(calc(-50% + 8px), -54%); } }
@keyframes chestPop {
  0% { transform: translate(-50%, -50%) scale(.7) rotate(-8deg); }
  60% { transform: translate(-50%, -50%) scale(1.18) rotate(4deg); }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0); }
}

/* ---------- 18.5 答题页 ---------- */
.quiz-head { padding-bottom: var(--sp-3); border-bottom: 1px solid var(--c-line-100); }
.quiz-level-name { font-size: 16.5px; }
.quiz-progress-text {
  font-size: 13px; font-weight: 900; color: var(--c-sea-700);
  background: var(--c-sky-100); border: 1px solid #cfe8f8;
  padding: 4px 12px; border-radius: var(--r-pill);
}
.quiz-progress .bar { height: 10px; }

.q-card {
  border-radius: var(--r-lg);
  border: 1px solid var(--c-line-200);
  box-shadow: var(--sh-2);
  padding: 24px 22px 22px;
}
.q-stem {
  font-size: var(--fs-stem);
  line-height: 1.62;
  margin: 10px 0 6px;
  letter-spacing: .2px;
  color: var(--c-ink-900);
}
.q-point { font-weight: 700; color: var(--c-ink-500); }

.options { gap: var(--sp-3); margin-top: var(--sp-4); }
.option {
  min-height: 58px;
  border-radius: var(--r-md);
  border: 2px solid var(--c-line-200);
  background: #fff;
  box-shadow: var(--sh-1);
  font-size: 16px;
  padding: 14px 16px;
  transition: transform .1s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
}
.option:hover:not(:disabled) {
  border-color: var(--c-sea-300);
  background: var(--c-sky-050);
  box-shadow: var(--sh-2);
  transform: translateY(-1px);
}
.option:active:not(:disabled) { transform: scale(.985); }
.option .option-key {
  width: 34px; height: 34px; border-radius: 11px; font-size: 15px;
  background: #eef3f8; color: var(--c-ink-700);
}
/* 选中 */
.option.is-picked {
  border-color: var(--c-sea-500);
  background: var(--c-sky-100);
  box-shadow: 0 0 0 3px rgba(31, 122, 184, .16);
  animation: tapPulse .28s ease-out;
}
.option.is-picked .option-key { background: var(--c-sea-500); color: #fff; }
/* 正确 */
.option.is-correct {
  border-color: var(--c-leaf-500);
  background: var(--c-leaf-100);
  box-shadow: 0 0 0 3px rgba(18, 163, 122, .16);
}
.option.is-correct .option-key { background: var(--c-leaf-500); color: #fff; }
/* 错误 */
.option.is-wrong {
  border-color: var(--c-coral-500);
  background: var(--c-coral-100);
}
.option.is-wrong .option-key { background: var(--c-coral-500); color: #fff; }
/* 禁用：只在“既不是答案也不是我的选择”上降饱和，保证答案依然醒目 */
.option:disabled { cursor: default; }
.option:disabled:not(.is-correct):not(.is-wrong):not(.is-picked) { opacity: .62; }

.option-mark { font-weight: 900; font-size: 13.5px; white-space: nowrap; }

@keyframes tapPulse {
  0% { transform: scale(.985); }
  60% { transform: scale(1.012); }
  100% { transform: scale(1); }
}

/* 反馈区：布局稳定，解析变长也不会顶掉按钮 */
.feedback {
  margin-top: var(--sp-4);
  border-radius: var(--r-md);
  padding: 16px;
  min-height: 104px;
  position: relative;
  animation: feedbackIn .26s ease-out both;
}
.feedback.is-ok { background: var(--c-leaf-100); border-color: #bfe9dc; }
.feedback.is-bad { background: #fff6f1; border-color: #ffd9c9; }
.feedback-title { font-size: 16.5px; gap: 8px; }
.feedback.is-ok .feedback-title { color: #0a6d52; }
.feedback.is-bad .feedback-title { color: #b8421c; }
.answer-box {
  border: 1px solid var(--c-line-200);
  background: #fff; padding: 4px 12px; border-radius: var(--r-xs);
}
.analysis {
  border-left: 4px solid var(--c-sea-300);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  line-height: 1.7;
}
.hint-box {
  border: 1px solid #f0dcb0; border-radius: var(--r-sm);
  padding: 12px 14px; line-height: 1.7;
  animation: hintIn .34s ease-out both;
}
@keyframes feedbackIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes hintIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

/* 答对时的星星反馈（纯装饰，不吃点击） */
.star-burst {
  position: absolute; inset: auto; left: 18px; top: -6px; width: 0; height: 0;
  pointer-events: none;
}
.star-burst span {
  position: absolute; font-size: 15px; animation: burst .75s ease-out both;
}
.star-burst span:nth-child(1) { animation-delay: 0s; }
.star-burst span:nth-child(2) { animation-delay: .07s; }
.star-burst span:nth-child(3) { animation-delay: .14s; }
@keyframes burst {
  0% { opacity: 0; transform: translate(0, 0) scale(.4); }
  35% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--bx, 14px), var(--by, -26px)) scale(1.05); }
}

.quiz-foot {
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  border-top: 1px dashed var(--c-line-200);
  gap: var(--sp-3);
}
.quiz-foot .btn-lg { min-width: 190px; }

/* ---------- 18.6 结算页 ---------- */
.result-hero {
  border-radius: var(--r-lg);
  padding: 30px 24px 26px;
  background:
    radial-gradient(120% 80% at 50% -20%, rgba(124, 196, 232, .55), transparent 62%),
    linear-gradient(180deg, var(--c-sea-700), #0d3f61);
  box-shadow: var(--sh-3);
}
.result-hero.is-fail {
  background:
    radial-gradient(120% 80% at 50% -20%, rgba(255, 255, 255, .28), transparent 60%),
    linear-gradient(180deg, #5d7080, #47596a);
}
.result-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255, 255, 255, .16);
  border: 1px solid rgba(255, 255, 255, .28);
  padding: 5px 14px; border-radius: var(--r-pill);
  font-size: 12.5px; font-weight: 800; margin-bottom: 10px;
}
.result-title { font-size: 25px; letter-spacing: .4px; }
.result-sub { font-size: 14px; font-weight: 600; }

.big-stars {
  font-size: 46px; letter-spacing: 10px; margin: 14px 0 6px;
  color: var(--c-sand-300);
  text-shadow: 0 4px 14px rgba(0, 0, 0, .3);
}
.big-stars .star-pop { animation: starLight .62s cubic-bezier(.2, 1.4, .4, 1) both; }
.big-stars .dim { color: rgba(255, 255, 255, .3); text-shadow: none; }
@keyframes starLight {
  0% { transform: scale(.2) rotate(-45deg); opacity: 0; filter: blur(2px); }
  70% { transform: scale(1.18) rotate(4deg); opacity: 1; filter: blur(0); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* 宝箱：通关后开启 */
.result-chest {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 68px; height: 68px; margin: 16px auto 2px;
  border-radius: 50%; background: rgba(255, 255, 255, .14);
  border: 1px solid rgba(255, 255, 255, .26);
  font-size: 34px; pointer-events: none;
}
.result-chest.is-open { animation: chestPop 0.7s cubic-bezier(.2, 1.3, .4, 1) both; }
.result-chest .chest-rays {
  position: absolute; inset: -10px; border-radius: 50%;
  border: 2px dashed rgba(255, 217, 138, .6);
  animation: spinSlow 9s linear infinite; pointer-events: none;
}
@keyframes spinSlow { to { transform: rotate(360deg); } }

.result-tile { border-radius: var(--r-md); }
.unlock-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, .92); color: var(--c-sea-900);
  border-radius: var(--r-pill); padding: 6px 14px; font-weight: 800; font-size: 13px;
  box-shadow: var(--sh-1);
}
.unlock-chip.is-locked { background: rgba(255, 255, 255, .8); color: #6b7f92; }
.result-actions {
  display: grid; gap: var(--sp-3);
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  margin-top: var(--sp-4);
}
.result-actions .btn { width: 100%; }
.result-secondary { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-3); }

/* 徽章：更像奖章 */
.badge-tile { border-radius: var(--r-md); padding: 14px 10px; }
.badge-tile.is-earned { border: 1px solid #f0d9a4; }
.badge-emoji {
  width: 46px; height: 46px; margin: 0 auto 6px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: #eef3f8;
}
.badge-tile.is-earned .badge-emoji {
  background: radial-gradient(closest-side, #fff6dd, var(--c-gold-100));
  box-shadow: inset 0 0 0 2px #f3ddb0;
}
.badge-name { font-size: 13.5px; }

/* ---------- 18.7 大厅 / 知识包 / 错题本 / 报告统一 ---------- */
.hero {
  border-radius: var(--r-lg);
  background:
    radial-gradient(110% 80% at 88% -20%, rgba(255, 217, 138, .45), transparent 58%),
    linear-gradient(150deg, var(--c-sea-700), #17618f 62%, #2b8ccb);
  box-shadow: var(--sh-3);
}
.hero-actions .btn-lg { min-width: 200px; }
.hero-level .level-badge { background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .32); }

.entry {
  border-radius: var(--r-md);
  box-shadow: var(--sh-1);
  min-height: 132px;
}
.entry:hover { box-shadow: var(--sh-2); }
.entry-emoji {
  width: 42px; height: 42px; border-radius: 13px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--c-sky-100); font-size: 21px;
}

.pack-card {
  border-radius: var(--r-md);
  border-top-width: 4px;
  box-shadow: var(--sh-1);
  gap: var(--sp-3);
}
.pack-card:hover { box-shadow: var(--sh-2); }
.pack-name { font-size: 17.5px; }
/* 关卡进度小圆点：一眼看出打到第几关 */
.level-dots { display: inline-flex; gap: 5px; align-items: center; }
.level-dots i {
  width: 16px; height: 16px; border-radius: 50%; display: block;
  border: 2px solid var(--c-line-200); background: #fff;
}
.level-dots i.is-cleared { background: var(--c-leaf-500); border-color: var(--c-leaf-500); }
.level-dots i.is-available { border-color: var(--c-coral-500); background: var(--c-coral-100); }
.level-dots i.is-locked { background: #eef3f8; border-color: #d7e1ea; }

.wrong-card { border-radius: var(--r-md); box-shadow: var(--sh-1); }
.wrong-card.is-pending { border-left: 5px solid var(--c-coral-500); }
.wrong-card.is-mastered { border-left: 5px solid var(--c-leaf-500); }
.wrong-head { gap: var(--sp-2); }
.wrong-stem { font-size: 16px; line-height: 1.6; }
.opt-line { border-radius: var(--r-xs); padding: 7px 11px; }
.opt-line.is-answer { background: var(--c-leaf-100); }
.opt-line.is-chosen { background: var(--c-coral-100); }
/* 错题操作区：更容易找到 */
.wrong-actions {
  display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center;
  margin-top: var(--sp-3); padding-top: var(--sp-3);
  border-top: 1px dashed var(--c-line-200);
}
.wrong-actions .btn { min-height: 38px; }

.subject-row { padding: var(--sp-3) 0; }
.point-row { padding: 11px 0; }
.point-name { font-size: 14px; }
.status-chip { padding: 4px 11px; font-size: 12px; }

/* 报告：先看掌握状态，再看数字 */
.report-lead { display: grid; gap: var(--sp-4); grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
@media (max-width: 860px) { .report-lead { grid-template-columns: 1fr; } }
.mastery-hero {
  border-radius: var(--r-md);
  background: linear-gradient(180deg, #fff, var(--c-sky-050));
  border: 1px solid var(--c-line-200);
  padding: var(--sp-5);
  box-shadow: var(--sh-1);
}
.mastery-hero .mh-num { font-size: 34px; font-weight: 900; line-height: 1.1; color: var(--c-sea-700); }
.mastery-hero .mh-label { font-size: 13px; color: var(--c-ink-500); font-weight: 700; }

/* ---------- 18.8 触控与响应式补强 ---------- */
@media (max-width: 759px) {
  .q-card { padding: 18px 16px; }
  .q-stem { font-size: 18px; }
  .option { min-height: 56px; font-size: 15.5px; }
  .option .option-key { width: 32px; height: 32px; }
  .quiz-foot .btn-lg { min-width: 100%; }
  .result-actions { grid-template-columns: 1fr; }
  .level-strip { grid-template-columns: 1fr; }
  .entry { min-height: 118px; }
}

/* 触控设备：保证主要可点区域不小于 44px */
.tab { min-height: 52px; }
.filter-btn { min-height: 36px; }
.level-strip-item { min-height: var(--tap-min); }

/* ============================================================
 * 19. 知闯岛 V2：儿童冒险游戏主界面
 * ------------------------------------------------------------
 * 目标：首页不再是“学习管理后台”，而是「游戏主界面」——
 *   紧凑 HUD + 插画式冒险地图（视觉主体）+ 一个突出的继续冒险按钮
 *   + 地图下方的辅助信息 + 次级入口图标栏
 * 全部由真实数据驱动，不使用任何外部图片。
 * ============================================================ */

/* ---------- 19.1 紧凑游戏 HUD（替换原横向数据面板） ---------- */
.topbar {
  background: linear-gradient(180deg, #17618f, #14567f);
  box-shadow: 0 2px 10px rgba(11, 47, 77, .22);
}
.topbar-inner { padding: 8px 14px; gap: 10px; }
.brand { font-size: 18px; letter-spacing: 1.5px; }
.hud-group { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.hud-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .16);
  border: 1px solid rgba(255, 255, 255, .26);
  font-size: 13px; font-weight: 900; color: #fff; white-space: nowrap;
}
.hud-chip.is-level { background: rgba(18, 163, 122, .34); border-color: rgba(160, 235, 210, .5); }
.hud-chip.is-star { background: rgba(240, 169, 42, .3); border-color: rgba(255, 213, 130, .55); }
.hud-chip.is-xp { background: rgba(124, 196, 232, .3); border-color: rgba(180, 230, 255, .55); }
.hud-chip .hud-ico { font-size: 14px; }

/* ---------- 19.2 首页冒险主体 ---------- */
.adventure-hero {
  position: relative;
  border-radius: var(--r-lg);
  padding: 12px;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255, 255, 255, .85), transparent 60%),
    linear-gradient(180deg, #eaf7ff, #e2f4ea 62%, #fdf3df);
  border: 1px solid #cfe4f2;
  box-shadow: var(--sh-2);
}
.hero-top {
  display: flex; align-items: center; gap: var(--sp-3);
  flex-wrap: wrap; padding: 2px 6px 10px;
}
.hero-pack { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hero-pack-icon {
  width: 40px; height: 40px; border-radius: 13px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 20px; background: #fff; border: 1px solid var(--c-line-200); box-shadow: var(--sh-1);
}
.hero-title { font-size: 20px; font-weight: 900; letter-spacing: .3px; }
.hero-sub { font-size: 12.5px; color: var(--c-ink-500); font-weight: 700; }
.hero-top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hero-stat {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px;
  border-radius: var(--r-pill); background: #fff; border: 1px solid var(--c-line-200);
  font-size: 12.5px; font-weight: 900; color: var(--c-ink-700); box-shadow: var(--sh-1);
}
.hero-map {
  position: relative; border-radius: var(--r-md); overflow: hidden;
  background: #bfe6ff; border: 1px solid #c6e2f2;
}
.hero-map .adventure-map,
.map-wrap .adventure-map { width: 100%; height: auto; display: block; }

/* 地图下方的目标 + 主按钮（暖黄色强调，全页唯一主按钮） */
.hero-bar {
  display: flex; align-items: center; gap: var(--sp-3);
  margin-top: 10px; padding: 10px 12px;
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, .82);
  border: 1px solid #e3eef7;
  flex-wrap: wrap;
}
.hero-goal { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.hero-goal-ico {
  width: 36px; height: 36px; border-radius: 12px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #fff3d6, #ffe1a8); font-size: 18px;
  border: 1px solid #f0d9a4;
}
.hero-goal-title { font-size: 15px; font-weight: 900; }
.hero-goal-sub { font-size: 12px; color: var(--c-ink-500); font-weight: 700; }
.hero-cta {
  min-width: 210px;
  font-size: 17px;
  padding: 14px 26px;
  box-shadow: 0 6px 18px rgba(226, 142, 31, .34);
}
.hero-cta-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- 19.3 辅助信息区（不抢地图重点） ---------- */
.home-panels {
  display: grid; gap: var(--sp-3);
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr);
  margin-top: var(--sp-4);
}
@media (max-width: 900px) { .home-panels { grid-template-columns: 1fr; } }
.panel {
  border-radius: var(--r-md);
  padding: var(--sp-4);
  border: 1px solid var(--c-line-200);
  background: #fff;
  box-shadow: var(--sh-1);
}
.panel.is-task { background: linear-gradient(180deg, #fff, #fff8ec); border-color: #f2e2c4; }
.panel.is-recent { background: linear-gradient(180deg, #fff, #f2f9ff); border-color: #d9ebf7; }
.panel.is-mastery { background: linear-gradient(180deg, #fff, #f1fbf6); border-color: #d5eee3; }
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: var(--sp-3); }
.panel-head .p-ico {
  width: 26px; height: 26px; border-radius: 9px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, .8); border: 1px solid var(--c-line-200); font-size: 14px;
}
.panel-head .p-title { font-size: 14.5px; font-weight: 900; }
.panel-head .p-hint { margin-left: auto; font-size: 11.5px; color: var(--c-ink-500); font-weight: 700; }
.mini-task { display: flex; align-items: center; gap: 9px; padding: 6px 0; }
.mini-task .mt-ico { font-size: 16px; width: 22px; text-align: center; }
