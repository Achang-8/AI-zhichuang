              '<span class="status-chip" style="background:' + meta.soft + ';color:' + meta.color + '">' + meta.emoji + ' ' + meta.label + '</span>' +
              '<div style="flex:1;min-width:0">' +
                '<div class="point-name">' + util.esc(p.point) + '</div>' +
                '<div class="point-meta">' + ZCD.gradeLabel(p.grade) + ' · ' + ZCD.subjectMeta(p.subject).name +
                  ' · 作答 ' + p.answered + ' 次 · 正确 ' + p.correct + ' 次 · 正确率 ' + p.accuracy + '%' +
                  (p.reviewCount ? ' · 复习 ' + p.reviewCount + ' 次' : '') +
                  ' · 最近 ' + util.fmtRelative(p.lastAt) + '</div>' +
                '<div class="point-meta">' + util.esc(p.reason) + '</div>' +
              '</div>' +
              '<span class="recent-dots">' + p.recent.slice(-5).map(function (v) {
                return '<i class="' + (v ? 'ok' : 'bad') + '"></i>';
              }).join('') + '</span>' +
            '</div>';
          }).join('')
        : '<div class="text-sm text-muted">还没有练过任何知识点。</div>';

      /* ---- 学科进度 ---- */
      var subjectRows = ZCD.SUBJECTS.map(function (sub) {
        var levels = 0, cleared = 0, starsSum = 0, answered = 0, correct = 0;
        allPacks.filter(function (p) { return p.subject === sub.key; }).forEach(function (p) {
          var prog = ZCD.store.packProgress(p.id);
          levels += prog.levels;
          cleared += prog.cleared;
          starsSum += prog.stars;
        });
        ZCD.GRADES.forEach(function (g) {
          var key = g.grade + '|' + sub.key;
          var st = s.stats.bySubject[key];
          if (st) { answered += st.answered; correct += st.correct; }
        });
        return { sub: sub, levels: levels, cleared: cleared, stars: starsSum, answered: answered, correct: correct, percent: util.pct(cleared, levels) };
      });

      var subjectHTML = subjectRows.map(function (r) {
        return '<div class="subject-row">' +
          '<span class="subject-icon">' + r.sub.emoji + '</span>' +
          '<div class="subject-body">' +
            '<div class="subject-name">' + r.sub.name +
              '<span class="subject-num">已完成 ' + r.cleared + '/' + r.levels + ' 关 · ⭐ ' + r.stars + '</span>' +
            '</div>' +
            '<div class="mt-8">' + ui.bar(r.percent, r.sub.key === 'math' ? '' : 'bar-green') + '</div>' +
            '<div class="subject-num mt-8">答题 ' + r.answered + ' 道 · 正确率 ' + util.pct(r.correct, r.answered) + '%</div>' +
          '</div>' +
          '<span class="text-sm" style="font-weight:900;color:' + r.sub.color + '">' + r.percent + '%</span>' +
        '</div>';
      }).join('');

      /* ---- 年级 × 学科 明细 ---- */
      var matrix = ZCD.data.gradeSubjectMatrix().map(function (row) {
        var levels = 0, cleared = 0, starsSum = 0;
        row.packs.forEach(function (p) {
          var prog = ZCD.store.packProgress(p.id);
          levels += prog.levels; cleared += prog.cleared; starsSum += prog.stars;
        });
        var st = s.stats.bySubject[row.grade + '|' + row.subject.key] || { answered: 0, correct: 0 };
        return '<tr>' +
          '<td>' + row.gradeLabel + '</td>' +
          '<td>' + row.subject.emoji + ' ' + row.subject.name + '</td>' +
          '<td>' + row.packs.length + ' 个</td>' +
          '<td>' + cleared + ' / ' + levels + '</td>' +
          '<td>⭐ ' + starsSum + '</td>' +
          '<td>' + st.answered + '</td>' +
          '<td>' + util.pct(st.correct, st.answered) + '%</td>' +

      /* ---- 近期学习记录 ---- */
      var recent = ZCD.store.recentAnswers(15);
      var recentHTML = recent.length ? '<div class="table-wrap"><table class="data">' +
        '<thead><tr><th>时间</th><th>年级 / 学科</th><th>知识点</th><th class="wrap">题目</th><th>结果</th></tr></thead><tbody>' +
        recent.map(function (a) {
          return '<tr>' +
            '<td>' + util.fmtDateTime(a.ts) + '</td>' +
            '<td>' + ZCD.gradeLabel(a.grade) + ' · ' + ZCD.subjectMeta(a.subject).name + '</td>' +
            '<td>' + util.esc(a.point || '—') + '</td>' +
            '<td class="wrap">' + util.esc(a.stem) + '</td>' +
            '<td>' + (a.correct ? '<span class="chip chip-green">答对</span>' : '<span class="chip chip-red">答错</span>') +
              (a.mode === 'review' ? ' <span class="chip chip-gray">复习</span>' : '') + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>'
        : ui.empty('📄', '还没有答题记录，去闯一关吧。', '<button class="btn btn-primary" data-go="/select">开始闯关</button>');

      /* ---- 待复习错题预览 ---- */
      var pending = ZCD.store.wrongList({ status: 'pending' }).slice(0, 5);
      var pendingHTML = pending.length ? pending.map(function (e) {
        return '<div class="recent-item">' +
          '<span class="recent-dot bad"></span>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="text-sm"><b>' + util.esc(e.stem) + '</b></div>' +
            '<div class="text-xs text-muted">' + ZCD.gradeLabel(e.grade) + ' · ' + ZCD.subjectMeta(e.subject).name + ' · ' + util.esc(e.point || '') + ' · ' + util.fmtRelative(e.updatedAt || e.ts) + '</div>' +
          '</div>' +
          '<span class="chip chip-red">待复习</span>' +
        '</div>';
      }).join('') + '<div class="row mt-12"><button class="btn btn-primary btn-sm" data-go="/wrong">去错题本复习</button></div>'
        : '<div class="notice notice-warn">没有待复习的错题，保持住！</div>';

      /* ---- 徽章墙 ---- */
      var badgeList = ZCD.store.badges();
      var earnedCount = badgeList.filter(function (b) { return b.earned; }).length;
      var badgeHTML = '<div class="card mt-16">' +
        '<h2 class="card-title">🎖️ 徽章墙 <span class="hint">已获得 ' + earnedCount + ' / ' + badgeList.length + ' 枚（全部由真实学习数据判定）</span></h2>' +
        '<div class="grid grid-4">' + badgeList.map(ui.badge).join('') + '</div>' +
      '</div>';

      return '' +
        '<div class="view-title-row">' +
          '<div><h1 class="view-title">📊 学习报告</h1>' +
          '<p class="view-desc">下面的数字全部来自你在本机的真实答题记录，刷新后依然保留。</p></div>' +
          '<div class="spacer"></div>' +
          '<button class="btn btn-soft btn-sm" data-go="/settings">数据与设置</button>' +
        '</div>' +

        /* 知识掌握放在最前：先看“学到什么程度”，再看数字 */
        '<div class="report-lead mt-16">' +
          '<div class="mastery-hero">' +
            '<h2 class="card-title" style="border-bottom:0;padding-bottom:0;margin-bottom:6px">' +
              '<span class="t-icon">🧠</span>我的知识掌握情况 <span class="hint">' + masteredLabel + '</span></h2>' +
            '<div class="row" style="align-items:baseline;gap:10px">' +
              '<span class="mh-num">' + counts.mastered + '</span>' +
              '<span class="mh-label">/ ' + mastery.total + ' 个知识点已掌握（' + mastery.masteredPercent + '%）</span>' +
            '</div>' +
            masteryBarHTML +
            '<div class="mastery-legend mt-12">' +
              '<span>✅ 已掌握 ' + counts.mastered + '</span>' +
              '<span>💪 还需练习 ' + counts.practice + '</span>' +
              '<span>🌱 尚未学习 ' + counts.new + '</span>' +
            '</div>' +
            '<div class="notice mt-12 text-xs">判定规则：同一知识点至少作答 3 次、最近 3 次都答对，并且这个知识点的错题都已经复习过，才会算「已掌握」。</div>' +
            '<div class="notice notice-warn mt-8 text-xs">' + util.esc(ZCD.mastery.DISCLAIMER) + '</div>' +
          '</div>' +
          '<div class="card">' +
            '<h2 class="card-title"><span class="t-icon">🎯</span>下一步学习建议 <span class="hint">按固定规则生成</span></h2>' +
            suggestHTML +
          '</div>' +
        '</div>' +

        '<div class="grid grid-4 mt-16">' +
          '<div class="stat-tile"><div class="stat-value">' + s.totals.answered + '</div><div class="stat-label">累计答题数</div></div>' +
          '<div class="stat-tile stat-green"><div class="stat-value">' + accuracy + '%</div><div class="stat-label">总体正确率</div></div>' +
          '<div class="stat-tile"><div class="stat-value">' + clearedLevels + '<small> / ' + totalLevels + '</small></div><div class="stat-label">已完成关卡</div></div>' +
          '<div class="stat-tile stat-gold"><div class="stat-value">⭐ ' + stars + '</div><div class="stat-label">累计星星</div></div>' +
        '</div>' +

        '<div class="grid grid-4 mt-12">' +
          '<div class="stat-tile"><div class="stat-value">⚡ ' + s.xp + '</div><div class="stat-label">累计经验值</div></div>' +
          '<div class="stat-tile"><div class="stat-value">Lv.' + lv.level + '</div><div class="stat-label">当前等级 · ' + util.esc(lv.title) + '</div></div>' +
          '<div class="stat-tile"><div class="stat-value">' + days + '</div><div class="stat-label">有学习记录的天数</div></div>' +
          '<div class="stat-tile"><div class="stat-value">' + ws.pending + '</div><div class="stat-label">待复习错题（共 ' + ws.total + '）</div></div>' +
        '</div>' +

        '<div class="grid grid-2 mt-16">' +
          '<div class="card">' +
            '<h2 class="card-title"><span class="t-icon">📚</span>各学科知识点状态分布</h2>' + subjectMasteryHTML +
          '</div>' +
          '<div class="card">' +
            '<h2 class="card-title"><span class="t-icon">🔥</span>需要优先复习的知识点 <span class="hint">按错题与近期错误排序</span></h2>' +
            priorityHTML +
            '<h2 class="card-title mt-16"><span class="t-icon">🕒</span>最近一次学习表现</h2>' + perfHTML +
          '</div>' +
        '</div>' +

        '<div class="grid grid-2 mt-16">' +
          '<div class="card">' +
            '<h2 class="card-title"><span class="t-icon">🗂️</span>各学科完成进度</h2>' + subjectHTML +
            '<div class="notice mt-12 text-xs">进度 = 已通关关卡 ÷ 该学科全部关卡；正确率 = 该学科答对题数 ÷ 答题数。</div>' +
          '</div>' +
          '<div class="card">' +
            '<h2 class="card-title">📌 今天的学习</h2>' +
            '<div class="grid grid-2">' +
              '<div class="stat-tile"><div class="stat-value">' + today.answered + '</div><div class="stat-label">今日答题</div></div>' +
              '<div class="stat-tile stat-green"><div class="stat-value">' + today.correct + '</div><div class="stat-label">今日答对</div></div>' +
              '<div class="stat-tile"><div class="stat-value">' + today.cleared + '</div><div class="stat-label">今日通关</div></div>' +
              '<div class="stat-tile"><div class="stat-value">' + today.reviews + '</div><div class="stat-label">今日复习错题</div></div>' +
            '</div>' +
            '<h2 class="card-title mt-16">🔥 待复习错题（' + ws.pending + ' 道）</h2>' + pendingHTML +
          '</div>' +
        '</div>' +

        '<div class="card mt-16">' +
          '<h2 class="card-title">🔍 练过的知识点明细 <span class="hint">' + studiedPoints.length + ' 个知识点有练习记录，另有 ' + notStartedCount + ' 个还没有开始学习</span></h2>' +
          (studiedPoints.length ? '<details class="more" open><summary>展开/收起明细</summary>' + pointDetailHTML + '</details>' : pointDetailHTML) +
        '</div>' +

        '<div class="card mt-16">' +
          '<h2 class="card-title">🏫 各年级学科明细</h2>' +
          '<div class="table-wrap"><table class="data">' +
            '<thead><tr><th>年级</th><th>学科</th><th>知识包</th><th>已通关</th><th>星星</th><th>答题数</th><th>正确率</th></tr></thead>' +
            '<tbody>' + matrix + '</tbody>' +
          '</table></div>' +
        '</div>' +

        badgeHTML +

        '<div class="card mt-16">' +
          '<h2 class="card-title">🕒 近期学习记录 <span class="hint">最近 15 条</span></h2>' +
          recentHTML +
        '</div>' +

        '<div class="notice mt-16">📵 本报告完全由浏览器本地数据计算，没有调用任何外部接口或 AI 模型。</div>';
    }
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
/*!
 * 知闯岛 · 题库管理（导入 / 校验 / 预览）、数据与设置、关于
 */
(function (root) {
  'use strict';
  var ZCD = root.ZCD;
  var util = ZCD.util;
  var ui = ZCD.ui;
  var V = ZCD.validateLib || (root.ZCD && root.ZCD.validateLib);
  ZCD.views = ZCD.views || {};

  /* ==================== 示例题库（用于生成可下载的示例文件） ==================== */

  var SAMPLE_PACK = {
    name: '三年级数学 · 我的练习包',
    grade: 3,
    subject: 'math',
    intro: '示例文件：5 道题，覆盖 2 个关卡，演示导入所需的全部字段。',
    difficulty: 1,
    levelNames: ['第 1 关 · 乘法热身', '第 2 关 · 综合练习']
  };

  var SAMPLE_QUESTIONS = [
    {
      id: 'sample-01', grade: 3, subject: 'math', level: 1, point: '两位数乘一位数', type: 'single',
      stem: '23 × 3 = ？',
      options: [{ key: 'A', text: '69' }, { key: 'B', text: '66' }, { key: 'C', text: '63' }, { key: 'D', text: '96' }],
      answer: 'A', analysis: '23 × 3 = 20 × 3 + 3 × 3 = 60 + 9 = 69。',
      hint: '把 23 拆成 20 和 3，分别乘 3，再把两个结果加起来。', difficulty: 1
    },
    {
      id: 'sample-02', grade: 3, subject: 'math', level: 1, point: '混合运算', type: 'single',
      stem: '25 + 5 × 7 = ？',
      options: [{ key: 'A', text: '210' }, { key: 'B', text: '60' }, { key: 'C', text: '70' }, { key: 'D', text: '32' }],
      answer: 'B', analysis: '先算乘法再算加法：5 × 7 = 35，25 + 35 = 60。',
      hint: '没有括号时，先算乘法，再算加法。', difficulty: 1
    },
    {
      id: 'sample-03', grade: 3, subject: 'math', level: 1, point: '有余数除法', type: 'single',
      stem: '47 ÷ 5 的商和余数分别是多少？',
      options: [{ key: 'A', text: '商 9 余 2' }, { key: 'B', text: '商 8 余 7' }, { key: 'C', text: '商 9 余 5' }, { key: 'D', text: '商 10 余 3' }],
      answer: 'A', analysis: '5 × 9 = 45，47 − 45 = 2，所以商 9 余 2；余数必须比除数 5 小。',
      hint: '先想 5 乘几最接近 47 又不超过 47，再看还差多少。', difficulty: 2
    },
    {
      id: 'sample-04', grade: 3, subject: 'math', level: 2, point: '长方形周长', type: 'judge',
      stem: '长 8 厘米、宽 5 厘米的长方形，周长是 26 厘米。',
      options: [{ key: 'A', text: '正确' }, { key: 'B', text: '错误' }],
      answer: 'A', analysis: '长方形周长 =（长 + 宽）× 2 =（8 + 5）× 2 = 26 厘米。',
      hint: '回忆长方形周长的公式，再代入长和宽算一遍。', difficulty: 2
    },
    {
      id: 'sample-05', grade: 3, subject: 'math', level: 2, point: '同分母分数加法', type: 'single',
      stem: '2/7 + 3/7 = ？',
      options: [{ key: 'A', text: '5/14' }, { key: 'B', text: '5/7' }, { key: 'C', text: '6/7' }, { key: 'D', text: '1/7' }],
      answer: 'B', analysis: '同分母分数相加，分母不变，分子相加：2 + 3 = 5，结果是 5/7。',
      hint: '同分母分数相加时，分母保持不变，只把分子相加。', difficulty: 2
    }
  ];

  function sampleCsv() {
    var withPack = SAMPLE_QUESTIONS.map(function (q) {
      return Object.assign({}, q, { _packName: SAMPLE_PACK.name });
    });
    return V.toCsv(withPack);
  }

  function sampleJson() {
    return V.toPackJson(SAMPLE_PACK, SAMPLE_QUESTIONS);
  }

  /* 示例文件生成器对外暴露，便于「下载 → 再导入」的往返自测 */
  ZCD.samples = {
    pack: SAMPLE_PACK,
    questions: SAMPLE_QUESTIONS,
    json: sampleJson,
    csv: sampleCsv
  };

  /* ==================== 导入状态（模块内保存，刷新后清空） ==================== */

  var importState = null;   // {fatal, parsed, validation, packCheck, filename, text}

  function runParse(text, filename) {
    var parsed = V.parseAny(text, filename);
    if (!parsed || parsed.fatal) {
      importState = { fatal: (parsed && parsed.fatal) || '无法解析文件内容。', filename: filename, text: text };
      return;
    }
    var questions = V.dedupeIds(parsed.questions.slice());
    // 用来源文件里的年级/学科/知识包名为默认值
    var meta = parsed.packMeta || {};
    var first = questions[0] || {};
    var packMeta = {
      name: meta.name || (first._packName || '') || '我的知识包',
      grade: Number(meta.grade) || Number(first.grade) || 3,
      subject: (meta.subject && V.SUBJECTS.indexOf(meta.subject) >= 0) ? meta.subject : (V.SUBJECTS.indexOf(first.subject) >= 0 ? first.subject : 'math'),
      intro: meta.intro || '由我导入的自定义题库。',
      difficulty: [1, 2, 3].indexOf(Number(meta.difficulty)) >= 0 ? Number(meta.difficulty) : 2
    };
    var validation = V.validateQuestions(questions, { strictIds: false });
    var packCheck = V.validatePack(packMeta, questions);
    importState = {
      fatal: null,
      parsed: parsed,
      questions: questions,
      packMeta: packMeta,
      validation: validation,
      packCheck: packCheck,
      filename: filename,
      text: text
    };
  }

  function issuesHTML(validation, packCheck) {
    var issues = [];
    (packCheck ? packCheck.errors : []).forEach(function (e) { issues.push({ level: 'error', message: '【知识包】' + e.message }); });
    (packCheck ? packCheck.warnings : []).forEach(function (e) { issues.push({ level: 'warning', message: '【知识包】' + e.message }); });
    validation.errors.forEach(function (e) { issues.push({ level: 'error', message: e.message }); });
    validation.warnings.forEach(function (e) { issues.push({ level: 'warning', message: e.message }); });
    if (!issues.length) return '<div class="notice notice-ok" style="background:var(--green-soft);border-color:#c7efe1;color:#0b7a5b">✅ 校验通过：题目、选项、标准答案、年级、学科、解析、难度都符合格式要求，可以导入。</div>';
    var shown = issues.slice(0, 120);
    return '<div class="issues">' + shown.map(function (it) {
      return '<div class="issue ' + (it.level === 'error' ? 'is-error' : 'is-warning') + '">' +
        '<span class="issue-icon">' + (it.level === 'error' ? '❌' : '⚠️') + '</span>' +
        '<span>' + util.esc(it.message) + '</span></div>';
    }).join('') +
    (issues.length > shown.length ? '<div class="issue is-warning"><span class="issue-icon">…</span><span>还有 ' + (issues.length - shown.length) + ' 条提示未显示</span></div>' : '') +
    '</div>';
  }

  function previewTable(questions) {
    var rows = questions.slice(0, 20);
    return '<div class="table-wrap" id="import-preview"><table class="data">' +
      '<thead><tr><th>行</th><th>年级</th><th>学科</th><th>关卡</th><th>题型</th><th class="wrap">题目</th><th>选项</th><th>答案</th><th>提示</th></tr></thead><tbody>' +
      rows.map(function (q) {
        var subj = ZCD.subjectMeta(q.subject);
        return '<tr>' +
          '<td>' + (q._row || '-') + '</td>' +
          '<td>' + (isNaN(q.grade) ? '<span style="color:var(--red)">' + util.esc(q.grade) + '</span>' : q.grade) + '</td>' +
          '<td>' + util.esc(subj.name) + '</td>' +
          '<td>' + (q.level || '-') + '</td>' +
          '<td>' + (q.type === 'judge' ? '判断' : (q.type === 'single' ? '单选' : util.esc(q.type))) + '</td>' +
          '<td class="wrap">' + util.esc(String(q.stem).slice(0, 60)) + '</td>' +
          '<td>' + (q.options || []).length + ' 个</td>' +
          '<td><b>' + util.esc(q.answer) + '</b></td>' +
          '<td>' + (q.hint ? '✅ 有' : '—') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>' +
      (questions.length > 20 ? '<div class="text-xs text-muted mt-8">只预览前 20 行，共 ' + questions.length + ' 道题。</div>' : '');

    mount: function (ctx, main) {
      /* --- 示例下载 --- */
      var dlJson = main.querySelector('#dl-json');
      if (dlJson) dlJson.addEventListener('click', function () {
        util.download('知闯岛-示例题库.json', sampleJson(), 'application/json');
        ui.toast('示例 JSON 已开始下载', 'ok');
      });
      var dlCsv = main.querySelector('#dl-csv');
      if (dlCsv) dlCsv.addEventListener('click', function () {
        util.download('知闯岛-示例题库.csv', '\uFEFF' + sampleCsv(), 'text/csv');
        ui.toast('示例 CSV 已开始下载', 'ok');
      });

      /* --- 文件选择 / 拖放 / 粘贴 --- */
      var fileInput = main.querySelector('#io-file');
      var textarea = main.querySelector('#io-text');
      var dropzone = main.querySelector('#dropzone');

      function readFile(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var text = String(reader.result || '');
          if (textarea) textarea.value = text;
          runParse(text, file.name);
          ZCD.app.render();
        };
        reader.onerror = function () { ui.toast('文件读取失败，请重试', 'bad'); };
        reader.readAsText(file, 'utf-8');
      }

      if (dropzone) {
        dropzone.addEventListener('click', function () { if (fileInput) fileInput.click(); });
        ['dragenter', 'dragover'].forEach(function (t) {
          dropzone.addEventListener(t, function (ev) { ev.preventDefault(); dropzone.classList.add('is-over'); });
        });
        ['dragleave', 'drop'].forEach(function (t) {
          dropzone.addEventListener(t, function (ev) { ev.preventDefault(); dropzone.classList.remove('is-over'); });
        });
        dropzone.addEventListener('drop', function (ev) {
          var files = ev.dataTransfer && ev.dataTransfer.files;
          if (files && files.length) readFile(files[0]);
        });
      }
      if (fileInput) {
        fileInput.addEventListener('change', function () {
          if (fileInput.files && fileInput.files.length) readFile(fileInput.files[0]);
        });
      }

      var btnParse = main.querySelector('#btn-parse');
      if (btnParse) btnParse.addEventListener('click', function () {
        var text = textarea ? textarea.value : '';
        if (!text.trim()) { ui.toast('请先选择文件或粘贴题库内容', 'warn'); return; }
        runParse(text, '粘贴的内容');
        ZCD.app.render();
      });

      var fillJson = main.querySelector('#btn-sample-fill');
      if (fillJson) fillJson.addEventListener('click', function () {
        if (textarea) textarea.value = sampleJson();
        ui.toast('已填入 JSON 示例，点「校验并预览」试试', 'ok');
      });
      var fillCsv = main.querySelector('#btn-sample-csv');
      if (fillCsv) fillCsv.addEventListener('click', function () {
        if (textarea) textarea.value = sampleCsv();
        ui.toast('已填入 CSV 示例，点「校验并预览」试试', 'ok');
      });

      /* --- 预览区的按钮 --- */
      var resetBtn = main.querySelector('#btn-import-reset');
      if (resetBtn) resetBtn.addEventListener('click', function () {
        importState = null;
        ZCD.app.render();
      });

      var confirmBtn = main.querySelector('#btn-import-confirm');
      if (confirmBtn) confirmBtn.addEventListener('click', function () {
        if (!importState || importState.fatal) return;
        var name = (main.querySelector('#meta-name') || {}).value || '我的知识包';
        var intro = (main.querySelector('#meta-intro') || {}).value || '由我导入的自定义题库。';
        var grade = Number((main.querySelector('#meta-grade') || {}).value) || 3;
        var subject = (main.querySelector('#meta-subject') || {}).value || 'math';
        var difficulty = Number((main.querySelector('#meta-difficulty') || {}).value) || 2;

        var packId = 'custom-' + Date.now().toString(36);
        var maxLevel = 1;
        var questions = importState.questions.map(function (q, i) {
          var level = util.clamp(Number(q.level) || 1, 1, 5);
          if (level > maxLevel) maxLevel = level;
          var text = String(q.stem || '').slice(0, 24);
          return {
            id: packId + '-q' + (i + 1),
            grade: [3, 4, 5, 6].indexOf(Number(q.grade)) >= 0 ? Number(q.grade) : grade,
            subject: V.SUBJECTS.indexOf(q.subject) >= 0 ? q.subject : subject,
            packId: packId,
            level: level,
            point: q.point || '综合练习',
            type: q.type === 'judge' ? 'judge' : 'single',
            stem: q.stem,
            options: (q.options || []).map(function (o) { return { key: o.key, text: o.text }; }),
            answer: q.answer,
            analysis: q.analysis,
            hint: q.hint || '',
            difficulty: util.clamp(Number(q.difficulty) || 2, 1, 3),
            custom: true
          };
        });

        var levelNames = [];
        for (var lv = 1; lv <= maxLevel; lv++) levelNames.push('第 ' + lv + ' 关');

        var pack = {
          id: packId,
          name: name,
          grade: grade,
          subject: subject,
          intro: intro,
          difficulty: difficulty,
          levelNames: levelNames,
          levelCount: maxLevel,
          custom: true,
          source: importState.parsed.source || 'json',
          createdAt: Date.now()
        };

        ZCD.store.addCustomPack(pack, questions);
        importState = null;
        ui.toast('导入成功：' + name + '（' + questions.length + ' 道题）', 'ok', 2800);
        ZCD.router.go('/packs', { grade: grade, subject: subject });
      });

      /* --- 自定义知识包操作 --- */
      util.on(main, '[data-map]', 'click', function (ev, el) {
        ZCD.router.go('/map', { pack: el.getAttribute('data-map') });
      });
      util.on(main, '[data-export]', 'click', function (ev, el) {
        var packId = el.getAttribute('data-export');
        var pack = ZCD.data.getPack(packId);
        if (!pack) return;
        var qs = ZCD.data.questionsOf(packId);
        var payload = {
          pack: { name: pack.name, grade: pack.grade, subject: pack.subject, intro: pack.intro, difficulty: pack.difficulty, levelNames: pack.levelNames },
          questions: qs.map(function (q) {
            return {
              id: q.id, grade: q.grade, subject: q.subject, level: q.level, point: q.point,
              type: q.type, stem: q.stem,
              options: q.options.map(function (o) { return { key: o.key, text: o.text }; }),
              answer: q.answer, analysis: q.analysis, hint: q.hint || '', difficulty: q.difficulty
            };
          })
        };
        util.download(pack.name + '.json', JSON.stringify(payload, null, 2), 'application/json');
        ui.toast('已导出 ' + pack.name, 'ok');
      });
      util.on(main, '[data-del]', 'click', function (ev, el) {
        var packId = el.getAttribute('data-del');
        var pack = ZCD.data.getPack(packId);
        if (!pack) return;
        var qCount = ZCD.data.questionsOf(packId).length;
        ui.confirm({
          title: '删除这个知识包？',
          body: '「' + util.esc(pack.name) + '」的 ' + qCount + ' 道题和它的关卡记录会被删除（错题本里的历史记录会保留）。此操作不能撤销。',
          okText: '删除',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          ZCD.store.removeCustomPack(packId);
          ui.toast('已删除', 'ok');
          ZCD.app.render();
        });
      });

      /* --- 内置题库自检 --- */
      var selfBtn = main.querySelector('#btn-selfcheck');
      if (selfBtn) selfBtn.addEventListener('click', function () {
        var box = main.querySelector('#selfcheck-result');
        var builtin = ZCD.data.builtinQuestions();
        var customQs = ZCD.store.state().custom.questions;
        var r1 = V.validateQuestions(builtin, { strictIds: true });
        var r2 = customQs.length ? V.validateQuestions(customQs, { strictIds: false }) : null;
        var html = '<div class="row">' +
          '<span class="chip ' + (r1.errors.length ? 'chip-red' : 'chip-green') + '">内置题库：' + builtin.length + ' 题，错误 ' + r1.errors.length + ' 条，提示 ' + r1.warnings.length + ' 条</span>' +
          (r2 ? '<span class="chip ' + (r2.errors.length ? 'chip-red' : 'chip-green') + '">自定义题库：' + customQs.length + ' 题，错误 ' + r2.errors.length + ' 条</span>' : '') +
        '</div>';
        var problems = r1.errors.concat(r1.warnings).slice(0, 30);
        if (r2) problems = problems.concat(r2.errors);
        html += problems.length
          ? '<div class="issues mt-12">' + problems.map(function (p) {
              return '<div class="issue ' + (p.level === 'error' ? 'is-error' : 'is-warning') + '"><span class="issue-icon">' + (p.level === 'error' ? '❌' : '⚠️') + '</span><span>' + util.esc(p.message) + '</span></div>';
            }).join('') + '</div>'
          : '<div class="notice mt-12" style="background:var(--green-soft);border-color:#c7efe1;color:#0b7a5b">✅ 全部通过：内置题库字段完整、答案都在选项中、每题都有解析。</div>';
        box.innerHTML = html;
        ui.toast('自检完成', 'ok');
      });
    }
  };

            '<li>· 所有答题记录、错题、知识点统计与学习进度都只保存在这台设备的浏览器里</li>' +
            '<li>· 不上传学生答题记录，不接入任何外部服务，也不调用在线 AI 模型</li>' +
            '<li>· 知识掌握程度由本地固定规则根据答题与复习表现计算，不使用 AI 推断</li>' +
            '<li>· 清理浏览器数据会清空进度，建议定期用下面的「导出学习数据」做备份</li>' +
          '</ul>' +
        '</div>' +

        '<div class="card">' +
          '<h2 class="card-title">⬇️ 备份与恢复</h2>' +
          '<p class="text-sm text-muted mb-12">把学习数据导出成一个 JSON 文件保存下来；换设备时可以再导入，实现手动迁移。</p>' +
          '<div class="row">' +
            '<button class="btn btn-soft" id="btn-export">导出学习数据（JSON）</button>' +
            '<button class="btn btn-soft" id="btn-import-data">导入学习数据</button>' +
            '<button class="btn btn-soft" data-go="/about">关于知闯岛</button>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<h2 class="card-title">♻️ 重置学习数据</h2>' +
          '<p class="text-sm text-muted mb-12">会清空答题记录、错题本、关卡解锁、星星与经验，以及导入的自定义题库，恢复到刚打开时的状态。内置题库不受影响。</p>' +
          '<button class="btn btn-danger" id="btn-reset">重置所有学习数据</button>' +
        '</div>' +

        '<div class="notice notice-warn mt-16">' +
          '💡 请注意：数据保存在本机浏览器（' + util.esc(info.key) + '）。<b>清理浏览器数据、更换设备或更换浏览器都会导致进度丢失</b>，建议定期用上面的「导出学习数据」做备份。' +
        '</div>';
    },

    mount: function (ctx, main) {
      var rename = main.querySelector('#btn-rename');
      if (rename) rename.addEventListener('click', function () {
        ui.prompt({ title: '修改昵称', label: '昵称', value: ZCD.store.state().profile.nickname, maxlength: 12, placeholder: '例如：小闯关者' })
          .then(function (v) {
            if (v === null) return;
            ZCD.store.setProfile({ nickname: v || '小闯关者' });
            ui.toast('昵称已更新', 'ok');
            ZCD.app.render();
          });
      });

      var chk = main.querySelector('#chk-motion');
      if (chk) chk.addEventListener('change', function () {
        ZCD.store.state().settings.reduceMotion = chk.checked;
        ZCD.store.save();
        document.body.classList.toggle('reduce-motion', chk.checked);
        ui.toast(chk.checked ? '已开启减少动画' : '已关闭减少动画', 'ok');
      });

      var exportBtn = main.querySelector('#btn-export');
      if (exportBtn) exportBtn.addEventListener('click', function () {
        util.download('知闯岛-学习数据-' + util.dayKey() + '.json', ZCD.store.exportJSON(), 'application/json');
        ui.toast('学习数据已导出', 'ok');
      });

      var importBtn = main.querySelector('#btn-import-data');
      if (importBtn) importBtn.addEventListener('click', function () {
        ui.openModal({
          title: '导入学习数据',
          body: '<p class="text-sm text-muted mb-8">把之前导出的 JSON 内容粘贴进来，会覆盖当前的答题记录、错题、进度与自定义题库。</p>' +
            '<textarea class="io" id="io-data" placeholder="粘贴学习数据 JSON……"></textarea>',
          footer: '<button class="btn btn-soft" data-modal-close>取消</button><button class="btn btn-primary" id="btn-do-import">确认导入</button>',
          onMount: function (modal) {
            var btn = modal.querySelector('#btn-do-import');
            btn.addEventListener('click', function () {
              var text = modal.querySelector('#io-data').value;
              if (!text.trim()) { ui.toast('请先粘贴内容', 'warn'); return; }
              try {
                ZCD.store.importJSON(text);
                ui.closeModal();
                ui.toast('学习数据已恢复', 'ok');
                ZCD.app.render();
              } catch (e) {
                ui.toast('导入失败：不是有效的 JSON 数据', 'bad', 3000);
              }
            });
          }
        });
      });

      var reset = main.querySelector('#btn-reset');
      if (reset) reset.addEventListener('click', function () {
        ui.confirm({
          title: '重置所有学习数据？（第 1 步 / 共 2 步）',
          body: '这会清空答题记录、错题本、关卡解锁状态、星星与经验、自定义题库。此操作无法撤销。',
          okText: '继续',
          danger: true
        }).then(function (ok1) {
          if (!ok1) return;
          return ui.confirm({
            title: '再次确认：真的要全部清除吗？（第 2 步 / 共 2 步）',
            body: '清除后无法找回，建议先「导出学习数据」做备份。确定要重置吗？',
            okText: '确认重置',
            cancelText: '我再想想',
            danger: true
          }).then(function (ok2) {
            if (!ok2) return;
            ZCD.store.resetAll();
            ZCD.session = null;
            ZCD.lastResult = null;
            importState = null;
            ui.toast('学习数据已重置', 'ok', 2600);
            ZCD.router.go('/');
          });
        });
      });
    }
  };

  /* ==================== 关于 ==================== */

  ZCD.views.about = {
    render: function () {
      var stats = ZCD.data.stats();
      return '<div class="card">' +
        '<h1 class="view-title">🏝️ 关于知闯岛</h1>' +
        '<p class="text-sm text-muted mt-8">知闯岛是一个面向小学 3—6 年级的知识闯关工作台：把知识练习变成闯关，边玩边查漏补缺。</p>' +
        '<ul class="text-sm mt-12">' +
          '<li>· 内置 ' + stats.builtinPacks + ' 个知识包 / ' + stats.builtinQuestions + ' 道题，覆盖三至六年级的数学、语文、英语、科学</li>' +
          '<li>· 每个知识包 5 个关卡，每关 5 道题，支持单选与判断</li>' +
          '<li>· 每道题都带引导提示（hint）：答错时先给思路，不直接告诉答案，需要时再点开解析</li>' +
          '<li>· 错题本自动记录题干、答案、解析、错误次数与最近答错/复习时间，可以筛选、查看和重新作答</li>' +
          '<li>· 知识点掌握程度由本地固定规则判定（≥3 次作答 + 最近 3 次都答对 + 错题都已复习），不使用 AI 推断</li>' +
          '<li>· 不联网、不调用任何外部 AI 模型、不需要 API Key、不需要服务端</li>' +
          '<li>· 学习数据保存在浏览器本地（localStorage），刷新后自动恢复，不上传答题记录</li>' +
        '</ul>' +
        '<div class="row mt-16">' +
          '<button class="btn btn-soft" data-go="/">回到学习大厅</button>' +
          '<button class="btn btn-soft" data-go="/settings">数据与设置</button>' +
        '</div>' +
      '</div>';
    }
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<!-- ========== 8. 路由与启动 ========== -->
<script>
/*!
 * 知闯岛 · 路由与页面外壳
 */
(function (root) {
  'use strict';
  root.ZCD = root.ZCD || {};
  var ZCD = root.ZCD;
  var util = ZCD.util;
  var ui = ZCD.ui;

  var ROUTES = {
    '/': 'lobby',
    '/select': 'select',
    '/packs': 'packs',
    '/map': 'map',
    '/quiz': 'quiz',
    '/result': 'result',
    '/wrong': 'wrong',
    '/report': 'report',
    '/manage': 'manage',
    '/settings': 'settings',
    '/about': 'about'
  };

  var TABS = [
    { name: 'lobby', label: '大厅', emoji: '🏠', path: '/' },
    { name: 'select', label: '闯关', emoji: '🗺️', path: '/select' },
    { name: 'wrong', label: '错题本', emoji: '📕', path: '/wrong' },
    { name: 'report', label: '报告', emoji: '📊', path: '/report' },
    { name: 'manage', label: '题库', emoji: '📥', path: '/manage' }
  ];

  var cleanups = [];
  var current = null;

  /* ---------------- 布局模式：电脑版 / 手机版 ----------------
   * 同一套代码有两种呈现方式：
   *   - 默认（不指定）：跟随窗口宽度自适应，手机和电脑都能用
   *   - 电脑版：index.html?layout=desktop 或 desktop.html，强制桌面排版
   *   - 手机版：index.html?layout=mobile 或 mobile.html，强制手机排版（电脑上会显示手机外框）
   * 打包时由 assets/js/layout-default.js 指定该包的默认版本。
   */
  function forcedLayout() {
    var m = /[?&]layout=(desktop|mobile)(?:&|$)/.exec(root.location.search || '');
    if (m) return m[1];
    if (root.ZCD_FORCE_LAYOUT === 'desktop' || root.ZCD_FORCE_LAYOUT === 'mobile') return root.ZCD_FORCE_LAYOUT;
    return null;
  }

  var forced = forcedLayout();

  function applyLayoutClass() {
    if (!forced || !root.document || !root.document.body) return;
    root.document.body.classList.add('layout-' + forced);
  }
  applyLayoutClass();

  function layoutSwitchHTML() {
    if (!forced) return '';
    var toMobile = forced !== 'mobile';
    return '<a class="layout-switch" href="' + (toMobile ? 'mobile.html' : 'desktop.html') + '" title="切换到' +
      (toMobile ? '手机版' : '电脑版') + '">' + (toMobile ? '📱 手机版' : '📺 电脑版') + '</a>';
  }

  function parseHash() {
    var h = root.location.hash.replace(/^#/, '');
    if (!h) h = '/';
    var qi = h.indexOf('?');
    var path = qi >= 0 ? h.slice(0, qi) : h;
    var qs = qi >= 0 ? h.slice(qi + 1) : '';
    var params = {};
    if (qs) {
      qs.split('&').forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf('=');
        var k = i < 0 ? kv : kv.slice(0, i);
        var v = i < 0 ? '' : kv.slice(i + 1).replace(/\+/g, ' ');
        try { params[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { params[k] = v; }
      });
    }
    if (path.length > 1 && path.charAt(path.length - 1) === '/') path = path.slice(0, -1);
    return { path: path, params: params, name: ROUTES[path] || 'notfound' };
  }

  function buildHash(path, params) {
    var qs = [];
    if (params) {
      for (var k in params) {
        if (Object.prototype.hasOwnProperty.call(params, k) && params[k] !== undefined && params[k] !== null && params[k] !== '') {
          qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
        }
      }
    }
    return '#' + path + (qs.length ? '?' + qs.join('&') : '');
  }

  var router = {
    current: function () { return current || parseHash(); },
    /** 跳转 */
    go: function (path, params, replace) {
      var hash = buildHash(path, params);
      if (replace) {
        var url = root.location.href.split('#')[0] + hash;
        root.history.replaceState(null, '', url);
        render();
      } else if (root.location.hash === hash) {
        render();
      } else {
        root.location.hash = hash;
      }
    },
    start: function () {
      root.addEventListener('hashchange', render);
      render();
    }
  };

  function runCleanups() {
    for (var i = 0; i < cleanups.length; i++) {
      try { cleanups[i](); } catch (e) {}
    }
    cleanups = [];
  }

  function onCleanup(fn) { cleanups.push(fn); }

  /* ---------------- 顶部状态栏（紧凑游戏 HUD） ---------------- */
  function topbarHTML() {
    var s = ZCD.store.state();
    var lv = ZCD.rewards.levelFromXp(s.xp);
    return '' +
      '<div class="topbar-inner">' +
        '<a class="brand" href="#/" title="回到冒险主界面">' +
          '<span class="brand-emoji">🏝️</span>' +
          '<span>知闯岛</span>' +
        '</a>' +
        '<div class="topbar-stats hud-group" id="topbar-stats">' + topbarStatsHTML() + '</div>' +
      '</div>';
  }

  function topbarStatsHTML() {
    var s = ZCD.store.state();
    var lv = ZCD.rewards.levelFromXp(s.xp);
    return '' +
      '<span class="hud-chip is-level" title="当前等级（经验值决定）">Lv.' + lv.level + ' ' + util.esc(lv.title) + '</span>' +
      '<span class="hud-chip is-star" title="累计星星（每关取历史最好成绩）">⭐ ' + ZCD.store.totalStars() + '</span>' +
      '<span class="hud-chip is-xp" title="经验值">⚡ ' + s.xp + '</span>';
  }

  function tabbarHTML(activeName) {
    var html = '<nav class="tabbar"><div class="tabbar-inner">';
    TABS.forEach(function (t) {
      var active = t.name === activeName ||
        (t.name === 'select' && ['select', 'packs', 'map', 'quiz', 'result'].indexOf(activeName) >= 0) ||
        (t.name === 'manage' && ['manage', 'settings', 'about'].indexOf(activeName) >= 0);
      html += '<button class="tab' + (active ? ' is-active' : '') + '" data-go="' + t.path + '">' +
        '<span class="tab-emoji">' + t.emoji + '</span><span>' + t.label + '</span></button>';
    });
    return html + '</div></nav>';
  }

  /**
   * 本地数据异常提示条：数据读取/升级失败时明确告知用户，
   * 强调「原始数据没有被清空」，并提供去「数据与设置」的入口。
   */
  function loadErrorBannerHTML() {
    var err = ZCD.store.loadErrorInfo && ZCD.store.loadErrorInfo();
    if (!err) return '';
    return '<div class="notice notice-danger mb-12" id="load-error-banner">' +
      '<b>⚠️ 本地学习数据异常</b><br>' + util.esc(err.message) +
      (err.backupKey ? '<br>备份键名：<code>' + util.esc(err.backupKey) + '</code>' : '') +
      '<div class="row mt-8">' +
        '<button class="btn btn-soft btn-sm" data-go="/settings">去「数据与设置」查看与恢复</button>' +
        '<button class="btn btn-soft btn-sm" id="btn-dismiss-load-error">我知道了</button>' +
      '</div>' +
    '</div>';
  }

  function render() {
    var ctx = parseHash();
    var appRoot = util.byId('app');
    if (!appRoot) return;

    // 有未保存的答题进度时，离开答题页需要确认（由答题页自己处理）
    runCleanups();
    current = ctx;
    document.body.classList.remove('is-focus');

    var view = ZCD.views[ctx.name] || ZCD.views.notfound;
    var body = '';
    try {
      body = view.render(ctx) || '';
    } catch (e) {
      if (root.console) console.error('[知闯岛] 页面渲染出错', e);
      body = '<div class="card"><h3 class="card-title">😵 页面出错了</h3><p class="text-sm text-muted">' +
        util.esc(e && e.message ? e.message : String(e)) + '</p><div class="mt-12"><button class="btn btn-primary" data-go="/">回到学习大厅</button></div></div>';
    }

    appRoot.innerHTML =
      '<header class="topbar">' + topbarHTML() + '</header>' +
      '<main class="view" id="view">' + loadErrorBannerHTML() + body + '</main>' +
      tabbarHTML(ctx.name) +
      layoutSwitchHTML();
    applyLayoutClass();

    var main = util.byId('view');
    var dismiss = util.byId('btn-dismiss-load-error');
    if (dismiss) {
      dismiss.addEventListener('click', function () {
        var banner = util.byId('load-error-banner');
        if (banner && banner.parentNode) banner.parentNode.removeChild(banner);
      });
    }

    // 全局跳转按钮
    util.on(appRoot, '[data-go]', 'click', function (ev, el) {
      var path = el.getAttribute('data-go');
      var pack = el.getAttribute('data-pack');
      var level = el.getAttribute('data-level');
      var grade = el.getAttribute('data-grade');
      var subject = el.getAttribute('data-subject');
      var params = {};
      if (pack) params.pack = pack;
      if (level) params.level = level;
      if (grade) params.grade = grade;
      if (subject) params.subject = subject;
      if (el.getAttribute('data-confirm') === 'leave-quiz' && current && current.name === 'quiz' && ZCD.session && !ZCD.session.finished) {
        ui.confirm({
          title: '要离开本关吗？',
          body: '本关还没答完，离开后本关进度不会保存（已经提交的题目记录会保留）。',
          okText: '离开',
          cancelText: '继续答题',
          danger: true
        }).then(function (ok) { if (ok) { ZCD.session = null; router.go(path, params); } });
        return;
      }
      router.go(path, params);
    });

    if (view.mount) view.mount(ctx, main);
    root.scrollTo(0, 0);
  }

  /** 数据变化后刷新顶部数字（不重绘页面） */
  function refreshChrome() {
    var el = util.byId('topbar-stats');
    if (el) el.innerHTML = topbarStatsHTML();
  }

  ZCD.router = router;
  ZCD.app = {
    render: render,
    refreshChrome: refreshChrome,
    onCleanup: onCleanup,
    TABS: TABS,
    notFound: function () { return ROUTES; }
  };

  /* 404 */
  ZCD.views = ZCD.views || {};
  ZCD.views.notfound = {
    render: function () {
      return '<div class="card">' + ui.empty('🧭', '没有找到这个页面，可能链接不对。',
        '<button class="btn btn-primary" data-go="/">回到学习大厅</button>') + '</div>';
    }
  };

  function boot() {
    // 减少动画偏好
    if (ZCD.store.state().settings.reduceMotion) document.body.classList.add('reduce-motion');
    if (!ZCD.store.persistenceAvailable()) {
      setTimeout(function () {
        ui.toast('当前浏览器无法使用本地存储，进度只保留在本次会话中', 'warn', 5200);
      }, 600);
    }
    ZCD.store.subscribe(refreshChrome);

    // 首次进入：没有任何有效的历史选择，也没有学习记录时，
    // 先让用户自己选择年级与学科，绝不默认进入某个年级（例如三年级数学）。
    // 用 location.replace 换掉初始地址：不产生后退历史，也不会触发整页刷新。
    var initial = (root.location.hash || '').replace(/^#/, '');
    if (ZCD.store.isFirstVisit() && (initial === '' || initial === '/')) {
      try {
        root.location.replace(root.location.href.split('#')[0] + '#/select');
      } catch (e) {
        root.location.hash = '/select';
      }
    }

    router.start();

    var st = ZCD.data.stats();
    if (root.console) {
      console.log('%c🏝️ 知闯岛', 'font-size:16px;font-weight:bold;color:#0f4c81');
      console.log('已加载 ' + st.builtinPacks + ' 个内置知识包 / ' + st.builtinQuestions + ' 道内置题目。');
      console.log('数据保存在本机浏览器（localStorage），不会自动跨设备同步。');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
