    if (Array.isArray(rawOptions) && rawOptions.length) {
      options = rawOptions.map(function (o, i) {
        if (typeof o === 'string') return { key: String.fromCharCode(65 + i), text: str(o) };
        return { key: str(o.key || String.fromCharCode(65 + i)).toUpperCase(), text: str(o.text) };
      });
    } else {
      ['optionA', 'optionB', 'optionC', 'optionD'].forEach(function (k, i) {
        if (str(rec[k]) !== '') options.push({ key: String.fromCharCode(65 + i), text: str(rec[k]) });
      });
    }
    if (type === 'judge' && !options.length) {
      options = [{ key: 'A', text: '正确' }, { key: 'B', text: '错误' }];
    }
    if (type === 'judge' && options.length === 2) {
      // 统一判断题的选项文案
      options = [
        { key: options[0].key || 'A', text: '正确' },
        { key: options[1].key || 'B', text: '错误' }
      ];
    }

    var answerInfo = normalizeAnswerInfo(rec.answer, type, options);
    var question = {
      id: str(rec.id),
      grade: str(rec.grade) === '' ? NaN : Number(str(rec.grade).replace(/[^0-9]/g, '')),
      subject: subject,
      packId: str(rec.packId) || '',
      level: str(rec.level) === '' ? 1 : Number(str(rec.level).replace(/[^0-9]/g, '')),
      point: str(rec.point) || '',
      type: type,
      stem: str(rec.stem),
      options: options,
      answer: answerInfo.answer,
      rawAnswer: str(rec.answer),
      _answerByPosition: answerInfo.byPosition,
      analysis: str(rec.analysis),
      hint: str(rec.hint),
      difficulty: str(rec.difficulty) === '' ? 2 : Number(str(rec.difficulty).replace(/[^0-9]/g, '')),
      _row: rec.__row || index + 1,
      _packName: str(rec.packName || rec.pack || '')
    };
    return question;
  }

  /* ---------------- 提示（hint）安全校验 ---------------- */

  function escapeRe(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  /**
   * 选项文字是否在提示里出现。
   * 短的英文/数字选项（如 is、do、6、69）按「独立词」匹配，避免 this 里的 is 被误判；
   * 中文或较长的选项按普通包含匹配。
   */
  function textAppearsInHint(hint, text) {
    if (!text) return false;
    var wordLike = /^[A-Za-z0-9]/.test(text) && /[A-Za-z0-9]$/.test(text);
    if (wordLike && text.length <= 3) {
      return new RegExp('(^|[^A-Za-z0-9])' + escapeRe(text) + '([^A-Za-z0-9]|$)', 'i').test(hint);
    }
    return hint.toLowerCase().indexOf(String(text).toLowerCase()) >= 0;
  }

  /**
   * 提示是否直接泄露答案。
   * 命中任一情况即视为泄露：包含正确选项的文字、出现「选A / 答案是B / 第2个」、提示本身就是答案字母。
   */
  function hintLeaksAnswer(hint, question) {
    var h = str(hint);
    if (!h) return false;
    var q = question || {};
    var options = Array.isArray(q.options) ? q.options : [];
    var answer = str(q.answer).toUpperCase();
    var ANSWER_POINTER_RE = /选\s*[A-DＡ-Ｄ](?![A-Za-z0-9])|答案\s*(是|为|应(该)?(选|是)?)\s*[A-DＡ-Ｄ]|选项\s*[A-DＡ-Ｄ]|第\s*[一二三四1-4]\s*个?\s*(选项|答案)/;
    if (ANSWER_POINTER_RE.test(h)) return true;
    for (var i = 0; i < options.length; i++) {
      if (str(options[i].key).toUpperCase() !== answer) continue;
      if (textAppearsInHint(h, str(options[i].text))) return true;
    }
    return false;
  }

  /* ---------------- 题库校验 ---------------- */

  function validateQuestions(questions, opts) {
    opts = opts || {};
    var errors = [];
    var warnings = [];
    var seenIds = {};
    var answerCounter = { A: 0, B: 0, C: 0, D: 0 };
    var levelCounter = {};
    var hintCount = 0;
    var hintLeakCount = 0;
    var list = Array.isArray(questions) ? questions : [];

    function err(q, field, message) {
      errors.push({ level: 'error', row: q._row, qid: q.id, field: field, message: message });
    }
    function warn(q, field, message) {
      warnings.push({ level: 'warning', row: q._row, qid: q.id, field: field, message: message });
    }

    if (!list.length) {
      errors.push({ level: 'error', field: 'questions', message: '没有解析到任何题目。' });
      return summary();
    }

    list.forEach(function (q, i) {
      var rowInfo = q._row ? '第 ' + q._row + ' 行' : '第 ' + (i + 1) + ' 题';

      // 1. 唯一 ID
      if (!str(q.id)) {
        if (opts.strictIds) err(q, 'id', rowInfo + '：缺少唯一 ID。');
        else warn(q, 'id', rowInfo + '：缺少 ID，导入时将自动生成。');
      } else if (seenIds[q.id]) {
        err(q, 'id', rowInfo + '：ID「' + q.id + '」重复（首次出现在' + seenIds[q.id] + '）。');
      } else {
        seenIds[q.id] = rowInfo;
      }

      // 2. 年级
      if (GRADES.indexOf(Number(q.grade)) === -1) {
        err(q, 'grade', rowInfo + '：年级「' + (isNaN(q.grade) ? str(q.grade) : q.grade) + '」不合法，必须是 3、4、5、6 之一。');
      }

      // 3. 学科
      if (SUBJECTS.indexOf(q.subject) === -1) {
        err(q, 'subject', rowInfo + '：学科「' + str(q.subject) + '」不合法，必须是 数学/语文/英语/科学（或 math/chinese/english/science）。');
      }

      // 4. 题型
      if (TYPES.indexOf(q.type) === -1) {
        err(q, 'type', rowInfo + '：题型「' + str(q.type) + '」不合法，只能填 单选 或 判断。');
      }

      // 5. 题目内容
      if (str(q.stem).length < 2) {
        err(q, 'stem', rowInfo + '：题目内容不能为空。');
      }

      // 6. 选项
      var needOptions = q.type === 'single' ? 4 : (q.type === 'judge' ? 2 : null);
      if (needOptions !== null) {
        if (!Array.isArray(q.options) || q.options.length !== needOptions) {
          err(q, 'options', rowInfo + '：' + (q.type === 'single' ? '单选题必须有 4 个选项' : '判断题必须有 2 个选项') +
            '，当前有 ' + ((q.options && q.options.length) || 0) + ' 个。');
        } else {
          var keys = {}, texts = {};
          q.options.forEach(function (o, oi) {
            if (!str(o.key)) err(q, 'options', rowInfo + '：第 ' + (oi + 1) + ' 个选项缺少选项字母。');
            else if (keys[o.key]) err(q, 'options', rowInfo + '：选项字母「' + o.key + '」重复。');
            keys[o.key] = true;
            if (!str(o.text)) err(q, 'options', rowInfo + '：选项 ' + o.key + ' 的内容为空。');
            else if (texts[str(o.text)]) err(q, 'options', rowInfo + '：选项 ' + o.key + ' 与选项 ' + texts[str(o.text)] + ' 的内容重复（「' + str(o.text) + '」）。');
            else texts[str(o.text)] = o.key;
          });
        }
      }

      // 7. 标准答案
      var optionKeys = (q.options || []).map(function (o) { return o.key; });
      if (!str(q.answer)) {
        err(q, 'answer', rowInfo + '：缺少标准答案。');
      } else if (optionKeys.length && optionKeys.indexOf(q.answer) === -1) {
        err(q, 'answer', rowInfo + '：标准答案「' + str(q.answer) + '」不在选项（' + optionKeys.join('/') + '）中。');
      } else if (TYPES.indexOf(q.type) !== -1 && /^[A-D]$/.test(q.answer)) {
        if (q._answerByPosition) {
          warn(q, 'answer', rowInfo + '：标准答案「' + str(q.rawAnswer) + '」不在选项内容里，已按选项序号理解为「' + q.answer + '」，建议直接填写选项字母。');
        }
        answerCounter[q.answer]++;
      }

      // 8. 解析
      if (str(q.analysis).length < 4) {
        err(q, 'analysis', rowInfo + '：缺少知识解析，请补充一句通俗易懂的说明。');
      } else if (str(q.analysis).length < 10) {
        warn(q, 'analysis', rowInfo + '：解析太短（' + str(q.analysis).length + ' 字），建议写清原因。');
      }

      // 9. 引导提示（可选字段）
      if (str(q.hint)) {
        var hintText = str(q.hint);
        hintCount++;
        if (hintText.length < 6) {
          warn(q, 'hint', rowInfo + '：引导提示太短（' + hintText.length + ' 字），建议写清从哪个角度思考。');
        } else if (hintText.length > 60) {
          warn(q, 'hint', rowInfo + '：引导提示较长（' + hintText.length + ' 字），建议控制在 45 字以内。');
        }
        if (hintLeaksAnswer(hintText, q)) {
          hintLeakCount++;
          err(q, 'hint', rowInfo + '：引导提示里出现了正确答案的内容（会直接泄露答案），请改写提示，只引导思路。');
        }
      }

      // 10. 难度
      if ([1, 2, 3].indexOf(Number(q.difficulty)) === -1) {
        warn(q, 'difficulty', rowInfo + '：难度「' + str(q.difficulty) + '」不是 1/2/3，导入时按 2 处理。');
      }

      // 11. 关卡
      var lv = Number(q.level);
      if (!(lv >= 1 && lv <= 5)) {
        warn(q, 'level', rowInfo + '：关卡号「' + str(q.level) + '」不是 1—5，导入时按 1 处理。');
      } else {
        levelCounter[lv] = (levelCounter[lv] || 0) + 1;
      }

      // 12. 知识点
      if (!str(q.point)) warn(q, 'point', rowInfo + '：缺少知识点，导入时按「综合练习」处理。');
    });

    // 跨题统计
    if (list.length >= 8) {
      var total = answerCounter.A + answerCounter.B + answerCounter.C + answerCounter.D;
      if (total >= 8) {
        ['A', 'B', 'C', 'D'].forEach(function (k) {
          if (answerCounter[k] / total > 0.7) {
            warnings.push({
              level: 'warning', field: 'answer',
              message: '标准答案分布不均：' + k + ' 占了 ' + Math.round(answerCounter[k] / total * 100) + '%，建议打乱选项顺序。'
            });
          }
        });
      }
    }
    [1, 2, 3, 4, 5].forEach(function (lv) {
      if (levelCounter[lv] && levelCounter[lv] < 5) {
        warnings.push({ level: 'warning', field: 'level', message: '第 ' + lv + ' 关只有 ' + levelCounter[lv] + ' 道题，建议每关至少 5 道。' });
      }
    });
    if (list.length < 5) {
      warnings.push({ level: 'warning', field: 'questions', message: '本知识包只有 ' + list.length + ' 道题，建议至少 5 道才有闯关体验。' });
    }

    function summary() {
      return {
        ok: errors.length === 0,
        errors: errors,
        warnings: warnings,
        total: list.length,
        hints: hintCount,
        answerDistribution: answerCounter,
        levels: levelCounter
      };
    }
    return summary();
  }

  function validatePack(pack, questions) {
    var errors = [], warnings = [];
    pack = pack || {};
    if (!str(pack.name)) errors.push({ level: 'error', field: 'name', message: '知识包名称不能为空。' });
    if (GRADES.indexOf(Number(pack.grade)) === -1) errors.push({ level: 'error', field: 'grade', message: '适用年级必须是 3、4、5、6 之一。' });
    if (SUBJECTS.indexOf(pack.subject) === -1) errors.push({ level: 'error', field: 'subject', message: '学科必须是 数学/语文/英语/科学 之一。' });
    if ([1, 2, 3].indexOf(Number(pack.difficulty)) === -1) warnings.push({ level: 'warning', field: 'difficulty', message: '难度按 2 处理（只能填 1/2/3）。' });
    if (!str(pack.intro)) warnings.push({ level: 'warning', field: 'intro', message: '建议填写知识简介，孩子会在地图上看到它。' });
    return { ok: errors.length === 0, errors: errors, warnings: warnings };
  }

  /* ---------------- JSON / CSV 解析入口 ---------------- */

  function dedupeIds(questions) {
    var seen = {};
    questions.forEach(function (q, i) {
      if (!str(q.id)) {
        q.id = 'custom-' + i + '-' + Math.random().toString(36).slice(2, 6);
        q._autoId = true;
      }
      while (seen[q.id]) {
        q.id = q.id + '-' + Math.random().toString(36).slice(2, 4);
      }
      seen[q.id] = true;
    });
    return questions;
  }

  /**
   * 解析 JSON 文本
   * 支持三种写法：题目数组 / {questions:[...]} / {pack:{...}, questions:[...]}
   */
  function fromJSON(text) {
    var data;
    try {
      data = JSON.parse(String(text || '').replace(/^\uFEFF/, ''));
    } catch (e) {
      return { fatal: 'JSON 格式错误：' + e.message + '（请检查是否有多余逗号、缺少引号或中英文标点混用。）' };
    }
    var arr = null, packMeta = null;
    if (Array.isArray(data)) {
      arr = data;
    } else if (data && typeof data === 'object') {
      arr = Array.isArray(data.questions) ? data.questions : (Array.isArray(data.items) ? data.items : null);
      packMeta = data.pack || data.packInfo || null;
      if (!packMeta) {
        packMeta = {
          name: data.packName || data.name,
          grade: data.grade,
          subject: data.subject,
          intro: data.intro || data.description,
          difficulty: data.difficulty,
          levelNames: data.levelNames
        };
      }
    }
    if (!arr) return { fatal: '没有找到题目数组。JSON 顶层应是题目数组，或包含 questions 字段的对象。' };

    var raw = arr.map(function (r, i) {
      var rec = Object.assign({}, r);
      if (Array.isArray(r.options)) {
        rec.options = r.options.map(function (o, oi) {
          if (typeof o === 'string') return { key: String.fromCharCode(65 + oi), text: o };
          return { key: o.key !== undefined ? o.key : (o.option !== undefined ? o.option : String.fromCharCode(65 + oi)), text: o.text !== undefined ? o.text : o.value };
        });
      }
      rec.__row = i + 1;
      return rec;
    });
    var questions = raw.map(function (r, i) { return normalizeRecord(r, i); });
    return { questions: questions, packMeta: packMeta, source: 'json' };
  }

  /** 解析 CSV 文本 */
  function fromCSV(text) {
    var parsed = parseCsv(text);
    if (parsed.errors && parsed.errors.length && !parsed.records.length) {
      return { fatal: parsed.errors.join(' ') };
    }
    if (!parsed.records.length) {
      return { fatal: 'CSV 中没有数据行（第一行必须是表头）。' };
    }
    var questions = parsed.records.map(function (r, i) { return normalizeRecord(r, i); });
    var firstName = questions[0] && questions[0]._packName;
    return {
      questions: questions,
      packMeta: { name: firstName || '', grade: questions[0] && questions[0].grade, subject: questions[0] && questions[0].subject },
      source: 'csv',
      headerRow: parsed.headerRow,
      unknownHeaders: parsed.unknownHeaders
    };
  }

  /** 自动识别格式 */
  function parseAny(text, filename) {
    var t = String(text || '').trim();
    var isJson = /\.json$/i.test(filename || '') || t.charAt(0) === '{' || t.charAt(0) === '[';
    var res = isJson ? fromJSON(t) : fromCSV(t);
    if (res && res.fatal && isJson) {
      // 再尝试 CSV，反之亦然
      var alt = fromCSV(t);
      if (alt && !alt.fatal && alt.questions.length) return alt;
    }
    return res;
  }

  /* ---------------- 生成示例文件 ---------------- */

  function toCsv(questions) {
    var head = ['年级', '学科', '知识包', '关卡', '知识点', '题型', '题目', '选项A', '选项B', '选项C', '选项D', '正确答案', '解析', '提示', '难度'];
    function cell(v) {
      var s = str(v);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    var lines = [head.join(',')];
    questions.forEach(function (q) {
      var opts = q.options || [];
      function opt(i) { return opts[i] ? opts[i].text : ''; }
      lines.push([
        q.grade,
        { math: '数学', chinese: '语文', english: '英语', science: '科学' }[q.subject] || q.subject,
        q._packName || '',
        q.level,
        q.point || '',
        q.type === 'judge' ? '判断' : '单选',
        q.stem,
        opt(0), opt(1), opt(2), opt(3),
        q.answer,
        q.analysis,
        q.hint || '',
        q.difficulty || 2
      ].map(cell).join(','));
    });
    return lines.join('\r\n');
  }

  function toPackJson(pack, questions) {
    return JSON.stringify({
      pack: {
        name: pack.name,
        grade: pack.grade,
        subject: pack.subject,
        intro: pack.intro,
        difficulty: pack.difficulty,
        levelNames: pack.levelNames
      },
      questions: questions.map(function (q) {
        return {
          id: q.id,
          grade: q.grade,
          subject: q.subject,
          level: q.level,
          point: q.point,
          type: q.type,
          stem: q.stem,
          options: q.options.map(function (o) { return { key: o.key, text: o.text }; }),
          answer: q.answer,
          analysis: q.analysis,
          hint: q.hint || '',
          difficulty: q.difficulty
        };
      })
    }, null, 2);
  }

  return {
    GRADES: GRADES,
    SUBJECTS: SUBJECTS,
    SUBJECT_ALIAS: SUBJECT_ALIAS,
    TYPE_ALIAS: TYPE_ALIAS,
    parseCsv: parseCsv,
    normalizeRecord: normalizeRecord,
    normalizeAnswer: normalizeAnswer,
    normalizeAnswerInfo: normalizeAnswerInfo,
    validateQuestions: validateQuestions,
    hintLeaksAnswer: hintLeaksAnswer,
    textAppearsInHint: textAppearsInHint,
    validatePack: validatePack,
    fromJSON: fromJSON,
    fromCSV: fromCSV,
    parseAny: parseAny,
    dedupeIds: dedupeIds,
    toCsv: toCsv,
    toPackJson: toPackJson
  };
});
</script>
<!-- ========== 3. 本地存储（进度 / 错题 / 星星经验 / 自定义题库） ========== -->
<script>
/*!
 * 知闯岛 · 本地存储
 * 使用浏览器 localStorage 保存：答题记录、错题本、关卡解锁状态、星星与经验、自定义题库。
 * 数据只保存在当前设备与当前浏览器，不会自动跨设备同步。
 */
(function (root) {
  'use strict';
  root.ZCD = root.ZCD || {};
  var ZCD = root.ZCD;
  var util = ZCD.util;

  var KEY = 'zhichuangdao.progress.v1';
  var MAX_ANSWERS = 600;     // 近期答题记录上限，避免无限增长
  var MAX_ACTIVITY_DAYS = 60;

  var listeners = [];
  var mem = null;            // localStorage 不可用时的内存兜底
  var availability = null;

  function now() { return Date.now(); }

  function defaultState() {
    return {
      version: 1,
      createdAt: now(),
      updatedAt: now(),
      profile: {
        nickname: '小闯关者',
        grade: null,        // 只有用户主动选择过才有值，系统不填默认值
        subject: null,
        packId: null,       // 用户最近主动进入的知识包
        chosenAt: null      // 用户主动选择的时间戳：用来区分「系统默认」和「用户选择」
      },
      xp: 0,
      totals: { answered: 0, correct: 0, reviewAnswered: 0, reviewCorrect: 0 },
      levelStats: {},       // levelId -> {attempts, cleared, bestStars, bestAccuracy, bestCorrect, total, firstClearedAt, lastAt}
      stats: { bySubject: {}, byPack: {} },
      wrong: [],            // 错题本
      answers: [],          // 近期答题记录（最新在前）
      activity: {},         // 'YYYY-MM-DD' -> {answered, correct, cleared, reviews}
      pointStats: null,     // '年级|学科|知识点' -> 知识点聚合（null 表示需要按答题记录重建）
      custom: { packs: [], questions: [] },
      lastPlayed: null,     // {packId, level, grade, subject, at}
      settings: { reduceMotion: false }
    };
  }

  /** 知识点聚合键：同一年级同一学科下同名知识点合并统计 */
  function pointKey(grade, subject, point) {
    return Number(grade) + '|' + String(subject) + '|' + String(point || '综合练习');
  }

  var lastOk = 0, lastBad = 0;

  /** 把一次作答累加到知识点聚合里 */
  function accumulatePoint(stats, grade, subject, point, correct, ts, mode) {
    var key = pointKey(grade, subject, point);
    var st = stats[key];
    if (!st) {
      st = stats[key] = {
        grade: Number(grade),
        subject: String(subject),
        point: String(point || '综合练习'),
        answered: 0,
        correct: 0,
        recent: [],        // 最近 5 次结果，1=对 0=错（旧 → 新）
        lastAt: 0,
        wrongEvents: 0,    // 历史答错次数
        reviewCount: 0,    // 复习作答次数
        reviewCorrect: 0
      };
    }
    st.answered++;
    if (correct) { st.correct++; lastOk++; } else { st.wrongEvents++; lastBad++; }
    st.recent.push(correct ? 1 : 0);
    if (st.recent.length > 5) st.recent = st.recent.slice(-5);
    if (Number(ts) > st.lastAt) st.lastAt = Number(ts) || 0;
    if (mode === 'review') {
      st.reviewCount++;
      if (correct) st.reviewCorrect++;
    }
    return st;
  }

  /** 用已有的答题记录重建知识点聚合（旧数据升级时使用，只做一次） */
  function rebuildPointStats(s) {
    var stats = {};
    var list = (s.answers || []).slice().reverse();   // 记录是「新在前」，倒过来按时间累加
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      accumulatePoint(stats, a.grade, a.subject, a.point, !!a.correct, a.ts, a.mode);
    }
    s.pointStats = stats;
    return stats;
  }

  function canUseStorage() {
    if (availability !== null) return availability;
    try {
      var k = '__zcd_probe__';
      root.localStorage.setItem(k, '1');
      root.localStorage.removeItem(k);
      availability = true;
    } catch (e) {
      availability = false;
    }
    return availability;
  }

  /** 错题记录升级：补全新增字段，保留原有内容 */
  function migrateWrong(e) {
    if (!e || typeof e !== 'object') return e;
    var ts = Number(e.ts) || now();
    var w = Object.assign({}, e);
    w.grade = Number(e.grade);
    w.subject = e.subject;
    w.packId = e.packId || '';
    w.level = Number(e.level) || 1;
    w.point = e.point || '综合练习';
    w.type = e.type || 'single';
    w.options = Array.isArray(e.options) ? e.options : [];
    w.answer = String(e.answer || '').toUpperCase();
    w.userAnswer = String(e.userAnswer || '').toUpperCase();
    w.analysis = e.analysis || '';
    w.wrongTimes = Number(e.wrongTimes) || 1;
    w.rightTimes = Number(e.rightTimes) || 0;
    w.attempts = Number(e.attempts) || (w.wrongTimes + w.rightTimes) || 1;
    w.history = Array.isArray(e.history) ? e.history : [];
    w.status = e.status === 'mastered' ? 'mastered' : 'pending';
    w.ts = ts;
    // 新增字段：旧数据按历史记录推断，推断不出就退回已有时间
    var lastWrong = null, lastReview = null;
    for (var i = 0; i < w.history.length; i++) {
      var h = w.history[i] || {};
      if (!h.correct) lastWrong = Number(h.ts) || lastWrong;
      if (h.mode === 'review') lastReview = Number(h.ts) || lastReview;
    }
    w.lastWrongAt = Number(e.lastWrongAt) || lastWrong || (w.status === 'pending' ? ts : ts);
    w.lastReviewAt = Number(e.lastReviewAt) || lastReview || null;
    w.updatedAt = Number(e.updatedAt) || w.lastReviewAt || w.lastWrongAt || ts;
    w.masteredAt = e.masteredAt || null;
    return w;
  }

  function migrate(s) {
    var d = defaultState();
    if (!s || typeof s !== 'object') return d;
    // 先原样保留所有顶层字段（兼容旧数据与将来新增字段），再补全/校正已知字段
    for (var k in s) {
      if (Object.prototype.hasOwnProperty.call(s, k)) d[k] = s[k];
    }
    d.version = 1;
    d.createdAt = Number(s.createdAt) || d.createdAt;
    d.updatedAt = Number(s.updatedAt) || d.updatedAt;
    d.profile = Object.assign({ nickname: '小闯关者', grade: null, subject: null, packId: null, chosenAt: null }, s.profile || {});
    d.xp = Number(s.xp) || 0;
    d.totals = Object.assign({ answered: 0, correct: 0, reviewAnswered: 0, reviewCorrect: 0 }, s.totals || {});
    d.levelStats = (s.levelStats && typeof s.levelStats === 'object') ? s.levelStats : {};
    d.stats = {
      bySubject: (s.stats && s.stats.bySubject) || {},
      byPack: (s.stats && s.stats.byPack) || {}
    };
    d.wrong = Array.isArray(s.wrong) ? s.wrong.map(migrateWrong) : [];
    d.answers = Array.isArray(s.answers) ? s.answers : [];
    d.activity = (s.activity && typeof s.activity === 'object') ? s.activity : {};
    d.pointStats = (s.pointStats && typeof s.pointStats === 'object') ? s.pointStats : null;
    d.custom = {
      packs: (s.custom && Array.isArray(s.custom.packs)) ? s.custom.packs : [],
      questions: (s.custom && Array.isArray(s.custom.questions)) ? s.custom.questions : []
    };
    d.lastPlayed = s.lastPlayed || null;
    d.settings = Object.assign({ reduceMotion: false }, s.settings || {});
    normalizeChoice(d);
    return d;
  }

  /**
   * 区分「系统默认值」和「用户主动选择」
   *
   * 老版本曾经把「三年级 / 数学」直接写成 profile 的默认值，因此旧数据里出现
   * 三年级数学并不代表用户选过它。规则：
   *   1. 已经有 chosenAt（本版本用户主动选过）→ 原样保留
   *   2. 有真实学习记录 → 按记录恢复选择（这是真实用过的内容）
   *   3. 没有记录、且正好是老的默认组合（3 + math）→ 清空，不算选择
   *   4. 没有记录、但不是默认组合（说明用户当年确实改过）→ 视为选择，补上时间戳
   */
  function normalizeChoice(d) {
    var p = d.profile;
    if (!p) return d;
    if (p.chosenAt) {
      p.grade = p.grade ? Number(p.grade) : null;
      return d;
    }
    var hasRecord = !!d.lastPlayed ||
      Number(d.totals && d.totals.answered) > 0 ||
      (d.answers && d.answers.length > 0) ||
      (d.wrong && d.wrong.length > 0) ||
      Object.keys(d.levelStats || {}).length > 0;
    var legacyDefault = Number(p.grade) === 3 && p.subject === 'math';

    if (hasRecord) {
      var lp = d.lastPlayed || {};
      if (lp.grade) p.grade = Number(lp.grade);
      if (lp.subject) p.subject = lp.subject;
      if (lp.packId) p.packId = lp.packId;
      p.chosenAt = Number(lp.at) || Number(d.updatedAt) || now();
    } else if (!legacyDefault && p.grade && p.subject) {
      p.chosenAt = Number(d.updatedAt) || now();
    } else {
      p.grade = null;
      p.subject = null;
      p.packId = null;
    }
    return d;
  }

  var state = null;
  var loadError = null;

  function load() {
    if (state) return state;
    if (!canUseStorage()) {
      state = mem || defaultState();
      return state;
    }
    var raw = null;
    try { raw = root.localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) {
      state = defaultState();
      return state;
    }
    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      // 解析失败：绝不删除原始数据，先备份，再以空白进度启动，并把错误交给界面提示
      var backupKey = KEY + '.broken.' + now();
      var backed = false;
      try { root.localStorage.setItem(backupKey, raw); backed = true; } catch (e2) { backed = false; }
      loadError = {
        kind: 'parse',
        backupKey: backed ? backupKey : null,
        message: '本地学习数据读取失败（数据格式异常）。原始数据已' +
          (backed ? '完整备份到备份键 ' + backupKey : '保留在原位置，未被覆盖') +
          '，本次以空白进度继续，不会清空原始数据。'
      };
      if (root.console) console.warn('[知闯岛] 本地数据解析失败，已备份原始数据。', e);
      state = defaultState();
      return state;
    }
    try {
      state = migrate(parsed);
    } catch (e) {
      loadError = {
        kind: 'migrate',
        backupKey: null,
        message: '本地学习数据升级失败：' + (e && e.message ? e.message : String(e)) +
          '。原始数据保留在原位置，本次以空白进度继续。'
      };
      if (root.console) console.warn('[知闯岛] 本地数据升级失败。', e);
      state = defaultState();
      return state;
    }
    if (!state.pointStats) rebuildPointStats(state);
    return state;
  }

  function persist() {
    var s = load();
    s.updatedAt = now();
    if (!canUseStorage()) {
      mem = s;
      return false;
    }
    try {
      root.localStorage.setItem(KEY, JSON.stringify(s));
      return true;
    } catch (e) {
      if (root.console) console.warn('[知闯岛] 保存失败（可能是存储空间已满或被隐私模式限制）', e);
      return false;
    }
  }

  function commit() {
    persist();
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](state); } catch (e) { /* 单个订阅者出错不影响其它 */ }
    }
  }

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  /* ---------------- 关卡与解锁 ---------------- */

  function lid(packId, level) {
    return packId + '-l' + level;
  }

  function levelStat(packId, level) {
    return load().levelStats[lid(packId, level)] || null;
  }

  function isLevelCleared(packId, level) {
    var st = levelStat(packId, level);
    return !!(st && st.cleared);
  }

  /** 规则：第 1 关默认开放；完成第 n 关后才解锁第 n+1 关。已通关的关卡可重复挑战。 */
  function isLevelUnlocked(packId, level) {
    if (Number(level) <= 1) return true;
    return isLevelCleared(packId, Number(level) - 1);
  }

  function maxUnlockedLevel(packId) {
    var lv = 1;
    while (isLevelCleared(packId, lv)) lv++;
    return lv; // 第一个未通关的关卡；若全部通关则等于 关卡数+1
  }

  /** 知识包进度：已完成关卡 / 总关卡 / 星星 / 完成度 */
  function packProgress(packId) {
    var count = 5;
    if (ZCD.data && ZCD.data.levelList) count = ZCD.data.levelList(packId).length || 5;
    var cleared = 0, stars = 0, attempts = 0, lastAt = 0, best = 0;
    for (var i = 1; i <= count; i++) {
      var st = levelStat(packId, i);
      if (st) {
        attempts += st.attempts || 0;
        if (st.cleared) cleared++;
        stars += st.bestStars || 0;
        if ((st.lastAt || 0) > lastAt) lastAt = st.lastAt;
        if ((st.bestAccuracy || 0) > best) best = st.bestAccuracy;
      }
    }
    return {
      packId: packId,
      levels: count,
      cleared: cleared,
      stars: stars,
      maxStars: count * 3,
      percent: util.pct(cleared, count),
      attempts: attempts,
      lastAt: lastAt,
      bestAccuracy: best,
      finished: cleared >= count && count > 0
    };
  }

  /* ---------------- 答题记录 ---------------- */

  function bumpActivity(field, n) {
    var s = load();
    var k = util.dayKey();
    var d = s.activity[k] || { answered: 0, correct: 0, cleared: 0, reviews: 0 };
    d[field] = (d[field] || 0) + (n === undefined ? 1 : n);
    s.activity[k] = d;
    // 只保留最近 60 天
    var keys = Object.keys(s.activity).sort();
    if (keys.length > MAX_ACTIVITY_DAYS) {
      for (var i = 0; i < keys.length - MAX_ACTIVITY_DAYS; i++) delete s.activity[keys[i]];
    }
  }

  function bump(s, path, correct) {
    var key = path;
    if (!s.stats.bySubject[key]) s.stats.bySubject[key] = { answered: 0, correct: 0 };
    s.stats.bySubject[key].answered++;
    if (correct) s.stats.bySubject[key].correct++;
  }

  function bumpPack(s, packId, correct) {
    if (!s.stats.byPack[packId]) s.stats.byPack[packId] = { answered: 0, correct: 0 };
    s.stats.byPack[packId].answered++;
    if (correct) s.stats.byPack[packId].correct++;
  }

  /**
   * 记录一次作答（关卡答题或错题复习）
   * @returns {{correct:boolean, entry:Object|null}}
   */
  function recordAnswer(opts) {
    var s = load();
    var q = opts.question;
    var chosen = String(opts.chosen || '').toUpperCase();
    var answer = String(q.answer || '').toUpperCase();
    var correct = chosen === answer;
    var mode = opts.mode === 'review' ? 'review' : 'level';
    var ts = now();

    s.totals.answered++;
    if (correct) s.totals.correct++;
    if (mode === 'review') {
      s.totals.reviewAnswered++;
      if (correct) s.totals.reviewCorrect++;
    }
    bump(s, Number(q.grade) + '|' + q.subject, correct);
    if (q.packId) bumpPack(s, q.packId, correct);
    if (!s.pointStats) rebuildPointStats(s);
    accumulatePoint(s.pointStats, q.grade, q.subject, q.point, correct, ts, mode);
    bumpActivity('answered');
    if (correct) bumpActivity('correct');
    if (mode === 'review') bumpActivity('reviews');

    s.answers.unshift({
      qid: q.id,
      packId: q.packId,
      levelId: q.packId ? lid(q.packId, q.level) : null,
      level: q.level,
      grade: Number(q.grade),
      subject: q.subject,
      point: q.point,
      stem: q.stem.length > 60 ? q.stem.slice(0, 60) + '…' : q.stem,
      chosen: chosen,
      answer: answer,
      correct: correct,
      mode: mode,
      ts: ts
    });
    if (s.answers.length > MAX_ANSWERS) s.answers.length = MAX_ANSWERS;

    var entry = updateWrongBook(s, q, chosen, correct, mode, ts);
    commit();
    return { correct: correct, entry: entry };
  }

  /** 错题本：答错记入并保留历史；重新答对后标记为已掌握，但历史错误记录不删除 */
  function updateWrongBook(s, q, chosen, correct, mode, ts) {
    var idx = -1;
    for (var i = 0; i < s.wrong.length; i++) {
      if (s.wrong[i].qid === q.id) { idx = i; break; }
    }
    if (idx === -1) {
      if (correct) return null;   // 第一次就答对，不进错题本
      var entry = {
        qid: q.id,
        grade: Number(q.grade),
        subject: q.subject,
        packId: q.packId,
        levelId: q.packId ? lid(q.packId, q.level) : null,
        level: q.level,
        point: q.point,
        type: q.type,
        stem: q.stem,
        options: q.options || [],
        answer: String(q.answer).toUpperCase(),
        analysis: q.analysis,
        hint: q.hint || '',
        userAnswer: chosen,
        ts: ts,
        updatedAt: ts,
        lastWrongAt: ts,       // 最近一次答错时间
        lastReviewAt: mode === 'review' ? ts : null,   // 最近一次复习时间（在复习里答错也算复习过）
        status: 'pending',
        attempts: 1,
        wrongTimes: 1,
        rightTimes: 0,
        history: [{ ts: ts, chosen: chosen, correct: false, mode: mode }],
        masteredAt: null
      };
      s.wrong.unshift(entry);
      return entry;
    }

    var e = s.wrong[idx];
    e.updatedAt = ts;
    e.attempts = (e.attempts || 0) + 1;
    e.history.push({ ts: ts, chosen: chosen, correct: correct, mode: mode });
    if (e.history.length > 30) e.history = e.history.slice(-30);
    if (!correct) e.lastWrongAt = ts;              // 再次答错：更新错误次数与最近答错时间
    if (mode === 'review') e.lastReviewAt = ts;    // 复习作答：更新最近复习时间
    if (correct) {
      e.rightTimes = (e.rightTimes || 0) + 1;
      e.status = 'mastered';
      e.masteredAt = ts;
      e.userAnswer = chosen;
    } else {
      e.wrongTimes = (e.wrongTimes || 0) + 1;
      e.status = 'pending';
      e.masteredAt = null;
      e.userAnswer = chosen;
    }
    return e;
  }

  /* ---------------- 结算 ---------------- */

  /**
   * 结算一个关卡。奖励不会重复累计：星级取历史最好成绩，
   * 首次通关奖励只发一次，重复挑战只按本次答对题数给经验。
   */
  function finishLevel(opts) {
    var s = load();
    var packId = opts.packId;
    var level = Number(opts.level);
    var id = lid(packId, level);
    var prev = s.levelStats[id] || null;
    var r = ZCD.rewards.settleLevel({
      correct: opts.correct,
      total: opts.total,
      prev: prev
    });

    var st = prev || {
      packId: packId, level: level, attempts: 0, cleared: false,
      bestStars: 0, bestAccuracy: 0, bestCorrect: 0, total: opts.total,
      firstClearedAt: null, lastAt: 0
    };
    st.attempts++;
    st.total = opts.total;
    st.lastAt = now();
    st.bestAccuracy = Math.max(st.bestAccuracy || 0, r.accuracy);
    st.bestCorrect = Math.max(st.bestCorrect || 0, r.correct);
    if (r.passed) {
      if (!st.cleared) {
        st.cleared = true;
        st.firstClearedAt = st.lastAt;
        bumpActivity('cleared');
      }
      st.bestStars = Math.max(st.bestStars || 0, r.stars);
    }
    s.levelStats[id] = st;
    s.xp += r.xpTotal;
    commit();

    r.levelId = id;
    r.packId = packId;
    r.level = level;
    r.totalXp = s.xp;
    r.levelInfo = ZCD.rewards.levelFromXp(s.xp);
    r.unlockedNext = ZCD.store.isLevelUnlocked(packId, level + 1);
    return r;
  }

  /** 结算一次错题复习：不发星星，只按答对题数给少量复习经验 */
  function finishReview(opts) {
    var s = load();
    var correct = Number(opts.correct) || 0;
    var total = Number(opts.total) || 0;
    var xp = correct * 1;
    s.xp += xp;
    commit();
    return {
      mode: 'review',
      correct: correct,
      total: total,
      accuracy: util.pct(correct, total),
      xpTotal: xp,
      totalXp: s.xp,
      levelInfo: ZCD.rewards.levelFromXp(s.xp)
    };
  }

  /* ---------------- 统计 ---------------- */

  function totalStars() {
    var s = load(), sum = 0;
    for (var k in s.levelStats) {
      if (Object.prototype.hasOwnProperty.call(s.levelStats, k)) sum += s.levelStats[k].bestStars || 0;
    }
    return sum;
  }

  function clearedLevelCount() {
    var s = load(), n = 0;
    for (var k in s.levelStats) {
      if (Object.prototype.hasOwnProperty.call(s.levelStats, k) && s.levelStats[k].cleared) n++;
    }
    return n;
  }

  function finishedPackCount() {
    var packs = ZCD.data.allPacks(), n = 0;
    for (var i = 0; i < packs.length; i++) {
      if (packProgress(packs[i].id).finished) n++;
    }
    return n;
  }

  function activityToday() {
    var s = load();
    return s.activity[util.dayKey()] || { answered: 0, correct: 0, cleared: 0, reviews: 0 };
  }

  /** 徽章与成就所需的真实指标 */
  function achievementMetrics() {
    var s = load();
    var perfect = 0, clearedLevels = 0;
    var subjects = {};
    for (var k in s.levelStats) {
      if (!Object.prototype.hasOwnProperty.call(s.levelStats, k)) continue;
      var st = s.levelStats[k];
      if (st.bestStars >= 3) perfect++;
      if (st.cleared) {
        clearedLevels++;
        var pid = st.packId || k.replace(/-l\d+$/, '');
        var pack = ZCD.data ? ZCD.data.getPack(pid) : null;
        if (pack) subjects[pack.subject] = true;
      }
    }
    var w = wrongStats();
    return {
      answered: s.totals.answered,
      correct: s.totals.correct,
      accuracy: util.pct(s.totals.correct, s.totals.answered),
      reviewCorrect: s.totals.reviewCorrect,
      clearedLevels: clearedLevels,
      perfectLevels: perfect,
      stars: totalStars(),
      xp: s.xp,
      finishedPacks: ZCD.data ? finishedPackCount() : 0,
      days: Object.keys(s.activity).length,
      wrongTotal: w.total,
      wrongPending: w.pending,
      subjectsCleared: Object.keys(subjects).length
    };
  }

  function badges() {
    return ZCD.rewards.badgeList(achievementMetrics());
  }

  function earnedBadgeIds() {
    return badges().filter(function (b) { return b.earned; }).map(function (b) { return b.id; });
  }

  /** 最近一次学习动作（用于「继续闯关」） */
  function recentLevelRecords(n) {
    var s = load();
    var list = [];
    for (var k in s.levelStats) {
      if (Object.prototype.hasOwnProperty.call(s.levelStats, k)) {
        var st = s.levelStats[k];
        list.push(st);
      }
    }
    list.sort(function (a, b) { return (b.lastAt || 0) - (a.lastAt || 0); });
    return list.slice(0, n || 5);
  }

  function recentAnswers(n) {
    return load().answers.slice(0, n || 10);
  }

  /* ---------------- 自定义题库 ---------------- */

  function addCustomPack(pack, questions) {
    var s = load();
    s.custom.packs.push(pack);
    for (var i = 0; i < questions.length; i++) s.custom.questions.push(questions[i]);
    commit();
    return pack;
  }

  function removeCustomPack(packId) {
    var s = load();
    s.custom.packs = s.custom.packs.filter(function (p) { return p.id !== packId; });
    s.custom.questions = s.custom.questions.filter(function (q) { return q.packId !== packId; });
    // 同步清理该知识包的关卡统计（错题本保留历史记录）
    for (var k in s.levelStats) {
      if (Object.prototype.hasOwnProperty.call(s.levelStats, k) && k.indexOf(packId + '-l') === 0) {
        delete s.levelStats[k];
      }
    }
    delete s.stats.byPack[packId];
    commit();
  }

  /* ---------------- 错题本 ---------------- */

  function wrongList(filter) {
    var s = load();
    filter = filter || {};
    return s.wrong.filter(function (e) {
      if (filter.subject && e.subject !== filter.subject) return false;
      if (filter.grade && Number(e.grade) !== Number(filter.grade)) return false;
      if (filter.status && e.status !== filter.status) return false;
      if (filter.packId && e.packId !== filter.packId) return false;
      return true;
    }).sort(function (a, b) { return (b.updatedAt || b.ts) - (a.updatedAt || a.ts); });
  }

  function wrongStats() {
    var list = wrongList();
    var pending = 0, mastered = 0, subjects = {};
    for (var i = 0; i < list.length; i++) {
      if (list[i].status === 'mastered') mastered++; else pending++;
      subjects[list[i].subject] = (subjects[list[i].subject] || 0) + 1;
    }
    return { total: list.length, pending: pending, mastered: mastered, subjects: subjects };
  }

  /** 错题本里出现过的知识包，用于「按知识包筛选」 */
  function wrongPackOptions() {
    var map = {};
    var list = load().wrong;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.packId) continue;
      if (!map[e.packId]) {
        var pack = ZCD.data ? ZCD.data.getPack(e.packId) : null;
        map[e.packId] = { packId: e.packId, name: pack ? pack.name : e.packId, count: 0 };
      }
      map[e.packId].count++;
    }
    var out = [];
    for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) out.push(map[k]);

  function clearWrong() {

    s.wrong = [];
    commit();

  function setLastPlayed(info) {

<!-- ========== 4. 题型注册表（内置题库通过 ZCD.registerPack 注册） ========== -->
<script>
/*!
 * 知闯岛 · 题库注册表
 * 内置题库文件通过 ZCD.registerPack({pack, questions}) 注册；
 * 自定义（导入）题库保存在本地存储中，由 ZCD.data 统一合并供页面读取。
 */
(function (root) {
  'use strict';
  root.ZCD = root.ZCD || {};
  var ZCD = root.ZCD;
  var util = ZCD.util;

  /** 支持的年级与学科 */
  var GRADES = [
    { grade: 3, label: '三年级', desc: '打好基础，认识更大的数字与短篇阅读', emoji: '🌱' },
    { grade: 4, label: '四年级', desc: '乘除升级，学会观察与推理', emoji: '🌿' },
    { grade: 5, label: '五年级', desc: '小数方程与图形面积，逻辑进阶', emoji: '🌳' },
    { grade: 6, label: '六年级', desc: '分数比例与综合应用，冲刺毕业', emoji: '🏔️' }
  ];

  var SUBJECTS = [
    { key: 'math', name: '数学', emoji: '🧮', color: '#2f6df6', soft: '#e8f0ff' },
    { key: 'chinese', name: '语文', emoji: '📖', color: '#e0553f', soft: '#ffeeea' },
    { key: 'english', name: '英语', emoji: '🔤', color: '#12a37a', soft: '#e5f8f2' },
    { key: 'science', name: '科学', emoji: '🔬', color: '#8b5cf6', soft: '#f2ecff' }
  ];

  var registry = { packs: [], questions: [], questionIndex: {}, raw: [] };
  var order = 0;

  function subjectMeta(key) {
    for (var i = 0; i < SUBJECTS.length; i++) if (SUBJECTS[i].key === key) return SUBJECTS[i];
    return { key: key || 'other', name: key || '其他', emoji: '📦', color: '#64748b', soft: '#eef2f7' };
  }

  function gradeLabel(g) {
    for (var i = 0; i < GRADES.length; i++) if (GRADES[i].grade === Number(g)) return GRADES[i].label;
    return (g || '?') + ' 年级';
  }

  /** 由 pack 与关卡序号生成稳定的关卡 ID */
  function levelId(packId, level) {
    return packId + '-l' + level;
  }

  /* ---------------- 选项位置平衡（固定规则，非随机） ----------------
   * 内置题库里正确选项容易集中在 C/D 位。这里对每个知识包做一次「固定」的选项循环移位，
   * 让 A/B/C/D 四个位置上的正确答案数量尽量均衡，避免孩子靠猜位置得分。
   * 选项对象整体移动（选项字母跟着内容走），题目含义与判分结果完全不变；
   * 只要题干或选项里出现「以上/都不/其余/选项A」这类依赖位置的说法就跳过。
   * 用户自己导入的题库不做任何改动，保持与文件完全一致。
   */
  function hasOrderRef(text) {
    return /以上|上述|都不|都对|其余|其他选项|选项\s*[A-D]|[A-D]\s*[、和与]/.test(text);
  }

  function balanceSingleOptions(q) {
    if (q.type !== 'single' || q.options.length !== 4) return false;
    if (q.options.map(function (o) { return o.key; }).join('') !== 'ABCD') return false;
    var allText = q.stem + ' ' + q.options.map(function (o) { return o.text; }).join(' ');
    if (hasOrderRef(allText)) return false;
    return true;
  }

  /** 按字母顺序贪婪分配正确选项位置，保证一个知识包内 A/B/C/D 数量基本相等 */
  function balancePackQuestions(list) {
    var LETTERS = 'ABCD';
    var counts = { A: 0, B: 0, C: 0, D: 0 };
    for (var n = 0; n < list.length; n++) {
      var q = list[n];
      if (!balanceSingleOptions(q)) continue;
      var ai = -1;
      for (var i = 0; i < 4; i++) if (q.options[i].key === q.answer) ai = i;
      if (ai < 0) continue;
      var target = 0;
      for (var j = 1; j < 4; j++) {
        if (counts[LETTERS.charAt(j)] < counts[LETTERS.charAt(target)]) target = j;
      }
      var k = (ai - target + 4) % 4;
      if (k !== 0) {
        var moved = q.options.slice(k).concat(q.options.slice(0, k));
        q.options = moved.map(function (o, idx) { return { key: LETTERS.charAt(idx), text: o.text }; });
        q.answer = LETTERS.charAt(target);
      }
      counts[LETTERS.charAt(target)]++;
    }
  }

  function normQuestion(q, pack) {
    var out = {
      id: String(q.id || '').trim(),
      grade: Number(q.grade || (pack && pack.grade)),
      subject: q.subject || (pack && pack.subject),
      packId: q.packId || (pack && pack.id),
      level: Number(q.level) || 1,
      point: q.point || '综合练习',
      type: q.type || 'single',
      stem: q.stem || '',
      options: Array.isArray(q.options) ? q.options.map(function (o) {
        return { key: String(o.key || '').toUpperCase(), text: String(o.text === undefined ? '' : o.text) };
      }) : [],
      answer: String(q.answer || '').toUpperCase(),
      analysis: q.analysis || '',
      hint: q.hint ? String(q.hint).trim() : '',
      difficulty: Number(q.difficulty) || 1,
      _order: order++,
      custom: !!(pack && pack.custom)
    };
    return out;
  }

  /** 内置题库注册入口 */
  function registerPack(entry) {
    if (!entry || !entry.pack || !Array.isArray(entry.questions)) {
      if (root.console) console.warn('[知闯岛] registerPack 参数不合法，已忽略：', entry);
      return;
    }
    var pack = entry.pack;
    pack.custom = false;
    pack.levelNames = Array.isArray(pack.levelNames) ? pack.levelNames.slice() : [];
    pack.difficulty = Number(pack.difficulty) || 1;
    pack.grade = Number(pack.grade);
    registry.packs.push(pack);
    registry.raw.push({ pack: pack, questions: entry.questions });
    var list = [];
    for (var i = 0; i < entry.questions.length; i++) {
      var q = normQuestion(entry.questions[i], pack);
      list.push(q);
      registry.questions.push(q);
      if (q.id) registry.questionIndex[q.id] = q;
    }
    balancePackQuestions(list);
  }

  /* ---------------- 合并内置 + 自定义题库 ---------------- */

  function customPacks() {
    return (ZCD.store && ZCD.store.state().custom.packs) || [];
  }
  function customQuestions() {
    return (ZCD.store && ZCD.store.state().custom.questions) || [];
  }

  /** 全部知识包（内置 + 导入） */
  function allPacks() {
    return registry.packs.concat(customPacks());
  }

  function getPack(packId) {
    var all = allPacks();
    for (var i = 0; i < all.length; i++) if (all[i].id === packId) return all[i];
    return null;
  }

  /** 某年级 + 学科下的知识包 */
  function packsFor(grade, subject) {
    return allPacks().filter(function (p) {
      return Number(p.grade) === Number(grade) && p.subject === subject;
    });
  }

  function allQuestions() {
    return registry.questions.concat(customQuestions());
  }

  function questionsOf(packId) {
    return allQuestions().filter(function (q) { return q.packId === packId; });
  }

  function levelsOf(pack) {
    if (!pack) return 0;
    var list = questionsOf(pack.id);
    var max = 0;
    for (var i = 0; i < list.length; i++) if (list[i].level > max) max = list[i].level;
    if (pack.levelCount) max = Math.max(max, Number(pack.levelCount) || 0);
    return max || 5;
  }

  function levelQuestions(packId, level) {
    return questionsOf(packId).filter(function (q) { return Number(q.level) === Number(level); });
  }

  function levelName(pack, level) {
    if (pack && pack.levelNames && pack.levelNames[level - 1]) return pack.levelNames[level - 1];
    return '第 ' + level + ' 关';
  }

  function questionById(id) {
    if (!id) return null;
    if (registry.questionIndex[id]) return registry.questionIndex[id];
    var cq = customQuestions();
    for (var i = 0; i < cq.length; i++) if (cq[i].id === id) return cq[i];
    return null;
  }

  /** 该知识包的知识点清单 */
  function pointsOf(packId, level) {
    var list = level ? levelQuestions(packId, level) : questionsOf(packId);
    return util.uniq(list.map(function (q) { return q.point; }));
  }

  /** 一个知识包全部关卡的清单（含解锁状态判断所需的最小信息） */
  function levelList(packId) {
    var pack = getPack(packId);
    var n = levelsOf(pack);
    var out = [];
    for (var i = 1; i <= n; i++) {
      out.push({
        packId: packId,
        level: i,
        id: levelId(packId, i),
        name: levelName(pack, i),
        count: levelQuestions(packId, i).length
      });
    }
    return out;
  }

  /** 统计用：所有「年级 × 学科」组合 */
  function gradeSubjectMatrix() {
    var out = [];
    for (var g = 0; g < GRADES.length; g++) {
      for (var s = 0; s < SUBJECTS.length; s++) {
        var packs = packsFor(GRADES[g].grade, SUBJECTS[s].key);
        if (packs.length) {
          out.push({ grade: GRADES[g].grade, gradeLabel: GRADES[g].label, subject: SUBJECTS[s], packs: packs });
        }
      }
    }
    return out;
  }

  ZCD.GRADES = GRADES;
  ZCD.SUBJECTS = SUBJECTS;
  ZCD.subjectMeta = subjectMeta;
  ZCD.gradeLabel = gradeLabel;
  ZCD.registerPack = registerPack;

  ZCD.data = {
    levelId: levelId,
    allPacks: allPacks,
    builtinPacks: function () { return registry.packs.slice(); },
    builtinQuestions: function () { return registry.questions.slice(); },
    getPack: getPack,
    packsFor: packsFor,
    allQuestions: allQuestions,
    questionsOf: questionsOf,
    levelsOf: levelsOf,
    levelQuestions: levelQuestions,
    levelName: levelName,
    levelList: levelList,
    questionById: questionById,
    pointsOf: pointsOf,
    gradeSubjectMatrix: gradeSubjectMatrix,
    stats: function () {
      return {
        packs: allPacks().length,
        builtinPacks: registry.packs.length,
        questions: allQuestions().length,
        builtinQuestions: registry.questions.length
      };
    }
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<!-- ========== 5. 奖励规则与等级 ========== -->
<script>
/*!
 * 知闯岛 · 级别、星星、经验与奖励规则
 * 所有数值均为固定程序规则，不依赖任何外部 AI 或接口。
 */
(function (root) {
  'use strict';
  root.ZCD = root.ZCD || {};
  var ZCD = root.ZCD;
  var util = ZCD.util;

  /** 关卡星级门槛 */
  var RULES = {
    THREE_STAR: 90,   // 正确率 >= 90% → 3 星
    TWO_STAR: 70,     // 正确率 >= 70% → 2 星
    ONE_STAR: 0,      // 正确率 < 70%  → 1 星
    PASS: 60,         // 正确率 >= 60% 才通关
    FIRST_BONUS: 20,  // 首次通关基础经验
    XP_PER_QUESTION: 4,
    XP_PER_STAR: 10,
    XP_REPLAY_PER_QUESTION: 1,
    STAR_UPGRADE_XP: 10
  };

  /** 等级表：经验 → 等级称号 */
  var LEVELS = [
    { xp: 0, title: '初登小岛' },
    { xp: 100, title: '沙滩新手' },
    { xp: 260, title: '丛林探险家' },
    { xp: 480, title: '山谷旅人' },
    { xp: 760, title: '湖泊向导' },
    { xp: 1100, title: '高原骑士' },
    { xp: 1500, title: '沙漠商人' },
    { xp: 1960, title: '雪山学者' },
    { xp: 2500, title: '火山勇者' },
    { xp: 3120, title: '知闯岛主' }
  ];

  /** 根据经验值计算等级信息 */
  function levelFromXp(xp) {
    xp = Math.max(0, Number(xp) || 0);
    var idx = 0;
    for (var i = 0; i < LEVELS.length; i++) {
      if (xp >= LEVELS[i].xp) idx = i;
    }
    var cur = LEVELS[idx];
    var next = LEVELS[idx + 1] || null;
    var span = next ? next.xp - cur.xp : 0;
    var done = next ? xp - cur.xp : 0;
    return {
      level: idx + 1,
      title: cur.title,
      xp: xp,
      nextXp: next ? next.xp : null,
      toNext: next ? Math.max(0, next.xp - xp) : 0,
      progress: next ? util.pct(done, span) : 100,
      isMax: !next
    };
  }

  /** 正确率 → 星级 */
  function starsFor(accuracy) {
    if (accuracy >= RULES.THREE_STAR) return 3;
    if (accuracy >= RULES.TWO_STAR) return 2;
    return 1;
  }

  function isPass(accuracy) {
    return accuracy >= RULES.PASS;
  }

  /**
   * 结算一关。严格防止重复累计：
   *  - 星级只记录「历史最好成绩」，累计星星 = 每关最好星级之和，重复挑战不会叠加。
   *  - 首次通关奖励（基础经验 + 星级加成）在 cleared 之后永远不会再次发放。
   *  - 重复挑战只按本次答对题数给少量经验。
   *  - 刷新最好星级时，只补发「星级提升差额 × STAR_UPGRADE_XP」。
   */
  function settleLevel(opts) {
    var correct = Math.max(0, Number(opts.correct) || 0);
    var total = Math.max(1, Number(opts.total) || 0);
    var prev = opts.prev || null;
    var prevCleared = !!(prev && prev.cleared);
    var prevBestStars = prevCleared ? (prev.bestStars || 0) : 0;

    var accuracy = util.pct(correct, total);
    var stars = starsFor(accuracy);
    var passed = isPass(accuracy);

    var firstClear = passed && !prevCleared;
    var upgrade = (passed && prevCleared && stars > prevBestStars) ? (stars - prevBestStars) : 0;

    var xpPerQuestion = firstClear ? RULES.XP_PER_QUESTION : RULES.XP_REPLAY_PER_QUESTION;
    var xpQuestions = correct * xpPerQuestion;
    var xpFirstBonus = 0;
    var xpStarBonus = 0;

    if (firstClear) {
      xpFirstBonus = RULES.FIRST_BONUS;
      xpStarBonus = stars * RULES.XP_PER_STAR;
    } else if (upgrade > 0) {
      xpStarBonus = upgrade * RULES.STAR_UPGRADE_XP;
    }

    // 未通关时不计星星，也不给任何通关奖励
    var awardedStars = passed ? stars : 0;
    var newBestStars = passed ? Math.max(prevBestStars, stars) : prevBestStars;
    var deltaStars = passed ? Math.max(0, stars - prevBestStars) : 0;

    var xpTotal = xpQuestions + xpFirstBonus + xpStarBonus;

    return {
      correct: correct,
      total: total,
      accuracy: accuracy,
      stars: stars,
      awardedStars: awardedStars,
      passed: passed,
      firstClear: firstClear,
      upgrade: upgrade,
      xpQuestions: xpQuestions,
      xpFirstBonus: xpFirstBonus,
      xpStarBonus: xpStarBonus,
      xpTotal: xpTotal,
      deltaStars: deltaStars,
      newBestStars: newBestStars,
      prevBestStars: prevBestStars,
      isReplay: prevCleared
    };
  }

  /**
   * 徽章：全部由真实学习数据计算，不做任何虚假统计。
   * @param {Object} m 指标对象（见 store.achievementMetrics）
   */
  function badgeList(m) {
    m = m || {};
    var list = [
      { id: 'first-clear', name: '初次登岛', emoji: '🏝️', desc: '完成第 1 个关卡', earned: (m.clearedLevels || 0) >= 1 },
      { id: 'perfect-5', name: '满星收集者', emoji: '🌟', desc: '有 5 个关卡拿到 3 星', earned: (m.perfectLevels || 0) >= 5 },
      { id: 'answer-100', name: '百题勇士', emoji: '💯', desc: '累计答对 100 道题', earned: (m.correct || 0) >= 100 },

<!-- ========== 5b. 轻量知识掌握评估（固定规则，非 AI 推断） ========== -->
<script>
/*!
 * 知闯岛 · 轻量知识掌握评估（固定规则，不使用任何 AI 推断）
 *
 * 判定完全来自真实答题记录与错题复习情况：
 *   - 尚未学习：这一知识点的有效作答少于 3 次（没有记录的知识点也算这一类）
 *   - 已掌握  ：作答 ≥ 3 次 + 最近 3 次全对 + 该知识点没有待复习的错题
 *   - 还需练习：其余情况（近期不稳定，或还有错题没复习）
 * 这是给孩子看的学习提示，不是科学测验，也不代表绝对准确的能力评估。
 */
(function (root) {
  'use strict';
  root.ZCD = root.ZCD || {};
  var ZCD = root.ZCD;
  var util = ZCD.util;

  var RULES = {
    MIN_ATTEMPTS: 3,    // 至少完成 3 次有效作答
    RECENT_WINDOW: 3,   // 最近 3 次
    RECENT_SIZE: 5      // 保留最近 5 次结果
  };

  var STATUS = {
    new: { key: 'new', label: '尚未学习', emoji: '🌱', color: '#64798f', soft: '#eef2f7', order: 1 },
    practice: { key: 'practice', label: '还需练习', emoji: '💪', color: '#c8492f', soft: '#ffeeea', order: 0 },
    mastered: { key: 'mastered', label: '已掌握', emoji: '✅', color: '#0b7a5b', soft: '#e5f8f2', order: 2 }
  };

  var DISCLAIMER = '这是根据你的答题记录做出的轻量学习提示，方便安排下一步练习，不是考试成绩，也不代表绝对的能力水平。';

  /** 每个知识点下仍然「待复习」的错题数量 */
  function openWrongByPoint() {
    var map = {};
    var list = ZCD.store.wrongList();
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.status === 'mastered') continue;
      var k = ZCD.store.pointKey(e.grade, e.subject, e.point);
      map[k] = (map[k] || 0) + 1;
    }
    return map;
  }

  /** 单点判定 */
  function judge(stat, openWrong) {
    var answered = stat ? (stat.answered || 0) : 0;
    var recent = (stat && stat.recent) ? stat.recent : [];
    var last3 = recent.slice(-RULES.RECENT_WINDOW);
    var recentWrong = 0;
    for (var i = 0; i < last3.length; i++) if (!last3[i]) recentWrong++;

    if (answered < RULES.MIN_ATTEMPTS) {
      return {
        status: 'new',
        reason: answered === 0
          ? '还没有做过这个知识点的题'
          : '只作答了 ' + answered + ' 次（判断掌握需要至少 ' + RULES.MIN_ATTEMPTS + ' 次练习）'
      };
    }
    if (openWrong > 0) {
      return { status: 'practice', reason: '还有 ' + openWrong + ' 道这个知识点的错题没有复习' };
    }
    if (last3.length >= RULES.RECENT_WINDOW && recentWrong === 0) {
      return { status: 'mastered', reason: '最近 ' + last3.length + ' 次都答对了，也没有待复习的错题' };
    }
    if (recentWrong > 0) {
      return { status: 'practice', reason: '最近 ' + last3.length + ' 次里有 ' + recentWrong + ' 次答错' };
    }
    return { status: 'practice', reason: '练习次数还不够稳定，再多做几次看看' };
  }

  /** 汇总所有知识点（包括题库里存在但从未作答的知识点） */
  function buildAll() {
    var stats = ZCD.store.pointStats();
    var openWrong = openWrongByPoint();
    var rows = {};

    // 1. 题库里的全部知识点
    var qs = ZCD.data.allQuestions();
    for (var i = 0; i < qs.length; i++) {
      var q = qs[i];
      if (!q.point) continue;
      var key = ZCD.store.pointKey(q.grade, q.subject, q.point);
      if (!rows[key]) {
        rows[key] = { key: key, grade: Number(q.grade), subject: q.subject, point: q.point, packIds: {}, questionCount: 0 };
      }
      rows[key].questionCount++;
      if (q.packId) rows[key].packIds[q.packId] = true;
    }
    // 2. 有记录但题库已删除的知识点（例如自定义题库被删掉之后）
    for (var k in stats) {
      if (!Object.prototype.hasOwnProperty.call(stats, k)) continue;
      var st = stats[k];
      if (!rows[k]) {
        rows[k] = { key: k, grade: st.grade, subject: st.subject, point: st.point, packIds: {}, questionCount: 0 };
      }
    }

    var out = [];
    for (var kk in rows) {
      if (!Object.prototype.hasOwnProperty.call(rows, kk)) continue;
      var r = rows[kk];
      var stat = stats[kk] || null;
      var j = judge(stat, openWrong[kk] || 0);
      var recentErr = 0;
      var recent = stat ? (stat.recent || []) : [];
      var last3 = recent.slice(-RULES.RECENT_WINDOW);
      for (var n = 0; n < last3.length; n++) if (!last3[n]) recentErr++;
      out.push({
        key: kk,
        grade: r.grade,
        subject: r.subject,
        point: r.point,
        packIds: Object.keys(r.packIds),
        questionCount: r.questionCount,
        answered: stat ? stat.answered : 0,
        correct: stat ? stat.correct : 0,
        accuracy: util.pct(stat ? stat.correct : 0, stat ? stat.answered : 0),
        recent: recent.slice(),
        recentWrong: recentErr,
        lastAt: stat ? (stat.lastAt || 0) : 0,
        wrongEvents: stat ? (stat.wrongEvents || 0) : 0,
        reviewCount: stat ? (stat.reviewCount || 0) : 0,
        reviewCorrect: stat ? (stat.reviewCorrect || 0) : 0,
        wrongOpen: openWrong[kk] || 0,
        status: j.status,
        reason: j.reason
      });
    }

    out.sort(function (a, b) {
      if (STATUS[a.status].order !== STATUS[b.status].order) return STATUS[a.status].order - STATUS[b.status].order;
      if (b.wrongOpen !== a.wrongOpen) return b.wrongOpen - a.wrongOpen;
      return (b.lastAt || 0) - (a.lastAt || 0);
    });
    return out;
  }

  /** 总览：状态计数 + 各学科分布 */
  function overview() {
    var all = buildAll();
    var counts = { new: 0, practice: 0, mastered: 0 };
    var bySubject = {};
    for (var i = 0; i < all.length; i++) {
      var r = all[i];
      counts[r.status]++;
      var s = bySubject[r.subject];
      if (!s) {
        s = bySubject[r.subject] = { subject: r.subject, total: 0, new: 0, practice: 0, mastered: 0, studied: 0, answered: 0, correct: 0, wrongOpen: 0 };
      }
      s.total++;
      s[r.status]++;
      s.wrongOpen += r.wrongOpen;
      if (r.answered > 0) {
        s.studied++;
        s.answered += r.answered;
        s.correct += r.correct;
      }
    }
    var order = ['math', 'chinese', 'english', 'science'];
    var subjects = [];
    for (var j = 0; j < order.length; j++) if (bySubject[order[j]]) subjects.push(bySubject[order[j]]);
    for (var k in bySubject) {
      if (Object.prototype.hasOwnProperty.call(bySubject, k) && order.indexOf(k) < 0) subjects.push(bySubject[k]);
    }
    return {
      all: all,
      counts: counts,
      total: all.length,
      studied: all.filter(function (r) { return r.answered > 0; }),
      bySubject: subjects,
      masteredPercent: util.pct(counts.mastered, all.length)
    };
  }

  /** 需要优先复习的知识点：有未复习错题、或最近出错 */
  function priorityList(limit) {
    var all = buildAll();
    var list = all.filter(function (r) { return r.wrongOpen > 0 || r.recentWrong > 0; });
    list.sort(function (a, b) {
      if (b.wrongOpen !== a.wrongOpen) return b.wrongOpen - a.wrongOpen;
      if (b.recentWrong !== a.recentWrong) return b.recentWrong - a.recentWrong;
      return (b.lastAt || 0) - (a.lastAt || 0);
    });
    return typeof limit === 'number' ? list.slice(0, limit) : list;
  }

  /** 最近掌握得最好的知识点 */
  function masteredList(limit) {
    var list = buildAll().filter(function (r) { return r.status === 'mastered'; });
    list.sort(function (a, b) { return (b.lastAt || 0) - (a.lastAt || 0); });
    return typeof limit === 'number' ? list.slice(0, limit) : list;
  }

  /** 为一个知识点找一处可练的关卡（优先还没通关、且已解锁的关卡） */
  function targetFor(row) {
    if (!row) return null;
    var qs = ZCD.data.allQuestions().filter(function (q) {
      return Number(q.grade) === Number(row.grade) && q.subject === row.subject && q.point === row.point && q.packId;
    });
    if (!qs.length) return null;
    var fallback = null;
    for (var i = 0; i < qs.length; i++) {
      var q = qs[i];
      var unlocked = ZCD.store.isLevelUnlocked(q.packId, q.level);
      var cleared = ZCD.store.isLevelCleared(q.packId, q.level);
      if (unlocked && !cleared) return { packId: q.packId, level: q.level, unlocked: true };
      if (!fallback && unlocked) fallback = { packId: q.packId, level: q.level, unlocked: true };

  }

  /** 复习队列：优先「还需练习」知识点下的错题，其余按最近答错时间倒序 */
  function reviewQueue(limit) {
    var pending = ZCD.store.wrongList({ status: 'pending' });
    var cap = typeof limit === 'number' ? limit : 30;
    var practiceKeys = {};
    var all = buildAll();
    for (var i = 0; i < all.length; i++) {
      if (all[i].status === 'practice') practiceKeys[all[i].key] = true;
    }
    var sorted = pending.slice().sort(function (a, b) {
      var pa = practiceKeys[ZCD.store.pointKey(a.grade, a.subject, a.point)] ? 1 : 0;
      var pb = practiceKeys[ZCD.store.pointKey(b.grade, b.subject, b.point)] ? 1 : 0;
      if (pa !== pb) return pb - pa;
      return (b.lastWrongAt || b.ts || 0) - (a.lastWrongAt || a.ts || 0);
    });
    return {
      list: sorted.slice(0, cap),
      total: pending.length,
      truncated: pending.length > cap
    };
  }

  /** 最近一次学习表现 */
  function lastPerformance() {
    var records = ZCD.store.recentLevelRecords(1);
    var last = records[0] || null;
    var pack = last && last.packId && ZCD.data ? ZCD.data.getPack(last.packId) : null;
    var answers = ZCD.store.recentAnswers(5);
    return {
      level: last,
      pack: pack,
      packName: pack ? pack.name : (last ? last.packId : ''),
      levelName: last ? (pack ? ZCD.data.levelName(pack, last.level) : '第 ' + last.level + ' 关') : '',
      accuracy: last ? (last.bestAccuracy || 0) : 0,
      stars: last ? (last.bestStars || 0) : 0,
      cleared: last ? !!last.cleared : false,
      at: last ? last.lastAt : 0,
      recentAnswers: answers,
      recentCorrect: answers.filter(function (a) { return a.correct; }).length,
      recentTotal: answers.length
    };
  }

  /** 下一步学习建议：固定规则生成，最多 4 条 */
  function suggestions(limit) {
    var out = [];
    var wrong = ZCD.store.wrongStats();
    var all = buildAll();
    var priority = priorityList();
    var mastered = masteredList();

    if (wrong.pending > 0) {
      out.push({
        icon: '📕',
        text: '错题本里还有 ' + wrong.pending + ' 道待巩固的错题，先把它们复习一遍，效果最明显。',
        action: { label: '复习全部待巩固错题', go: '/wrong', params: { status: 'pending' } }
      });
    }

    for (var i = 0; i < priority.length && out.length < 3; i++) {
      var p = priority[i];
      if (p.wrongOpen === 0 && p.recentWrong === 0) continue;
      var target = targetFor(p);
      var reason = p.wrongOpen > 0
        ? '还有 ' + p.wrongOpen + ' 道错题没复习'
        : '最近 ' + Math.min(p.recent.length, RULES.RECENT_WINDOW) + ' 次里有 ' + p.recentWrong + ' 次答错';
      out.push({
        icon: '💪',
        text: '「' + ZCD.gradeLabel(p.grade) + '·' + ZCD.subjectMeta(p.subject).name + '·' + p.point + '」' + reason + '，建议回这一关重新练一遍。',
        action: target && target.unlocked
          ? { label: '去重练这一关', go: '/quiz', params: { pack: target.packId, level: target.level } }
          : { label: '去闯关地图', go: '/map', params: { pack: target ? target.packId : '' } }
      });
    }

    if (out.length < 3) {
      for (var j = 0; j < mastered.length && out.length < 3; j++) {

        var t = targetFor(m);
        if (!t || !t.unlocked) continue;
        if (ZCD.store.isLevelCleared(t.packId, t.level)) continue;
        var pack = ZCD.data.getPack(m.packId || t.packId);
        out.push({

          text: '「' + m.point + '」已经掌握得不错了，可以继续挑战新的关卡。',

    if (out.length < 3) {

        });
      } else if (notStarted > 0) {
        out.push({
          icon: '📚',
          text: '还有 ' + notStarted + ' 个知识点没有开始学习，可以挑一个继续闯关。',
          action: { label: '去选知识包', go: '/select', params: {} }
        });
      } else {
        out.push({
          icon: '🔁',
          text: '所有知识点都练过了，可以回头重挑战关卡，把星级刷到 3 星。',
          action: { label: '去闯关地图', go: '/select', params: {} }
        });
      }
    }

    return typeof limit === 'number' ? out.slice(0, limit) : out;
  }

  ZCD.mastery = {
    RULES: RULES,
    STATUS: STATUS,
    DISCLAIMER: DISCLAIMER,
    judge: judge,
    openWrongByPoint: openWrongByPoint,
    buildAll: buildAll,
    overview: overview,
    priorityList: priorityList,
    masteredList: masteredList,
    reviewQueue: reviewQueue,
    targetFor: targetFor,
    lastPerformance: lastPerformance,
    suggestions: suggestions
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<script>
/*!
 * 知闯岛 · 通用 UI 组件（提示条、弹窗、进度条、地图路径、庆祝动画）
 */
(function (root) {
  'use strict';
  root.ZCD = root.ZCD || {};
  var ZCD = root.ZCD;
  var util = ZCD.util;

  var ui = {};

  /* ---------------- 轻提示 ---------------- */
  ui.toast = function (message, type, ms) {
    var layer = util.byId('toast-layer');
    if (!layer) return;
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = message;
    layer.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .25s, transform .25s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(8px)';
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    }, ms || 2200);
  };

  /* ---------------- 弹窗 ---------------- */
  var modalCleanup = null;
  var modalKeyHandler = null;

  ui.closeModal = function () {
    var layer = util.byId('modal-layer');
    if (!layer) return;
    layer.hidden = true;
    layer.innerHTML = '';
    if (modalKeyHandler) {
      document.removeEventListener('keydown', modalKeyHandler);
      modalKeyHandler = null;
    }
    if (modalCleanup) { try { modalCleanup(); } catch (e) {} modalCleanup = null; }
  };

  /**
   * 打开弹窗
   * @param {{title:string, body:string, footer:string, onMount:Function, onClose:Function}} opts
   */
  ui.openModal = function (opts) {
    var layer = util.byId('modal-layer');
    if (!layer) return;
    layer.hidden = false;
    layer.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-head">' + (opts.title || '') + '</div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        '<div class="modal-foot">' + (opts.footer || '<button class="btn btn-soft" data-modal-close>关闭</button>') + '</div>' +
      '</div>';
    util.on(layer, '[data-modal-close]', 'click', function () { ui.closeModal(); });
    layer.onclick = function (ev) { if (ev.target === layer && opts.dismissable !== false) ui.closeModal(); };
    modalCleanup = opts.onClose || null;
    if (opts.onMount) opts.onMount(layer.querySelector('.modal'));

    // Esc 关闭 + 焦点落到第一个按钮，方便键盘与无障碍使用
    if (modalKeyHandler) document.removeEventListener('keydown', modalKeyHandler);
    modalKeyHandler = function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); ui.closeModal(); }
    };
    document.addEventListener('keydown', modalKeyHandler);
    var firstBtn = layer.querySelector('.modal-foot .btn');
    if (firstBtn) setTimeout(function () { try { firstBtn.focus(); } catch (e) {} }, 40);
  };

  /** 确认框，返回 Promise<boolean> */
  ui.confirm = function (opts) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(v) {
        if (done) return;
        done = true;
        ui.closeModal();
        resolve(v);
      }
      ui.openModal({
        title: opts.title || '请确认',
        body: opts.body || '',
        footer:
          '<button class="btn btn-soft" data-act="cancel">' + (opts.cancelText || '取消') + '</button>' +
          '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-act="ok">' + (opts.okText || '确定') + '</button>',
        onMount: function (modal) {
          util.on(modal, '[data-act="ok"]', 'click', function () { finish(true); });
          util.on(modal, '[data-act="cancel"]', 'click', function () { finish(false); });
        },
        onClose: function () { finish(false); }
      });
    });
  };

  /** 输入框弹窗，返回 Promise<string|null> */
  ui.prompt = function (opts) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(v) {
        if (done) return;
        done = true;
        ui.closeModal();
        resolve(v);
      }
      ui.openModal({
        title: opts.title || '请输入',
        body:
          '<label class="field-label">' + util.esc(opts.label || '') + '</label>' +
          '<input class="field" id="prompt-input" maxlength="' + (opts.maxlength || 20) + '" value="' + util.esc(opts.value || '') + '" placeholder="' + util.esc(opts.placeholder || '') + '">' +
          (opts.hint ? '<p class="text-xs text-muted mt-8">' + util.esc(opts.hint) + '</p>' : ''),
        footer: '<button class="btn btn-soft" data-act="cancel">取消</button><button class="btn btn-primary" data-act="ok">保存</button>',
        onMount: function (modal) {
          var input = modal.querySelector('#prompt-input');
          setTimeout(function () { input.focus(); input.select(); }, 30);
          input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') finish(input.value.trim() || null); });
          util.on(modal, '[data-act="ok"]', 'click', function () { finish(input.value.trim() || null); });
          util.on(modal, '[data-act="cancel"]', 'click', function () { finish(null); });
        },
        onClose: function () { finish(null); }
      });
    });
  };

  /* ---------------- 小组件 ---------------- */
  ui.bar = function (percent, cls) {
    return '<div class="bar ' + (cls || '') + '"><i style="width:' + util.clamp(percent, 0, 100) + '%"></i></div>';
  };

  ui.stars = function (n, max) {
    return '<span class="node-stars">' + util.starsText(n, max || 3) + '</span>';
  };

  ui.difficulty = function (d) {
    d = util.clamp(d, 1, 3);
    return '<span class="difficulty" title="难度 ' + d + '/3">' + util.starsText(d, 3) + '</span>';
  };

  ui.subjectChip = function (key) {
    var s = ZCD.subjectMeta(key);
    return '<span class="chip" style="background:' + s.soft + ';color:' + s.color + ';border-color:' + s.soft + '">' + s.emoji + ' ' + util.esc(s.name) + '</span>';
  };

  ui.gradeChip = function (g) {
    return '<span class="chip chip-gray">' + util.esc(ZCD.gradeLabel(g)) + '</span>';
  };

  ui.empty = function (emoji, text, extraHtml) {
    return '<div class="empty-state"><div class="empty-emoji">' + emoji + '</div><div class="empty-text">' +
      util.esc(text) + '</div>' + (extraHtml ? '<div class="mt-12">' + extraHtml + '</div>' : '') + '</div>';
  };

  /** 徽章卡片 */
  ui.badge = function (b) {
    return '<div class="badge-tile' + (b.earned ? ' is-earned' : '') + '">' +
      '<div class="badge-emoji">' + (b.earned ? b.emoji : '🔒') + '</div>' +
      '<div class="badge-name">' + util.esc(b.name) + '</div>' +
      '<div class="badge-desc">' + util.esc(b.desc) + '</div>' +
    '</div>';
  };

  /* ---------------- 地图路径 ---------------- */

  /** 用 Catmull-Rom 转三次贝塞尔，画出蜿蜒小路 */
  ui.smoothPath = function (pts) {
    if (!pts || pts.length < 2) return '';
    var d = 'M ' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i];
      var p1 = pts[i];
      var p2 = pts[i + 1];
      var p3 = pts[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6;
      var c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6;
      var c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ' C ' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
    }
    return d;
  };

  /** 关卡在岛上的位置（百分比） */
  ui.nodePositions = [
    { x: 22, y: 90 },
    { x: 74, y: 77 },
    { x: 26, y: 62 },
    { x: 72, y: 47 },
    { x: 30, y: 32 },
    { x: 70, y: 17 },
    { x: 34, y: 8 }
  ];

  /* ---------------- 庆祝彩带（数量可控，尊重减少动画偏好） ---------------- */
  ui.confetti = function (host, count) {
    if (!host) return;
    var reduce = document.body.classList.contains('reduce-motion') ||
      (root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (reduce) return;
    var colors = ['#ffd98a', '#ff7a45', '#12a37a', '#6fc3ec', '#f5a524', '#8b5cf6'];
    var n = count || 34;
    var box = document.createElement('div');
    box.className = 'confetti';
    for (var i = 0; i < n; i++) {
      var s = document.createElement('i');
      s.style.left = (Math.random() * 100).toFixed(1) + '%';
      s.style.background = colors[i % colors.length];
      s.style.animationDuration = (1.5 + Math.random() * 1.4).toFixed(2) + 's';
      s.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
      s.style.width = (5 + Math.random() * 6).toFixed(1) + 'px';
      box.appendChild(s);
    }
    host.appendChild(box);
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 3600);
  };

  ZCD.ui = ui;
})(typeof globalThis !== 'undefined' ? globalThis : this);
